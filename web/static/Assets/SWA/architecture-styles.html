<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Architectural Styles Overview</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --line: #d7dee8;
      --line-strong: #94a3b8;
      --text: #172033;
      --muted: #64748b;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --green: #0f766e;
      --green-soft: #ecfdf5;
      --amber: #b45309;
      --amber-soft: #fffbeb;
      --violet: #6d28d9;
      --violet-soft: #f5f3ff;
      --rose: #be123c;
      --rose-soft: #fff1f2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button { font: inherit; }

    .widget {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      min-height: 100vh;
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .eyebrow {
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 880px;
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.45;
    }

    .controls {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
    }

    .btn,
    .tab {
      border: 1px solid var(--line);
      border-radius: 7px;
      color: var(--text);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .btn {
      padding: 7px 10px;
      min-width: 70px;
    }

    .btn.primary {
      border-color: #1d4ed8;
      color: #fff;
      background: var(--blue);
    }

    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 4px;
    }

    .tab {
      flex: 0 0 auto;
      padding: 7px 9px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .tab.active {
      border-color: #1d4ed8;
      color: #1d4ed8;
      background: var(--blue-soft);
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 10px;
      min-height: 0;
    }

    .diagram-panel,
    .notes {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .diagram-panel {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 520px;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      min-height: 470px;
      background:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 36px 36px;
      background-color: #fff;
    }

    .caption {
      min-height: 58px;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      background: #fbfdff;
      line-height: 1.45;
    }

    .caption b { color: var(--blue); }

    .notes {
      display: grid;
      align-content: start;
      gap: 12px;
      padding: 14px;
    }

    .note-section {
      display: grid;
      gap: 6px;
    }

    .note-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .note-section p {
      margin: 0;
      line-height: 1.45;
    }

    ul {
      margin: 0;
      padding-left: 18px;
    }

    li {
      margin: 4px 0;
      line-height: 1.35;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .box {
      fill: rgba(248, 250, 252, .76);
      stroke: #cbd5e1;
      stroke-width: 1.5;
      stroke-dasharray: 6 5;
    }

    .box-label {
      fill: #64748b;
      font-size: 12px;
      font-weight: 750;
    }

    .edge {
      fill: none;
      stroke: #9aa8bb;
      stroke-width: 2.2;
      marker-end: url(#arrow);
    }

    .edge.async { stroke-dasharray: 7 6; }
    .edge.active {
      stroke: var(--blue);
      stroke-width: 3.4;
    }

    .edge-label-bg {
      fill: #fff;
      stroke: #e2e8f0;
      stroke-width: 1;
    }

    .edge-label {
      fill: #475569;
      font-size: 10.5px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node rect {
      stroke-width: 1.7;
    }

    .node .title {
      fill: var(--text);
      font-size: 12.5px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node .sub {
      fill: #64748b;
      font-size: 10.5px;
      font-weight: 650;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .node.core rect,
    .node.service rect {
      fill: var(--blue-soft);
      stroke: #3b82f6;
    }

    .node.actor rect {
      fill: #f8fafc;
      stroke: #94a3b8;
    }

    .node.data rect {
      fill: var(--green-soft);
      stroke: #10b981;
    }

    .node.integration rect,
    .node.broker rect {
      fill: var(--violet-soft);
      stroke: #8b5cf6;
    }

    .node.risk rect {
      fill: var(--amber-soft);
      stroke: #f59e0b;
    }

    .node.active rect {
      stroke: var(--blue);
      stroke-width: 3;
    }

    .packet {
      fill: var(--blue);
      stroke: #fff;
      stroke-width: 2;
    }

    @media (max-width: 900px) {
      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .main {
        grid-template-columns: 1fr;
      }

      .diagram-panel {
        min-height: 500px;
      }
    }
  </style>
</head>
<body>

        <div class="eyebrow">Software architecture</div>
        <h1 id="title"></h1>
        <div class="subtitle" id="subtitle"></div>

      <div class="controls">
        <button class="btn" id="prevBtn">Prev</button>
        <button class="btn primary" id="playBtn">Pause</button>
        <button class="btn" id="nextBtn">Next</button>
      </div>
    </header>

    <nav class="tabs" id="tabs" aria-label="Architectural styles"></nav>

    <main class="main">

            </marker>
          </defs>

        <div class="caption" id="caption"></div>

      <aside class="notes">

        <section class="note-section">
          <div class="note-title">Quality attributes</div>
          <div class="badge-row" id="qualities"></div>
        </section>
      </aside>
    </main>
  </div>

    const svg = document.getElementById("diagram");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const caption = document.getElementById("caption");
    const tabs = document.getElementById("tabs");
    const idea = document.getElementById("idea");
    const playBtn = document.getElementById("playBtn");

    const params = new URLSearchParams(window.location.search);
    const requested = params.get("style");
    let current = Math.max(0, diagrams.findIndex(item => item.id === requested));
    let step = 0;
    let playing = true;
    let timer = null;

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function nodeMap(diagram) {
      return new Map(diagram.nodes.map(node => [node.id, node]));
    }

    function trimPoint(from, to) {
      const dx = to.x - from.x;
      const dy = to.y - from.y;
      if (dx === 0 && dy === 0) return { x: from.x, y: from.y };
      const scale = 1 / Math.max(Math.abs(dx) / (from.w / 2), Math.abs(dy) / (from.h / 2));
      return { x: from.x + dx * scale, y: from.y + dy * scale };
    }

    function edgePath(edge, nodes) {
      const from = nodes.get(edge.from);
      const to = nodes.get(edge.to);
      const start = trimPoint(from, to);
      const end = trimPoint(to, from);
      return `M ${start.x} ${start.y} L ${end.x} ${end.y}`;
    }

    function midpoint(path) {
      const nums = path.match(/-?\d+(\.\d+)?/g).map(Number);
      return { x: (nums[0] + nums[2]) / 2, y: (nums[1] + nums[3]) / 2 };
    }

    function renderList(id, items) {
      const root = document.getElementById(id);
      root.innerHTML = "";
      items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item;
        root.appendChild(li);
      });
    }

    function renderBadges(items) {
      const root = document.getElementById("qualities");
      root.innerHTML = "";
      items.forEach(item => {
        const span = document.createElement("span");
        span.className = "badge";
        span.textContent = item;
        root.appendChild(span);
      });
    }

    function renderTabs() {
      tabs.innerHTML = "";
      diagrams.forEach((diagram, index) => {
        const button = document.createElement("button");
        button.className = "tab";
        button.textContent = diagram.tab;
        button.addEventListener("click", () => selectDiagram(index));
        tabs.appendChild(button);
      });
    }

    function renderBoxes(diagram) {
      const layer = svgEl("g", { class: "runtime" });
      (diagram.boxes || []).forEach(box => {
        layer.appendChild(svgEl("rect", {
          class: "box",
          x: box.x,
          y: box.y,
          width: box.w,
          height: box.h,
          rx: 8
        }));
        const label = svgEl("text", {
          class: "box-label",
          x: box.x + 12,
          y: box.y + 22
        });
        label.textContent = box.label;
        layer.appendChild(label);
      });
      svg.appendChild(layer);
    }

    function renderEdges(diagram) {
      const nodes = nodeMap(diagram);
      const layer = svgEl("g", { class: "runtime" });
      const activeIndex = step % diagram.edges.length;

      diagram.edges.forEach((edge, index) => {
        const pathData = edgePath(edge, nodes);
        const path = svgEl("path", {
          class: `edge ${edge.type || ""} ${index === activeIndex ? "active" : ""}`,
          d: pathData
        });
        layer.appendChild(path);

        if (edge.label) {
          const mid = midpoint(pathData);
          const group = svgEl("g", { class: "edge-label-group" });
          group.appendChild(svgEl("rect", {
            class: "edge-label-bg",
            x: mid.x - 40,
            y: mid.y - 12,
            width: 80,
            height: 22,
            rx: 5
          }));
          const text = svgEl("text", { class: "edge-label", x: mid.x, y: mid.y });
          text.textContent = edge.label;
          group.appendChild(text);
          layer.appendChild(group);
        }

        if (index === activeIndex) {
          const packet = svgEl("circle", { class: "packet", r: 6 });
          const motion = svgEl("animateMotion", {
            dur: "1.8s",
            repeatCount: "indefinite",
            path: pathData
          });
          packet.appendChild(motion);
          layer.appendChild(packet);
        }
      });

      svg.appendChild(layer);
    }

    function renderNodes(diagram) {
      const activeEdge = diagram.edges[step % diagram.edges.length];
      const activeIds = new Set([activeEdge.from, activeEdge.to]);
      const layer = svgEl("g", { class: "runtime" });

      diagram.nodes.forEach(node => {
        const group = svgEl("g", {
          class: `node ${node.kind} ${activeIds.has(node.id) ? "active" : ""}`
        });
        group.appendChild(svgEl("rect", {
          x: node.x - node.w / 2,
          y: node.y - node.h / 2,
          width: node.w,
          height: node.h,
          rx: 7
        }));

        const main = svgEl("text", {
          class: "title",
          x: node.x,
          y: node.y - (node.sub ? 7 : 0)
        });
        main.textContent = node.label;
        group.appendChild(main);

        if (node.sub) {
          const sub = svgEl("text", {
            class: "sub",
            x: node.x,
            y: node.y + 14
          });
          sub.textContent = node.sub;
          group.appendChild(sub);
        }

        layer.appendChild(group);
      });

      svg.appendChild(layer);
    }

    function renderDiagram() {
      [...svg.querySelectorAll(".runtime")].forEach(el => el.remove());
      const diagram = diagrams[current];
      renderBoxes(diagram);
      renderEdges(diagram);
      renderNodes(diagram);
    }

    function render() {
      const diagram = diagrams[current];
      title.textContent = diagram.title;
      subtitle.textContent = diagram.subtitle;
      idea.textContent = diagram.idea;
      renderList("fits", diagram.fits);
      renderList("risks", diagram.risks);
      renderBadges(diagram.qualities);
      [...tabs.children].forEach((tab, index) => tab.classList.toggle("active", index === current));

      const edge = diagram.edges[step % diagram.edges.length];
      const text = diagram.steps[step % diagram.steps.length];
      caption.innerHTML = `<b>${edge.label || "Flow"}:</b> ${text}`;
      renderDiagram();
    }

    function selectDiagram(index) {
      current = (index + diagrams.length) % diagrams.length;
      step = 0;
      render();
      restart();
    }

    function tick() {
      const diagram = diagrams[current];
      step = (step + 1) % Math.max(diagram.edges.length, diagram.steps.length);
      render();
    }

    function restart() {
      clearInterval(timer);
      if (playing) timer = setInterval(tick, 2400);
      playBtn.textContent = playing ? "Pause" : "Play";
    }

    document.getElementById("prevBtn").addEventListener("click", () => selectDiagram(current - 1));
    document.getElementById("nextBtn").addEventListener("click", () => selectDiagram(current + 1));
    playBtn.addEventListener("click", () => {
      playing = !playing;
      restart();
    });

    renderTabs();
    render();
    restart();
  </script>
