<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Architectural Styles Overview</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #162033;
      --line: rgba(148, 163, 184, .24);
      --text: #e5eefc;
      --muted: #9caec6;
      --cyan: #22d3ee;
      --blue: #60a5fa;
      --green: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --violet: #a78bfa;
      --shadow: 0 22px 60px rgba(0, 0, 0, .32);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 880px;
      padding: 14px;
      overflow-x: auto;
      color: var(--text);
      background:
        radial-gradient(circle at 5% 0%, rgba(34, 211, 238, .14), transparent 28rem),
        radial-gradient(circle at 100% 100%, rgba(167, 139, 250, .12), transparent 30rem),
        var(--bg);
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 14px;
    }

    button { font: inherit; }

    .shell { max-width: 1260px; margin: 0 auto; }

    .topbar,
    .stage,
    .panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(17, 24, 39, .84);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .eyebrow,
    .panel-title,
    .label {
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 2px 0 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      max-width: 780px;
      color: var(--muted);
      line-height: 1.45;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .btn {
      border: 1px solid rgba(96, 165, 250, .45);
      border-radius: 8px;
      padding: 7px 10px;
      color: #dbeafe;
      background: rgba(30, 41, 59, .9);
      font-weight: 750;
      cursor: pointer;
    }

    .btn.primary {
      border-color: rgba(34, 211, 238, .65);
      color: #07111f;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 10px;
    }

    .stage {
      overflow: hidden;
      background:
        linear-gradient(rgba(148, 163, 184, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .045) 1px, transparent 1px),
        rgba(15, 23, 42, .75);
      background-size: 24px 24px;
    }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, .55);
    }

    .tab {
      min-width: max-content;
      border: 1px solid rgba(148, 163, 184, .20);
      border-radius: 8px;
      padding: 7px 9px;
      color: var(--muted);
      background: rgba(30, 41, 59, .78);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      border-color: rgba(34, 211, 238, .72);
      color: #ecfeff;
      background: rgba(8, 145, 178, .34);
    }

    .diagram-wrap {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      min-height: 500px;
      padding: 12px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { width: 9px; height: 9px; border-radius: 99px; display: inline-block; }
    .dot.core { background: var(--cyan); }
    .dot.data { background: var(--green); }
    .dot.external { background: var(--amber); }
    .dot.risk { background: var(--rose); }

    svg {
      width: 100%;
      height: 390px;
      border: 1px solid rgba(148, 163, 184, .18);
      border-radius: 12px;
      background: rgba(15, 23, 42, .74);
    }

    .edge {
      fill: none;
      stroke: rgba(148, 163, 184, .45);
      stroke-width: 3;
      marker-end: url(#arrow);
    }

    .edge.async { stroke-dasharray: 8 7; }
    .edge.active {
      stroke: var(--cyan);
      stroke-width: 5;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, .42));
    }

    .edge.risk { stroke: rgba(251, 113, 133, .68); }

    .node rect,
    .node circle,
    .node path {
      fill: rgba(17, 24, 39, .96);
      stroke: rgba(203, 213, 225, .72);
      stroke-width: 2;
    }

    .node.core rect,
    .node.core circle { stroke: var(--cyan); }
    .node.data rect,
    .node.data circle { stroke: var(--green); }
    .node.external rect,
    .node.external circle { stroke: var(--amber); }
    .node.risk rect,
    .node.risk circle { stroke: var(--rose); }
    .node.active rect,
    .node.active circle {
      fill: rgba(8, 145, 178, .38);
      stroke: #67e8f9;
      filter: drop-shadow(0 0 10px rgba(34, 211, 238, .42));
    }

    .node text {
      fill: #f8fafc;
      font-weight: 850;
      text-anchor: middle;
      dominant-baseline: middle;
      font-size: 12px;
    }

    .node .sub {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .edge-label rect {
      fill: rgba(15, 23, 42, .94);
      stroke: rgba(148, 163, 184, .26);
      rx: 5;
    }

    .edge-label text {
      fill: #cbd5e1;
      font-size: 10px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .packet {
      fill: var(--amber);
      stroke: rgba(255, 255, 255, .75);
      stroke-width: 1.5;
      filter: drop-shadow(0 0 8px rgba(251, 191, 36, .58));
    }

    .caption {
      min-height: 78px;
      border-left: 3px solid var(--cyan);
      border-radius: 8px;
      padding: 10px 11px;
      color: #dbeafe;
      background: rgba(8, 145, 178, .13);
      line-height: 1.45;
    }

    .caption strong { color: #f8fafc; }

    .side {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .panel {
      padding: 12px;
      background: rgba(17, 24, 39, .88);
    }

    .bullets {
      display: grid;
      gap: 7px;
      margin-top: 8px;
    }

    .bullet {
      position: relative;
      padding-left: 14px;
      color: #d5deec;
      line-height: 1.35;
      font-size: 12px;
    }

    .bullet:before {
      content: "";
      position: absolute;
      left: 0;
      top: .55em;
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: var(--cyan);
    }

    .trade {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .trade-box {
      border: 1px solid rgba(148, 163, 184, .17);
      border-radius: 9px;
      padding: 8px;
      background: rgba(15, 23, 42, .66);
    }

    .trade-box b {
      display: block;
      margin-bottom: 5px;
      color: #f8fafc;
      font-size: 11px;
    }

    .trade-box.good { border-color: rgba(52, 211, 153, .32); }
    .trade-box.bad { border-color: rgba(251, 113, 133, .32); }

    .metric {
      display: grid;
      grid-template-columns: 90px 1fr;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .bar {
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(148, 163, 184, .16);
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    @media (max-width: 980px) {
      body { min-width: 0; }
      .layout { grid-template-columns: 1fr; }
      .side { grid-template-columns: 1fr 1fr; }
      svg { height: 360px; }
    }

    @media (max-width: 720px) {
      body { padding: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .side { grid-template-columns: 1fr; }
      svg { height: 330px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="eyebrow">Software architecture</div>
        <h1 id="title">Architectural style</h1>
        <div class="subtitle" id="subtitle"></div>
      </div>
      <div class="controls">
        <button class="btn" id="prevBtn">Prev</button>
        <button class="btn primary" id="playBtn">Pause flow</button>
        <button class="btn" id="nextBtn">Next</button>
      </div>
    </div>

    <div class="layout">
      <main class="stage">
        <div class="tabs" id="tabs"></div>
        <div class="diagram-wrap">
          <div class="legend">
            <span><i class="dot core"></i>core / business</span>
            <span><i class="dot data"></i>data / storage</span>
            <span><i class="dot external"></i>external actor</span>
            <span><i class="dot risk"></i>risk / bottleneck</span>
          </div>
          <svg id="diagram" viewBox="0 0 860 420" role="img" aria-label="Architecture diagram">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(203,213,225,.75)"></path>
              </marker>
            </defs>
          </svg>
          <div class="caption" id="caption"></div>
        </div>
      </main>

      <aside class="side">
        <section class="panel">
          <div class="panel-title">Kdy se hodi</div>
          <div class="bullets" id="fits"></div>
        </section>

        <section class="panel">
          <div class="panel-title">Trade-off</div>
          <div class="trade">
            <div class="trade-box good">
              <b>Podporuje</b>
              <div class="bullets" id="benefits"></div>
            </div>
            <div class="trade-box bad">
              <b>Zhorsuje</b>
              <div class="bullets" id="risks"></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">Quality attributes</div>
          <div id="metrics"></div>
        </section>
      </aside>
    </div>
  </div>

    function n(id, label, sub, x, y, kind, w = 128, h = 58) {
      return { id, label, sub, x, y, kind, w, h };
    }

    function e(from, to, label, type = "") {
      return { from, to, label, type };
    }

    const byId = new Map(styles.map((s, i) => [s.id, { style: s, index: i }]));
    const params = new URLSearchParams(location.search);
    let current = byId.get(params.get("style"))?.index ?? 0;
    let step = 0;
    let playing = true;
    let timer = null;

    const svg = document.getElementById("diagram");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const caption = document.getElementById("caption");
    const tabs = document.getElementById("tabs");
    const playBtn = document.getElementById("playBtn");

    function initTabs() {
      tabs.innerHTML = "";
      styles.forEach((style, index) => {
        const button = document.createElement("button");
        button.className = "tab";
        button.textContent = style.tab;
        button.addEventListener("click", () => selectStyle(index));
        tabs.appendChild(button);
      });
    }

    function selectStyle(index) {
      current = (index + styles.length) % styles.length;
      step = 0;
      render();
      restart();
    }

    function renderList(id, items) {
      const root = document.getElementById(id);
      root.innerHTML = "";
      items.forEach(text => {
        const div = document.createElement("div");
        div.className = "bullet";
        div.textContent = text;
        root.appendChild(div);
      });
    }

    function renderMetrics(metrics) {
      const root = document.getElementById("metrics");
      root.innerHTML = "";
      Object.entries(metrics).forEach(([key, value]) => {
        const row = document.createElement("div");
        row.className = "metric";
        row.innerHTML = `<span>${key}</span><div class="bar"><i style="width:${value}%"></i></div>`;
        root.appendChild(row);
      });
    }

    function nodeCenter(node) {
      return { x: node.x, y: node.y };
    }

    function edgePath(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const curve = Math.abs(dy) > 80 ? Math.sign(dy || 1) * 35 : 0;
      const c1x = a.x + dx * .42;
      const c1y = a.y + curve;
      const c2x = a.x + dx * .58;
      const c2y = b.y - curve;
      return `M ${a.x} ${a.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${b.x} ${b.y}`;
    }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function renderDiagram(style) {
      [...svg.querySelectorAll(".runtime")].forEach(el => el.remove());
      const nodeMap = new Map(style.nodes.map(node => [node.id, node]));
      const activeEdge = style.edges[step % style.edges.length];
      const activeIds = new Set(activeEdge ? [activeEdge.from, activeEdge.to] : []);

      const edgeLayer = svgEl("g", { class: "runtime edges" });
      style.edges.forEach((edge, index) => {
        const a = nodeCenter(nodeMap.get(edge.from));
        const b = nodeCenter(nodeMap.get(edge.to));
        const path = svgEl("path", {
          class: `edge ${edge.type || ""} ${index === step % style.edges.length ? "active" : ""}`,
          d: edgePath(a, b)
        });
        edgeLayer.appendChild(path);

        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2 - 8;
        const label = svgEl("g", { class: "edge-label" });
        label.appendChild(svgEl("rect", { x: mx - 42, y: my - 12, width: 84, height: 23 }));
        const text = svgEl("text", { x: mx, y: my });
        text.textContent = edge.label;
        label.appendChild(text);
        edgeLayer.appendChild(label);
      });
      svg.appendChild(edgeLayer);

      const nodeLayer = svgEl("g", { class: "runtime nodes" });
      style.nodes.forEach(node => {
        const group = svgEl("g", { class: `node ${node.kind || ""} ${activeIds.has(node.id) ? "active" : ""}` });
        group.appendChild(svgEl("rect", {
          x: node.x - node.w / 2,
          y: node.y - node.h / 2,
          width: node.w,
          height: node.h,
          rx: 12
        }));
        const text = svgEl("text", { x: node.x, y: node.y - (node.sub ? 7 : 0) });
        text.textContent = node.label;
        group.appendChild(text);
        if (node.sub) {
          const sub = svgEl("text", { class: "sub", x: node.x, y: node.y + 13 });
          sub.textContent = node.sub;
          group.appendChild(sub);
        }
        nodeLayer.appendChild(group);
      });
      svg.appendChild(nodeLayer);

      if (activeEdge) {
        const a = nodeCenter(nodeMap.get(activeEdge.from));
        const b = nodeCenter(nodeMap.get(activeEdge.to));
        const packet = svgEl("circle", { class: "packet runtime", r: 7 });
        const animX = svgEl("animate", {
          attributeName: "cx",
          values: `${a.x};${(a.x + b.x) / 2};${b.x}`,
          dur: "1.6s",
          repeatCount: "indefinite"
        });
        const animY = svgEl("animate", {
          attributeName: "cy",
          values: `${a.y};${(a.y + b.y) / 2};${b.y}`,
          dur: "1.6s",
          repeatCount: "indefinite"
        });
        packet.appendChild(animX);
        packet.appendChild(animY);
        svg.appendChild(packet);
      }
    }

    function render() {
      const style = styles[current];
      title.textContent = style.title;
      subtitle.textContent = style.subtitle;
      [...tabs.children].forEach((tab, index) => tab.classList.toggle("active", index === current));
      const activeStep = style.steps[step % style.steps.length];
      const edge = style.edges[step % style.edges.length];
      caption.innerHTML = `<strong>${edge?.label || "Flow"}:</strong> ${activeStep}`;
      renderList("fits", style.fits);
      renderList("benefits", style.benefits);
      renderList("risks", style.risks);
      renderMetrics(style.metrics);
      renderDiagram(style);
    }

    function tick() {
      const style = styles[current];
      step = (step + 1) % Math.max(style.edges.length, style.steps.length);
      render();
    }

    function restart() {
      clearInterval(timer);
      if (playing) timer = setInterval(tick, 2400);
      playBtn.textContent = playing ? "Pause flow" : "Play flow";
    }

    document.getElementById("prevBtn").addEventListener("click", () => selectStyle(current - 1));
    document.getElementById("nextBtn").addEventListener("click", () => selectStyle(current + 1));
    playBtn.addEventListener("click", () => {
      playing = !playing;
      restart();
    });

    initTabs();
    render();
    restart();
  </script>
