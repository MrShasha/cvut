<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">G1 garbage collector region cycle</title>
  <desc id="desc">Diagram showing G1 region-based heap and the simplified cycle from young GC through concurrent mark to mixed GC.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53627a"/>
    </marker>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #c9d1df; stroke-width: 2; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 700 19px Arial, sans-serif; fill: #24324a; }
      .label { font: 600 15px Arial, sans-serif; fill: #24324a; }
      .small { font: 400 13px Arial, sans-serif; fill: #53627a; }
      .tiny { font: 600 12px Arial, sans-serif; fill: #53627a; }
      .eden { fill: #fff2df; stroke: #d69a45; stroke-width: 1.5; }
      .surv { fill: #e8f1ff; stroke: #6a93d8; stroke-width: 1.5; }
      .old { fill: #eaf8ef; stroke: #62ad76; stroke-width: 1.5; }
      .free { fill: #f3f4f7; stroke: #aab4c3; stroke-width: 1.5; }
      .hum { fill: #fde8e8; stroke: #d46a6a; stroke-width: 1.5; }
      .phase { fill: #ffffff; stroke: #8c98ab; stroke-width: 1.6; }
      .arrow { stroke: #53627a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8c98ab; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="48" y="50">G1 GC: region heap and mixed collections</text>
  <text class="small" x="48" y="78">G1 chooses regions to evacuate. Mixed GC collects young regions plus selected old regions with much garbage.</text>

  <rect class="panel" x="45" y="110" width="1110" height="245" rx="16"/>
  <text class="subtitle" x="70" y="145">Region-based heap</text>
  <text class="small" x="70" y="170">Every region has a current role. Roles change over time.</text>

  <g transform="translate(75 205)">
    <rect class="eden" x="0" y="0" width="78" height="60" rx="8"/><text class="label" x="33" y="37">E</text>
    <rect class="eden" x="88" y="0" width="78" height="60" rx="8"/><text class="label" x="121" y="37">E</text>
    <rect class="surv" x="176" y="0" width="78" height="60" rx="8"/><text class="label" x="210" y="37">S</text>
    <rect class="old" x="264" y="0" width="78" height="60" rx="8"/><text class="label" x="298" y="37">O</text>
    <rect class="old" x="352" y="0" width="78" height="60" rx="8"/><text class="label" x="386" y="37">O</text>
    <rect class="free" x="440" y="0" width="78" height="60" rx="8"/><text class="label" x="474" y="37">F</text>
    <rect class="hum" x="528" y="0" width="78" height="60" rx="8"/><text class="label" x="561" y="37">H</text>
    <rect class="hum" x="616" y="0" width="78" height="60" rx="8"/><text class="label" x="649" y="37">H</text>
    <rect class="eden" x="704" y="0" width="78" height="60" rx="8"/><text class="label" x="737" y="37">E</text>
    <rect class="old" x="792" y="0" width="78" height="60" rx="8"/><text class="label" x="826" y="37">O</text>
    <rect class="free" x="880" y="0" width="78" height="60" rx="8"/><text class="label" x="914" y="37">F</text>
    <rect class="surv" x="968" y="0" width="78" height="60" rx="8"/><text class="label" x="1002" y="37">S</text>
  </g>

  <text class="tiny" x="95" y="305">E = Eden</text>
  <text class="tiny" x="190" y="305">S = Survivor</text>
  <text class="tiny" x="315" y="305">O = Old</text>
  <text class="tiny" x="410" y="305">F = Free</text>
  <text class="tiny" x="500" y="305">H = Humongous</text>

  <rect class="panel" x="45" y="390" width="1110" height="250" rx="16"/>
  <text class="subtitle" x="70" y="425">Simplified G1 cycle</text>

  <rect class="phase" x="95" y="470" width="155" height="82" rx="12"/>
  <text class="label" x="133" y="500">Young GC</text>
  <text class="small" x="118" y="525">evacuate young</text>

  <path class="arrow" d="M 260 511 H 330"/>

  <rect class="phase" x="340" y="470" width="170" height="82" rx="12"/>
  <text class="label" x="372" y="500">Concurrent</text>
  <text class="label" x="395" y="520">Mark</text>
  <text class="small" x="368" y="545">app mostly runs</text>

  <path class="arrow" d="M 520 511 H 590"/>

  <rect class="phase" x="600" y="470" width="155" height="82" rx="12"/>
  <text class="label" x="648" y="500">Remark</text>
  <text class="small" x="635" y="525">short STW</text>

  <path class="arrow" d="M 765 511 H 835"/>

  <rect class="phase" x="845" y="470" width="190" height="82" rx="12"/>
  <text class="label" x="890" y="500">Mixed GC</text>
  <text class="small" x="875" y="525">young + selected old</text>

  <path class="dash" d="M 940 552 C 880 625, 230 625, 172 552"/>
  <path class="arrow" d="M 172 552 C 160 545, 153 540, 145 533"/>

  <text class="small" x="90" y="602">If G1 cannot free space fast enough: evacuation failure or Full GC fallback.</text>
  <text class="small" x="700" y="602">Pause target guides decisions, but it is not a hard realtime guarantee.</text>
</svg>
