<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-label="Memory hierarchy from CPU registers to disk">
  <rect width="980" height="520" fill="#f7f9fb"/>
  <text x="490" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1f2937">Memory hierarchy</text>
  <text x="490" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">closer to CPU = faster, smaller, more expensive per byte</text>

  <g font-family="Arial, sans-serif">
    <rect x="355" y="112" width="270" height="54" rx="8" fill="#111827"/>
    <text x="490" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">CPU registers</text>
    <text x="655" y="145" font-size="14" fill="#374151">~1 cycle</text>

    <rect x="305" y="186" width="370" height="58" rx="8" fill="#2563eb"/>
    <text x="490" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">L1 cache</text>
    <text x="705" y="220" font-size="14" fill="#374151">~4 cycles</text>

    <rect x="255" y="264" width="470" height="58" rx="8" fill="#0891b2"/>
    <text x="490" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">L2 cache</text>
    <text x="755" y="298" font-size="14" fill="#374151">~10-15 cycles</text>

    <rect x="205" y="342" width="570" height="58" rx="8" fill="#16a34a"/>
    <text x="490" y="376" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">L3 cache</text>
    <text x="805" y="376" font-size="14" fill="#374151">~30-50 cycles</text>

    <rect x="155" y="420" width="670" height="58" rx="8" fill="#f59e0b"/>
    <text x="490" y="454" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">DRAM</text>
    <text x="855" y="454" font-size="14" fill="#374151">~200+ cycles</text>
  </g>

  <g stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M116 116 C76 194, 76 350, 116 454"/>
    <path d="M864 454 C904 350, 904 194, 864 116"/>
  </g>
  <text x="66" y="288" transform="rotate(-90 66 288)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">latency increases</text>
  <text x="916" y="288" transform="rotate(90 916 288)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#374151">capacity increases</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
