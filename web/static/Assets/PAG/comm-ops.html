<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kolektivní komunikační operace | přehled</title>
<style>
:root {
  --bg:#09101f;--panel:rgba(18,29,52,.94);--soft:rgba(255,255,255,.045);
  --line:rgba(142,164,204,.2);--text:#edf4ff;--muted:#9aa9c8;
  --cyan:#56e0dc;--green:#6ee7a8;--orange:#ffbd78;--violet:#aa91ff;
  --shadow:0 18px 45px rgba(0,0,0,.22);
}
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;padding:16px;color:var(--text);
  background:radial-gradient(circle at 10% 0%,rgba(72,123,232,.17),transparent 26rem),
    radial-gradient(circle at 95% 95%,rgba(68,209,186,.11),transparent 28rem),var(--bg);
  font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:14px;}
button,input{font:inherit;}button{cursor:pointer;}
.shell{width:min(1500px,100%);margin:0 auto;}
.hero{display:flex;justify-content:space-between;gap:16px;margin-bottom:13px;}
.eyebrow{color:var(--cyan);font-size:11px;font-weight:850;letter-spacing:.17em;text-transform:uppercase;}
h1{margin:5px 0 0;font-size:clamp(19px,2.5vw,28px);letter-spacing:-.04em;}
.hero p{max-width:700px;margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.55;}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 310px;gap:11px;}
.card{border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:var(--shadow);}
.card-pad{padding:12px;}
h2{margin:0 0 9px;color:#dceaff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;}
.op-list{display:grid;gap:5px;}
.op{width:100%;padding:8px;border:1px solid rgba(142,164,204,.13);border-radius:9px;
  color:var(--muted);background:var(--soft);text-align:left;transition:.18s ease;}
.op:hover{border-color:rgba(98,169,255,.52);color:var(--text);transform:translateX(2px);}
.op.active{border-color:rgba(86,224,220,.65);color:#e3fffe;background:rgba(86,224,220,.11);}
.op strong{display:block;font-size:11px;}
.op span{display:block;margin-top:2px;color:inherit;font-size:9px;line-height:1.35;opacity:.78;}
.scene-card{overflow:hidden;}
.scene-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 13px 8px;}
.scene-title{font-size:13px;font-weight:900;}
.scene-sub{margin-top:3px;color:var(--muted);font-size:11px;}
.topo-tabs{display:flex;gap:5px;flex-shrink:0;}
.ttab{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);
  color:var(--muted);font-size:10px;font-weight:850;transition:.18s ease;white-space:nowrap;}
.ttab:hover{border-color:rgba(86,224,220,.5);color:var(--text);}
.ttab.active{border-color:rgba(86,224,220,.65);color:#e3fffe;background:rgba(86,224,220,.11);}
.toolbar{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;padding:0 11px 8px;}
.btn{padding:6px 8px;border:1px solid transparent;border-radius:8px;color:var(--muted);
  background:rgba(255,255,255,.055);font-size:11px;font-weight:850;transition:.18s ease;}
.btn:hover{border-color:rgba(98,169,255,.52);color:var(--text);transform:translateY(-1px);}
.btn.play{color:#07172c;background:linear-gradient(135deg,var(--cyan),#79b9ff);}
.btn:disabled{cursor:default;opacity:.38;transform:none;}
.speed{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:10px;}
.speed input{width:58px;accent-color:var(--cyan);}
.canvas-wrap{padding:0 9px;}
canvas{display:block;width:100%;height:310px;border:1px solid rgba(142,164,204,.15);
  border-radius:12px;background:#0b1528;}
.round-strip{display:flex;align-items:center;gap:4px;padding:8px 11px;overflow-x:auto;}
.round{flex:1 0 36px;min-width:36px;height:5px;border-radius:99px;
  background:rgba(142,164,204,.2);transition:.2s ease;}
.round.done{background:var(--green);}
.round.active{background:var(--orange);box-shadow:0 0 12px rgba(255,189,120,.5);}
.lesson{display:grid;gap:5px;padding:10px 13px 12px;border-top:1px solid var(--line);
  background:rgba(8,16,31,.55);}
.lesson-phase{color:var(--cyan);font-size:10px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;}
.lesson-title{font-size:14px;font-weight:900;}
.lesson-text{color:var(--muted);font-size:11px;line-height:1.55;}
.lesson-formula{padding:7px 9px;border:1px solid rgba(98,169,255,.23);border-radius:8px;
  color:#cfe6ff;background:rgba(98,169,255,.07);font:750 11px/1.45 ui-monospace,Consolas,monospace;}
.side{display:grid;align-content:start;gap:9px;}
.formula{padding:8px 9px;border:1px solid rgba(86,224,220,.22);border-radius:8px;
  color:var(--cyan);background:rgba(86,224,220,.07);font:750 11px/1.45 ui-monospace,Consolas,monospace;
  white-space:pre-line;}
.intuition{margin-top:6px;color:var(--muted);font-size:10px;line-height:1.5;}
.slider-grid{display:grid;gap:7px;}
.slider-row{display:grid;grid-template-columns:72px 1fr 36px;align-items:center;gap:5px;
  color:var(--muted);font-size:10px;}
.slider-row input{width:100%;accent-color:var(--cyan);}
.slider-row output{color:var(--text);font:750 10px ui-monospace,Consolas,monospace;text-align:right;}
.compare{display:grid;gap:6px;margin-top:9px;}
.compare-row{display:grid;grid-template-columns:64px 1fr 46px;align-items:center;gap:5px;
  color:var(--muted);font-size:10px;}
.bar-track{height:7px;overflow:hidden;border-radius:99px;background:rgba(142,164,204,.14);}
.bar{height:100%;border-radius:inherit;transition:width .3s ease;}
.bar.hyper{background:var(--cyan);}.bar.mesh{background:var(--green);}.bar.ring{background:var(--orange);}
.compare-row b{color:var(--text);font:750 10px ui-monospace,Consolas,monospace;text-align:right;}
.cost-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px;}
.cost{padding:6px 4px;border:1px solid rgba(142,164,204,.13);border-radius:8px;
  background:var(--soft);text-align:center;}
.cost strong{display:block;font-size:14px;}
.cost span{display:block;margin-top:2px;color:var(--muted);font-size:8px;letter-spacing:.07em;text-transform:uppercase;}
.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px;color:var(--muted);font-size:9px;}
.legend i{display:inline-block;width:7px;height:7px;margin-right:3px;border-radius:50%;}
.legend .node{background:var(--green);}.legend .send{background:var(--cyan);}
.legend .recv{background:var(--orange);}.legend .packet{background:#ffe596;}
@media(max-width:1060px){.layout{grid-template-columns:210px minmax(0,1fr);}
  .side{grid-column:1/-1;grid-template-columns:1fr 1fr;}}
@media(max-width:720px){body{padding:10px;}.hero{flex-direction:column;}
  .layout{grid-template-columns:1fr;}.side{grid-column:auto;grid-template-columns:1fr;}
  canvas{height:270px;}}
</style>
</head>
<body>
<main class="shell">
  <header class="hero">
    <div>
      <div class="eyebrow">Paralelní algoritmy · rychlá orientace</div>
      <h1>Kolektivní komunikační operace</h1>
      <p>Vyber operaci, přepni topologii a sleduj pohyb dat. Koláče na vrcholech ukazují, které bloky daný procesor zná.</p>
    </div>
  </header>
  <section class="layout">
    <aside class="card card-pad">
      <h2>Operace</h2>
      <div class="op-list" id="opList"></div>
    </aside>
    <section class="card scene-card">
      <div class="scene-head">
        <div>
          <div class="scene-title" id="sceneTitle"></div>
          <div class="scene-sub" id="sceneSub"></div>
        </div>
        <div class="topo-tabs">
          <button class="ttab active" data-topo="ring">Prsten</button>
          <button class="ttab" data-topo="hyper">Hyperkrychle</button>
          <button class="ttab" data-topo="mesh">Mřížka</button>
        </div>
      </div>
      <div class="toolbar">
        <label class="speed">rychlost <input id="speed" type="range" min="350" max="1500" value="800" step="80"></label>
        <button class="btn" id="resetBtn">↺ Reset</button>
        <button class="btn" id="backBtn">◀ Zpět</button>
        <button class="btn" id="nextBtn">Další ▶</button>
        <button class="btn play" id="playBtn">▶ Přehrát</button>
      </div>
      <div class="canvas-wrap"><canvas id="canvas" role="img" aria-label="Animace komunikační operace"></canvas></div>
      <div class="round-strip" id="roundStrip"></div>
      <div class="lesson">
        <div class="lesson-phase" id="lessonPhase"></div>
        <div class="lesson-title" id="lessonTitle"></div>
        <div class="lesson-text" id="lessonText"></div>
        <div class="lesson-formula" id="lessonFormula"></div>
      </div>
    </section>
    <aside class="side">
      <section class="card card-pad">
        <h2>Co si zapamatovat</h2>
        <div class="formula" id="formula"></div>
        <div class="intuition" id="intuition"></div>
        <div class="legend">
          <span><i class="node"></i>má data</span>
          <span><i class="send"></i>odesílá</span>
          <span><i class="recv"></i>přijímá</span>
          <span><i class="packet"></i>paket</span>
        </div>
      </section>
      <section class="card card-pad">
        <h2>Cenová laboratoř</h2>
        <div class="slider-grid">
          <label class="slider-row"><span>p = 2<sup>k</sup></span><input id="pRange" type="range" min="1" max="5" value="3"><output id="pOut"></output></label>
          <label class="slider-row"><span>m slov</span><input id="mRange" type="range" min="1" max="512" value="64"><output id="mOut"></output></label>
          <label class="slider-row"><span>t<sub>s</sub></span><input id="tsRange" type="range" min="1" max="100" value="10"><output id="tsOut"></output></label>
          <label class="slider-row"><span>t<sub>w</sub>/sl.</span><input id="twRange" type="range" min="1" max="20" value="1"><output id="twOut"></output></label>
        </div>
        <div class="compare" id="compare"></div>
        <div class="cost-grid">
          <div class="cost"><strong id="roundCost">—</strong><span>kol</span></div>
          <div class="cost"><strong id="wordCost">—</strong><span>slov/cestou</span></div>
          <div class="cost"><strong id="bestCost">—</strong><span>best time</span></div>
        </div>
      </section>
    </aside>
  </section>
</main>
<script>
// ── Colors ────────────────────────────────────────────────────────────────────
const COLORS = [
  "#62a9ff","#56e0dc","#6ee7a8","#ffbd78","#aa91ff","#ff8d9b","#8fe3ff","#ffd66e",
  "#89a7ff","#72d6bd","#b8ec7a","#ffa785","#c3a6ff","#f69ec3","#7fd0ff","#ffe18c",
  "#5fd9a4","#f07aad","#a3e4ff","#d4ff84"
];

// ── DOM ───────────────────────────────────────────────────────────────────────
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const els = {
  opList:document.getElementById("opList"),
  title:document.getElementById("sceneTitle"),sub:document.getElementById("sceneSub"),
  strip:document.getElementById("roundStrip"),phase:document.getElementById("lessonPhase"),
  lessonTitle:document.getElementById("lessonTitle"),text:document.getElementById("lessonText"),
  lessonFormula:document.getElementById("lessonFormula"),formula:document.getElementById("formula"),
  intuition:document.getElementById("intuition"),compare:document.getElementById("compare"),
  roundCost:document.getElementById("roundCost"),wordCost:document.getElementById("wordCost"),bestCost:document.getElementById("bestCost"),
};
const ctrls = {
  speed:document.getElementById("speed"),reset:document.getElementById("resetBtn"),
  back:document.getElementById("backBtn"),next:document.getElementById("nextBtn"),play:document.getElementById("playBtn"),
  p:document.getElementById("pRange"),m:document.getElementById("mRange"),ts:document.getElementById("tsRange"),tw:document.getElementById("twRange"),
};
const outs = {p:document.getElementById("pOut"),m:document.getElementById("mOut"),ts:document.getElementById("tsOut"),tw:document.getElementById("twOut")};

// ── State ─────────────────────────────────────────────────────────────────────
let selOp="broadcast", selTopo="ring";
let events=[], snapshots=[], cursor=0, active=null, flights=[], busy=false, playing=false;
let cW=0, cH=0, dpr=1;

// ── Topology definitions ──────────────────────────────────────────────────────
// Ring: 8 nodes
function ringN(){return 8;}
function ringPos(w,h){
  const R=Math.min(118,w*.26,h*.33),cx=w/2,cy=h/2+4;
  return Array.from({length:8},(_,i)=>{const a=-Math.PI/2+i*Math.PI*2/8;return{x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R};});
}
function ringEdges(){return Array.from({length:8},(_,i)=>[i,(i+1)%8]);}

// Hypercube: 16 nodes (4D), project to 2D as inner+outer cube
function hyperN(){return 16;}
function hyperPos(w,h){
  // inner cube (ids 0-7, bit3=0) and outer cube (ids 8-15, bit3=1)
  const cx=w/2,cy=h/2+4;
  const outerS=Math.min(90,w*.17,h*.26);
  const innerS=outerS*0.5;
  const pos=[];
  for(let id=0;id<16;id++){
    const inner=(id>>3)&1;
    const S=inner?innerS:outerS;
    const off=inner?5:0;
    // use bits 0-2 for xyz
    pos[id]={
      x:cx + ((id&1)?S:-S) + ((id&4)?S*0.55:-S*0.55) + off,
      y:cy + ((id&2)?S:-S) - ((id&4)?S*0.45:-S*0.45) + off,
    };
  }
  return pos;
}
function hyperEdges(){
  const e=[];
  for(let i=0;i<16;i++) for(let b=0;b<4;b++){const j=i^(1<<b);if(j>i)e.push([i,j]);}
  return e;
}

// Mesh: 3x3 = 9 nodes
function meshN(){return 9;}
function meshPos(w,h){
  const g=Math.min(82,w*.17,h*.23),cx=w/2,cy=h/2+4;
  return Array.from({length:9},(_,i)=>({x:cx+(i%3-1)*g,y:cy+(Math.floor(i/3)-1)*g}));
}
function meshEdges(){
  const e=[];
  for(let i=0;i<9;i++){
    if(i%3<2) e.push([i,i+1]);
    if(i<6)   e.push([i,i+3]);
  }
  return e;
}

const TOPO = {
  ring: {N:ringN,  pos:ringPos,  edges:ringEdges},
  hyper:{N:hyperN, pos:hyperPos, edges:hyperEdges},
  mesh: {N:meshN,  pos:meshPos,  edges:meshEdges},
};

function getN()    {return TOPO[selTopo].N();}
function getPos()  {return TOPO[selTopo].pos(cW,cH);}
function getEdges(){return TOPO[selTopo].edges();}

function edgeKey(a,b){return Math.min(a,b)+","+Math.max(a,b);}
function topologyAdj(topo){
  const n=TOPO[topo].N(),adj=Array.from({length:n},()=>[]);
  TOPO[topo].edges().forEach(([a,b])=>{adj[a].push(b);adj[b].push(a);});
  return adj;
}
function shortestPath(topo,from,to){
  const n=TOPO[topo].N();
  if(from<0||from>=n||to<0||to>=n)throw new Error(`Neplatný procesor P${from} → P${to} pro ${topo}`);
  if(from===to)return[from];
  const adj=topologyAdj(topo),queue=[from],prev=Array(n).fill(-1);prev[from]=from;
  for(let qi=0;qi<queue.length;qi++){
    const v=queue[qi];
    for(const u of adj[v])if(prev[u]===-1){prev[u]=v;queue.push(u);}
  }
  if(prev[to]===-1)throw new Error(`Topologie ${topo} nemá cestu P${from} → P${to}`);
  const path=[];for(let v=to;;v=prev[v]){path.push(v);if(v===from)break;}
  return path.reverse();
}
function send(topo,from,to,payload){return{from,to,payload,path:shortestPath(topo,from,to)};}
function bfsTree(topo,root=0){
  const n=TOPO[topo].N(),adj=topologyAdj(topo),parent=Array(n).fill(-1),depth=Array(n).fill(-1),queue=[root];
  parent[root]=root;depth[root]=0;
  for(let qi=0;qi<queue.length;qi++)for(const u of adj[queue[qi]])if(parent[u]===-1){
    parent[u]=queue[qi];depth[u]=depth[queue[qi]]+1;queue.push(u);
  }
  const children=Array.from({length:n},()=>[]);
  for(let v=0;v<n;v++)if(v!==root)children[parent[v]].push(v);
  return{parent,depth,children,maxDepth:Math.max(...depth)};
}
function subtree(tree,root){
  const out=[root];tree.children[root].forEach(child=>out.push(...subtree(tree,child)));return out;
}
function groupsOfAll(n){return Array.from({length:n},()=>new Set(Array.from({length:n},(_,i)=>i)));}
function knowledgeFor(op,n){
  if(op==="broadcast"){
    const k=Array.from({length:n},()=>new Set());k[0].add(0);return k;
  }
  if(op==="scatter"){
    const k=Array.from({length:n},()=>new Set());k[0]=new Set(Array.from({length:n},(_,i)=>i));return k;
  }
  if(op==="reducescatter")return groupsOfAll(n);
  return initKnowledge(n);
}

// ── Knowledge ─────────────────────────────────────────────────────────────────
function initKnowledge(n){return Array.from({length:n},(_,i)=>new Set([i]));}
function cloneKnowledge(k){return k.map(s=>new Set(s));}
function applyEvent(knowledge,ev){
  const before=cloneKnowledge(knowledge);
  ev.sends.forEach(s=>{
    const payload=s.payload||Array.from(before[s.from]);
    payload.forEach(b=>knowledge[s.to].add(b));
  });
}
function rebuildSnapshots(){
  const n=getN();
  snapshots=[knowledgeFor(selOp,n)];
  events.forEach(ev=>{
    let next=cloneKnowledge(snapshots[snapshots.length-1]);
    if(ev.after)next=ev.after.map(blocks=>new Set(blocks));
    else applyEvent(next,ev);
    snapshots.push(next);
  });
}

// ── Operations ────────────────────────────────────────────────────────────────
// event: {phase, title, text, formula, sends:[{from, to, payload?}]}
// payload is array of block ids (colors). If omitted, full known set is sent.

const OPS = {
  broadcast:{
    label:"One-to-All Broadcast",short:"jedna zpráva pro všechny",
    subtitle:"Zpráva se šíří po fyzických hranách směrovacího stromu.",
    formulas:{ring:"T = (t_s + t_w·m) · log₂p",hyper:"T = (t_s + t_w·m) · log₂p",mesh:"T = (t_s + t_w·m) · log₂p"},
    intuitions:{ring:"Zpráva se šíří sousedními vlnami na obě strany prstence.",hyper:"Každá vlna otevře další fyzickou dimenzi hyperkrychle.",mesh:"Zpráva postupuje vrstvu po vrstvě přes sousední uzly mřížky."},
    costs:(ts,tw,m,p)=>({ring:(ts+tw*m)*Math.log2(p),hyper:(ts+tw*m)*Math.log2(p),mesh:(ts+tw*m)*Math.log2(p)}),
    rounds:(p,topo)=>topo==="ring"?Math.ceil(p/2):topo==="mesh"?2*(Math.ceil(Math.sqrt(p))-1):Math.log2(p), words:m=>m,
    build(topo){
      const tree=bfsTree(topo),evs=[];
      for(let depth=1;depth<=tree.maxDepth;depth++){
        const sends=[];
        tree.depth.forEach((d,to)=>{if(d===depth)sends.push(send(topo,tree.parent[to],to,[0]));});
        evs.push({phase:"Broadcast po hranách",title:"Vlna "+depth+" / "+tree.maxDepth,
          text:"Informované procesory předají kopii zprávy sousedům v další vrstvě směrovacího stromu. Animace ukazuje skutečné fyzické linky.",
          formula:"vzdálenost od zdroje = "+depth+" hop",sends});
      }
      return evs;
    }
  },

  circularshift:{
    label:"Circular Shift",short:"každý pošle blok sousedovi",
    subtitle:"Jediné kolo – každý procesor přesune svůj blok sousedovi napravo.",
    formulas:{ring:"T = t_s + t_w·m",hyper:"T = t_s + t_w·m",mesh:"T = t_s + t_w·m"},
    intuitions:{ring:"Jeden startup, jeden přenos. Jednodušší než broadcast.",hyper:"Jedno kolo přes bit 0.",mesh:"Posun o jednu pozici v řádku."},
    costs:(ts,tw,m)=>({ring:ts+tw*m,hyper:ts+tw*m,mesh:ts+tw*m}),
    rounds:()=>1, words:m=>m,
    build(topo){
      const n=TOPO[topo].N();
      let sends;
      if(topo==="mesh"){
        // 3x3: right shift in each row; wrap-around is routed through row links.
        sends=Array.from({length:n},(_,f)=>send(topo,f,Math.floor(f/3)*3+(f%3+1)%3,[f]));
      } else if(topo==="hyper"){
        // Hamiltonian Gray-code cycle: consecutive labels differ in one bit.
        const gray=i=>i^(i>>1),order=Array.from({length:n},(_,i)=>gray(i));
        sends=order.map((f,i)=>send(topo,f,order[(i+1)%n],[f]));
      } else {
        sends=Array.from({length:n},(_,f)=>send(topo,f,(f+1)%n,[f]));
      }
      const after=Array.from({length:n},()=>[]);
      sends.forEach(s=>after[s.to]=[s.from]);
      return [{phase:"Circular Shift",title:"Jediné kolo – posun o jednu pozici",
        text:"Každý procesor pošle svůj blok následujícímu procesoru zvoleného cyklu. Pokud mřížka nemá wrap-around hranu, paket je viditelně směrován přes sousedy.",
        formula:"každý blok se přesune právě jednou",sends,after}];
    }
  },

  allbroadcast:{
    label:"All-to-All Broadcast",short:"každý zveřejní svůj blok",
    subtitle:"Každý procesor má unikátní blok; cíl: každý zná všechny bloky.",
    formulas:{
      ring:"T = (t_s + t_w·m) · (p−1)",
      hyper:"T = t_s·log₂p + t_w·m·(p−1)",
      mesh:"T = 2·t_s·(√p−1) + t_w·m·(p−1)",
    },
    intuitions:{
      ring:"Prsten: rotuj blok p−1 krát. Každé kolo 1 startup.",

// ── Resize ────────────────────────────────────────────────────────────────────
function resize(){
  const r=canvas.getBoundingClientRect();
  const w=Math.max(280,Math.floor(r.width)),h=Math.max(220,Math.floor(r.height));
  const ratio=Math.max(1,devicePixelRatio||1);
  if(w===cW&&h===cH&&ratio===dpr)return;
  cW=w;cH=h;dpr=ratio;canvas.width=w*ratio;canvas.height=h*ratio;
}

// ── Draw packet (colored bundle) ──────────────────────────────────────────────
function drawBundle(x,y,payload){
  if(!payload||!payload.length)return;
  const blocks=payload.slice(0,5),sz=6,total=blocks.length*sz,start=-total/2;
  ctx.save();ctx.shadowColor="#ffe596";ctx.shadowBlur=11;
  blocks.forEach((b,i)=>{ctx.fillStyle=COLORS[b%COLORS.length];ctx.fillRect(x+start+i*sz,y-5,sz-1,10);});
  ctx.shadowBlur=0;ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=1;
  ctx.strokeRect(x+start-1,y-6,total+2,12);
  ctx.restore();
}
function pointOnPath(nodes,path,progress){
  if(!path||path.length<2)return nodes[path?.[0]||0];
  const lengths=[],total=path.slice(1).reduce((sum,id,i)=>{
    const a=nodes[path[i]],b=nodes[id],len=Math.hypot(b.x-a.x,b.y-a.y);lengths.push(len);return sum+len;
  },0);
  let distance=Math.max(0,Math.min(1,progress))*total;
  for(let i=0;i<lengths.length;i++){
    if(distance<=lengths[i]||i===lengths.length-1){
      const a=nodes[path[i]],b=nodes[path[i+1]],t=lengths[i]?distance/lengths[i]:0;
      return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
    }
    distance-=lengths[i];
  }
}

// ── Draw node with pie chart ──────────────────────────────────────────────────
function drawNode(pos,id,knowledge){
  const n=getN();
  const blocks=Array.from(knowledge[id]).sort((a,b)=>a-b);
  const full=blocks.length===n;
  const R=selTopo==="hyper"?18:selTopo==="mesh"?20:22;
  const isSender=active&&active.sends.some(s=>s.from===id);
  const isRecvr =active&&active.sends.some(s=>s.to===id);

  ctx.save();
  ctx.shadowColor=full?"rgba(110,231,168,.5)":"rgba(0,0,0,.35)";
  ctx.shadowBlur=full?13:6;
  ctx.beginPath();ctx.arc(pos.x,pos.y,R,0,Math.PI*2);
  ctx.fillStyle=isRecvr?"#3a2515":full?"#174d45":"#1a2945";ctx.fill();

  // pie slices
  blocks.forEach((b,i)=>{
    const a0=-Math.PI/2+i*Math.PI*2/n;
    const a1=-Math.PI/2+(i+1)*Math.PI*2/n;
    ctx.beginPath();ctx.moveTo(pos.x,pos.y);
    ctx.arc(pos.x,pos.y,R-3,a0,a1);ctx.closePath();
    ctx.fillStyle=COLORS[b%COLORS.length];ctx.globalAlpha=.7;ctx.fill();
    ctx.globalAlpha=1;
  });

  // border
  ctx.beginPath();ctx.arc(pos.x,pos.y,R,0,Math.PI*2);
  ctx.lineWidth=isSender||isRecvr?3:2;
  ctx.strokeStyle=isRecvr?"#ffbd78":isSender?"#56e0dc":full?"#6ee7a8":"rgba(154,169,200,.55)";
  ctx.stroke();ctx.shadowBlur=0;

  // label
  ctx.fillStyle="#f5f8ff";ctx.textAlign="center";
  ctx.font="800 "+(selTopo==="hyper"?"9":"10")+"px Segoe UI";
  ctx.fillText("P"+id,pos.x,pos.y+3);
  ctx.restore();
}

// ── Main draw ─────────────────────────────────────────────────────────────────
function draw(){
  resize();
  const nodes=getPos(), edges=getEdges();
  const knowledge=snapshots[cursor]||(()=>{const k=initKnowledge(getN());return k;})();

  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,cW,cH);
  const bg=ctx.createLinearGradient(0,0,cW,cH);
  bg.addColorStop(0,"#0c1930");bg.addColorStop(1,"#091222");
  ctx.fillStyle=bg;ctx.fillRect(0,0,cW,cH);

  // grid
  ctx.strokeStyle="rgba(142,164,204,.05)";ctx.lineWidth=1;
  for(let x=18;x<cW;x+=26){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cH);ctx.stroke();}
  for(let y=18;y<cH;y+=26){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cW,y);ctx.stroke();}

  // active send map for edge highlighting
  const activePairs=new Set();
  if(active)active.sends.forEach(s=>{
    const path=s.path||[s.from,s.to];
    for(let i=1;i<path.length;i++)activePairs.add(edgeKey(path[i-1],path[i]));
  });

  // edges
  edges.forEach(([a,b])=>{
    const key=edgeKey(a,b);
    const isAct=activePairs.has(key);
    ctx.strokeStyle=isAct?"rgba(86,224,220,.75)":"rgba(142,164,204,.28)";
    ctx.lineWidth=isAct?2.5:1.5;
    if(isAct){ctx.save();ctx.shadowColor="#56e0dc";ctx.shadowBlur=9;}
    ctx.beginPath();ctx.moveTo(nodes[a].x,nodes[a].y);ctx.lineTo(nodes[b].x,nodes[b].y);ctx.stroke();
    if(isAct)ctx.restore();
  });
  ctx.setLineDash([]);

  // nodes
  nodes.forEach((n,id)=>drawNode(n,id,knowledge));

  // packets in flight
  flights.forEach(fl=>{
    if(fl.progress<0||fl.progress>1)return;
    const point=pointOnPath(nodes,fl.send.path||[fl.send.from,fl.send.to],fl.progress);
    drawBundle(point.x,point.y,fl.payload);
  });
}

// ── Calculate ─────────────────────────────────────────────────────────────────
function calculate(){
  const p=2**Number(ctrls.p.value),m=Number(ctrls.m.value),ts=Number(ctrls.ts.value),tw=Number(ctrls.tw.value);
  outs.p.textContent=p;outs.m.textContent=m;outs.ts.textContent=ts;outs.tw.textContent=tw;
  const op=OPS[selOp],costs=op.costs(ts,tw,m,p);
  const mx=Math.max(costs.ring,costs.hyper,costs.mesh,1);
  els.compare.innerHTML=[["ring","Prsten"],["hyper","Hyperkrychle"],["mesh","Mřížka"]]
    .map(([k,lbl])=>`<div class="compare-row"><span>${lbl}</span><div class="bar-track"><div class="bar ${k}" style="width:${Math.round(100*costs[k]/mx)}%"></div></div><b>${costs[k].toFixed(0)}</b></div>`)
    .join("");
  els.roundCost.textContent=op.rounds(p,selTopo).toFixed(0);
  els.wordCost.textContent=op.words(m,p).toFixed(0);
  els.bestCost.textContent=Math.min(costs.ring,costs.hyper,costs.mesh).toFixed(0);
}

// ── Render UI ─────────────────────────────────────────────────────────────────
function render(){
  const op=OPS[selOp];
  const shown=active||(cursor?events[cursor-1]:null);
  els.opList.innerHTML=Object.entries(OPS).map(([k,o])=>
    `<button class="op${k===selOp?" active":""}" data-op="${k}"><strong>${o.label}</strong><span>${o.short}</span></button>`
  ).join("");
  document.querySelectorAll(".ttab").forEach(b=>b.classList.toggle("active",b.dataset.topo===selTopo));
  els.title.textContent=op.label;
  els.sub.textContent=op.subtitle;
  els.formula.textContent=op.formulas[selTopo];
  els.intuition.textContent=op.intuitions[selTopo]||op.intuitions.ring;
  if(shown){
    els.phase.textContent=shown.phase;
    els.lessonTitle.textContent=shown.title;
    els.text.textContent=shown.text;
    els.lessonFormula.textContent=shown.formula;
  } else {
    els.phase.textContent="Start · vyber operaci a topologii";
    els.lessonTitle.textContent="Spusť první kolo";
    els.text.textContent="Koláče na vrcholech ukazují které bloky (barvy) procesor zná. Prsten = 8 uzlů, Hyperkrychle = 16 uzlů, Mřížka = 9 uzlů.";
    els.lessonFormula.textContent="odesílatel ──m──▶ příjemce";
  }
  els.strip.innerHTML=events.map((ev,i)=>`<div class="round${i<cursor?" done":active===ev?" active":""}" title="kolo ${i+1}"></div>`).join("");
  ctrls.back.disabled=busy||cursor===0;
  ctrls.next.disabled=busy||cursor===events.length;
  ctrls.reset.disabled=busy;
  ctrls.play.innerHTML=playing?"⏸ Pauza":"▶ Přehrát";
  document.querySelectorAll(".op").forEach(b=>b.disabled=busy);
  document.querySelectorAll(".ttab").forEach(b=>b.disabled=busy);
  calculate();draw();
}

// ── Reset ─────────────────────────────────────────────────────────────────────
function reset(op=selOp,topo=selTopo){
  selOp=op;selTopo=topo;
  events=OPS[selOp].build(selTopo);
  rebuildSnapshots();
  cursor=0;active=null;flights=[];busy=false;playing=false;
  render();
}

// ── Advance ───────────────────────────────────────────────────────────────────
async function advance(){
  if(busy||cursor>=events.length)return;
  busy=true;active=events[cursor];
  const before=snapshots[cursor];
  flights=active.sends.map((s,i)=>({
    send:s,
    payload:s.payload||Array.from(before[s.from]).sort((a,b)=>a-b),
    delay:(i%getN())*40,
    progress:-1
  }));
  render();
  const started=performance.now(),dur=Number(ctrls.speed.value);
  const maxDelay=flights.length?Math.max(...flights.map(f=>f.delay)):0;
  await new Promise(res=>{
    function tick(now){
      const el=now-started;
      flights.forEach(f=>f.progress=Math.max(-.01,Math.min(1,(el-f.delay)/dur)));
      draw();
      if(el<dur+maxDelay)requestAnimationFrame(tick);else res();
    }
    requestAnimationFrame(tick);
  });
  cursor++;active=null;flights=[];busy=false;render();
  await new Promise(r=>setTimeout(r,130));
}

async function togglePlay(){
  if(playing){playing=false;render();return;}
  if(cursor===events.length)reset();
  playing=true;render();
  while(playing&&cursor<events.length)await advance();
  playing=false;render();
}

// ── Listeners ─────────────────────────────────────────────────────────────────
els.opList.addEventListener("click",e=>{const b=e.target.closest("[data-op]");if(b&&!busy)reset(b.dataset.op,selTopo);});
document.querySelectorAll(".ttab").forEach(b=>b.addEventListener("click",()=>{if(!busy)reset(selOp,b.dataset.topo);}));
ctrls.reset.addEventListener("click",()=>reset());
ctrls.back.addEventListener("click",()=>{if(!busy&&cursor){cursor--;render();}});
ctrls.next.addEventListener("click",advance);
ctrls.play.addEventListener("click",togglePlay);
[ctrls.p,ctrls.m,ctrls.ts,ctrls.tw].forEach(el=>el.addEventListener("input",calculate));
window.addEventListener("resize",draw);

reset();
</script>
</body>
