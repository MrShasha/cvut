<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red-Black Tree krokovač</title>
<style>
  :root {
    --bg: #101318;
    --panel: #171c24;
    --panel2: #202734;
    --text: #eef2f7;
    --muted: #aab4c3;
    --accent: #7aa2ff;
    --red: #d84a4a;
    --black: #111;
    --edge: #8fa0b8;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  }
  .wrap {
    display: grid;
    grid-template-columns: 320px 1fr;
    min-height: 100vh;
  }
  .side {
    background: var(--panel);
    padding: 18px;
    border-right: 1px solid #2a3240;
    overflow: auto;
  }
  .main {
    padding: 18px;
    overflow: hidden;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 12px;
  }
  .small {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }
  .controls {
    display: flex;
    gap: 8px;
    margin: 16px 0;
    flex-wrap: wrap;
  }
  button {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid #3a4557;
    border-radius: 8px;
    padding: 8px 11px;
    cursor: pointer;
  }
  button:hover {
    border-color: var(--accent);
  }
  input[type=range] {
    width: 100%;
  }
  .card {
    background: var(--panel2);
    border: 1px solid #2a3240;
    border-radius: 12px;
    padding: 14px;
    margin-top: 14px;
  }
  .title {
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 8px;
  }
  .note {
    color: #d7deea;
    line-height: 1.45;
  }
  .legend {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .dot {
    width: 14px;
    height: 14px;
    display: inline-block;
    border-radius: 50%;
    border: 2px solid #fff;
    vertical-align: middle;
    margin-right: 5px;
  }
  .dot.red { background: var(--red); }
  .dot.black { background: var(--black); }
  svg {
    width: 100%;
    height: 70vh;
    background: #0d1117;
    border: 1px solid #2a3240;
    border-radius: 14px;
  }
  .stepList {
    margin-top: 10px;
    max-height: 42vh;
    overflow: auto;
    border-top: 1px solid #2a3240;
  }
  .stepItem {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 4px;
    border-bottom: 1px solid #222a36;
    cursor: pointer;
  }
  .stepItem.active {
    color: white;
    background: #263148;
  }
  .nodeText {
    fill: white;
    font-weight: 700;
    font-size: 13px;
    dominant-baseline: middle;
    text-anchor: middle;
  }
  .nodeCircle {
    stroke: white;
    stroke-width: 2px;
  }
  .focus {
    stroke: #ffd166;
    stroke-width: 5px;
  }
  .edge {
    stroke: var(--edge);
    stroke-width: 2px;
  }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .side { border-right: 0; border-bottom: 1px solid #2a3240; }
    svg { height: 58vh; }
  }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <h1>RB tree krokovač</h1>
    <div class="small">
      Sekvence: <code>10, 20, 30, 15, 25, 5, 1, 8, 12, 18</code><br>
      Pak update <code>15 → 17</code> jako delete+insert a nakonec delete <code>10</code>.
    </div>
    <div class="controls">
      <button id="prev">◀ Předchozí</button>
      <button id="next">Další ▶</button>
      <button id="play">Play</button>
    </div>
    <input id="range" type="range" min="0" max="0" value="0">
    <div class="card">
      <div id="counter" class="small"></div>
      <div id="title" class="title"></div>
      <div id="note" class="note"></div>
      <div class="legend">
        <span><span class="dot red"></span>červený</span>
        <span><span class="dot black"></span>černý</span>
        <span>Žlutý okraj = aktuální uzel</span>
      </div>
    </div>
    <div id="stepList" class="stepList"></div>
  </aside>
  <main class="main">
    <svg id="svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet"></svg>
  </main>
</div>

"12", "key": 12, "color": "R", "focus": false}, {"id": "5", "key": 5, "color": "B", "focus": false}, {"id": "1", "key": 1, "color": "R", "focus": false}, {"id": "8", "key": 8, "color": "R", "focus": false}, {"id": "17", "key": 17, "color": "B", "focus": false}, {"id": "18", "key": 18, "color": "R", "focus": false}, {"id": "30", "key": 30, "color": "B", "focus": false}, {"id": "25", "key": 25, "color": "R", "focus": false}], "edges": [{"from": "20", "to": "12", "side": "L"}, {"from": "12", "to": "5", "side": "L"}, {"from": "5", "to": "1", "side": "L"}, {"from": "5", "to": "8", "side": "R"}, {"from": "12", "to": "17", "side": "R"}, {"from": "17", "to": "18", "side": "R"}, {"from": "20", "to": "30", "side": "R"}, {"from": "30", "to": "25", "side": "L"}]}];
let i = 0;
let timer = null;

const svg = document.getElementById("svg");
const title = document.getElementById("title");
const note = document.getElementById("note");
const counter = document.getElementById("counter");
const range = document.getElementById("range");
const stepList = document.getElementById("stepList");
range.max = steps.length - 1;

function buildChildren(step) {
  const map = new Map();
  const roots = new Set(step.nodes.map(n => n.id));
  for (const n of step.nodes) map.set(n.id, {...n, left:null, right:null});
  for (const e of step.edges) {
    const p = map.get(e.from);
    if (e.side === "L") p.left = e.to;
    else p.right = e.to;
    roots.delete(e.to);
  }
  const rootId = roots.values().next().value;
  return {map, rootId};
}

function layout(step) {
  const {map, rootId} = buildChildren(step);
  if (!rootId) return new Map();

  const pos = new Map();
  let order = 0;

  function inorder(id, depth) {
    if (!id) return;
    const n = map.get(id);
    inorder(n.left, depth + 1);
    pos.set(id, {x: 0, y: depth});
    order++;
    pos.get(id).x = order;
    inorder(n.right, depth + 1);
  }

  inorder(rootId, 0);

  const xs = [...pos.values()].map(p => p.x);
  const maxDepth = Math.max(...[...pos.values()].map(p => p.y), 0);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const width = Math.max(1, maxX - minX + 1);

  for (const [id,p] of pos) {
    p.x = 80 + ((p.x - minX + 0.5) / width) * 1040;
    p.y = 70 + (p.y / Math.max(1, maxDepth)) * 570;
  }
  return pos;
}

function draw() {
  const step = steps[i];
  title.textContent = step.title;
  note.textContent = step.note;
  counter.textContent = `Krok ${i+1} / ${steps.length}`;
  range.value = i;

  svg.innerHTML = "";
  const pos = layout(step);
  const nodeById = new Map(step.nodes.map(n => [n.id, n]));

  for (const e of step.edges) {
    const a = pos.get(e.from);
    const b = pos.get(e.to);
    if (!a || !b) continue;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", a.x);
    line.setAttribute("y1", a.y);
    line.setAttribute("x2", b.x);
    line.setAttribute("y2", b.y);
    line.setAttribute("class", "edge");
    svg.appendChild(line);
  }

  for (const n of step.nodes) {
    const p = pos.get(n.id);
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    c.setAttribute("cx", p.x);
    c.setAttribute("cy", p.y);
    c.setAttribute("r", 24);
    c.setAttribute("fill", n.color === "R" ? "#d84a4a" : "#111");
    c.setAttribute("class", "nodeCircle" + (n.focus ? " focus" : ""));
    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", p.x);
    txt.setAttribute("y", p.y + 1);
    txt.setAttribute("class", "nodeText");
    txt.textContent = n.key;
    g.appendChild(c);
    g.appendChild(txt);
    svg.appendChild(g);
  }

  [...stepList.children].forEach((el, idx) => el.classList.toggle("active", idx === i));
}

function fillSteps() {
  stepList.innerHTML = "";
  steps.forEach((s, idx) => {
    const div = document.createElement("div");
    div.className = "stepItem";
    div.textContent = `${idx+1}. ${s.title}`;
    div.onclick = () => { i = idx; draw(); };
    stepList.appendChild(div);
  });
}

document.getElementById("next").onclick = () => { i = Math.min(steps.length - 1, i + 1); draw(); };
document.getElementById("prev").onclick = () => { i = Math.max(0, i - 1); draw(); };
document.getElementById("play").onclick = () => {
  if (timer) {
    clearInterval(timer); timer = null;
    document.getElementById("play").textContent = "Play";
  } else {
    document.getElementById("play").textContent = "Stop";
    timer = setInterval(() => {
      if (i >= steps.length - 1) {
        clearInterval(timer); timer = null;
        document.getElementById("play").textContent = "Play";
      } else {
        i++; draw();
      }
    }, 1100);
  }
};
range.oninput = (e) => { i = Number(e.target.value); draw(); };

fillSteps();
draw();
</script>
