<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVG - incremental SfM</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)330px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.step{cursor:pointer}.box{fill:#18202b;stroke:#3d4b5f;stroke-width:2}.step.active .box{fill:#173454;stroke:#60a5fa}.step.done .box{stroke:#22c55e}.txt{fill:#e5edf7;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.sub{fill:#aebccd;font-size:12px;text-anchor:middle}.arrow{stroke:#94a3b8;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.cam{fill:none;stroke:#f8fafc;stroke-width:2}.pt{fill:#22c55e}.ray{stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 5}.bad{stroke:#ef4444}.good{stroke:#22c55e}.result{margin-top:auto;border:1px solid rgba(56,189,248,.35);background:rgba(56,189,248,.11);color:#bae6fd;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="svg" viewBox="0 0 900 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs></svg></section><aside class="panel"><h1>Sequential / incremental SfM</h1><p class="muted">Klikni na krok. Vstupem jsou korespondence, vystupem je ridky 3D model a pozice kamer.</p><div id="info" class="card"></div><div class="result">Drift vznikne postupnym skladanim malych chyb; proto se motion i structure casto zpresnuji bundle adjustmentem.</div></aside></main>
<script>
const svg=document.getElementById('svg'),info=document.getElementById('info');
const steps=[
 ['detect','Feature detection','local features','Najit stabilni priznaky v kazdem obraze.'],
 ['match','Feature matching','2D-2D matches','Sparovat priznaky mezi prekryvajicimi se obrazy.'],
 ['fit','H / E / F + RANSAC','inlier matches','Robustne odhadnout model a vyhodit outliery.'],
 ['init','Two-view init','R, t, first X','Vybrat dobry par a triangulovat prvni body.'],
 ['motion','Extend motion','new camera','Z 2D-3D shod odhadnout dalsi kameru.'],
 ['structure','Extend structure','new points','Z novych shod triangulovat dalsi 3D body.'],
 ['ba','Bundle adjustment','min reprojection error','Spolecne zpresnit kamery a 3D body.']
];
let active='init';
function el(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function make(tag,a={},parent=svg){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);parent.appendChild(e);return e}
function cam(x,y,s=1,c='cam'){el('path',{d:`M${x},${y} l${58*s},${-25*s} v${50*s} z`,class:c});el('circle',{cx:x,cy:y,r:5*s,fill:'#f59e0b'})}
function rebuild(){[...svg.children].filter(n=>n.tagName.toLowerCase()!=='defs').forEach(n=>n.remove());const pos=[[135,82],[450,82],[765,82],[135,245],[450,245],[765,245],[450,405]];for(let i=0;i<pos.length-1;i++){const [x1,y1]=pos[i], [x2,y2]=pos[i+1];el('path',{d:`M${x1+96},${y1} C${x1+150},${y1} ${x2-150},${y2} ${x2-96},${y2}`,class:'arrow'})}steps.forEach((s,i)=>{const [x,y]=pos[i];const g=make('g',{class:`step ${s[0]===active?'active':''} ${i<steps.findIndex(q=>q[0]===active)?'done':''}`});g.onclick=()=>{active=s[0];rebuild()};make('rect',{x:x-108,y:y-42,width:216,height:84,rx:8,class:'box'},g);const t=make('text',{x,y:y-9,class:'txt'},g);t.textContent=s[1];const u=make('text',{x,y:y+22,class:'sub'},g);u.textContent=s[2]});el('path',{d:'M160,555 C275,465 420,455 560,495 C650,520 730,500 815,430',fill:'none',stroke:'#22c55e','stroke-width':3});el('path',{d:'M160,555 C290,472 425,475 555,520 C665,560 735,555 815,505',fill:'none',stroke:'#ef4444','stroke-width':3,'stroke-dasharray':'7 7'});for(const p of [[300,500],[390,470],[485,486],[610,462],[690,487]])el('circle',{cx:p[0],cy:p[1],r:6,class:'pt'});for(const c of [[225,520],[390,494],[560,510],[700,488]]){cam(c[0],c[1],.78);for(const p of [[390,470],[485,486]])el('line',{x1:c[0],y1:c[1],x2:p[0],y2:p[1],class:'ray'})}const s=steps.find(q=>q[0]===active);info.innerHTML=`<strong>${s[1]}</strong><span class="formula">${s[3]}</span>`;el('text',{x:640,y:438,class:'sub'}).textContent='true trajectory';el('text',{x:670,y:535,class:'sub'}).textContent='estimated trajectory with drift'}
rebuild();
</script></body></html>
