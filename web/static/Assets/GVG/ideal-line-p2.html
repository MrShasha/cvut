<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GVG - idealni primka</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:620px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:620px}.grid{stroke:#2b313b;stroke-width:1}.axis{stroke:#8b95a5;stroke-width:2}.parallel{stroke:#38bdf8;stroke-width:3}.parallel2{stroke:#f59e0b;stroke-width:3}.idealLine{stroke:#94a3b8;stroke-width:3;stroke-dasharray:9 8}.ideal{fill:#22c55e;stroke:#dcfce7;stroke-width:3;filter:drop-shadow(0 0 8px rgba(34,197,94,.45))}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;opacity:.75}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:460px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="scene" viewBox="0 0 760 620"></svg></section><aside class="panel"><h1>Ideální přímka l∞</h1><p class="muted">Všechny směry afinní roviny tvoří jednu projektivní přímku: w=0.</p><div class="tabs"><button class="tab active" data-mode="one">Jeden směr</button><button class="tab" data-mode="many">Více směrů</button><button class="tab" data-mode="formula">w=0</button></div><div class="card" id="explain"><strong>Směr rovnoběžek</strong><span class="formula">rovnoběžné přímky sdílí jeden ideální bod</span></div><div class="result">l∞ odděluje konečné afinní body od bodů reprezentujících směry.</div></aside></main><script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='one';const W=760,H=620,p=74,min=-1,max=4;const sx=x=>p+(x-min)/(max-min)*(W-2*p),sy=y=>H-p-(y-min)/(max-min)*(H-2*p);function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function base(){svg.innerHTML='';for(let i=-1;i<=4;i++){add('line',{x1:sx(i),y1:sy(-1),x2:sx(i),y2:sy(4),class:'grid'});add('line',{x1:sx(-1),y1:sy(i),x2:sx(4),y2:sy(i),class:'grid'})}add('line',{x1:sx(-1),y1:sy(0),x2:sx(4),y2:sy(0),class:'axis'});add('line',{x1:sx(0),y1:sy(-1),x2:sx(0),y2:sy(4),class:'axis'});add('line',{x1:sx(-.8),y1:sy(3.65),x2:sx(3.8),y2:sy(3.65),class:'idealLine'});txt('l∞: w = 0',sx(2.45),sy(3.82),'tiny')}
function render(){base();if(mode==='one'||mode==='formula'){[-.1,.7,1.5].forEach(k=>add('line',{x1:sx(-.8),y1:sy(k),x2:sx(3.4),y2:sy(k+1.6),class:'parallel'}));add('circle',{cx:sx(3.25),cy:sy(3.65),r:10,class:'ideal'});txt('[1,0.38,0]',sx(2.25),sy(3.45),'tiny');if(mode==='one')explain.innerHTML='<strong>Jeden směr</strong><span class="formula">každá skupina rovnoběžek má jeden bod na l∞</span>';else explain.innerHTML='<strong>Rovnice</strong><span class="formula">l∞ = [0,0,1]^T<br>l∞^T[x,y,w]=w=0</span>'}if(mode==='many'){[-.1,.7,1.5].forEach(k=>add('line',{x1:sx(-.8),y1:sy(k),x2:sx(3.4),y2:sy(k+1.6),class:'parallel'}));[-.7,.2,1.1].forEach(k=>add('line',{x1:sx(k),y1:sy(-.8),x2:sx(k+1.2),y2:sy(3.4),class:'parallel2'}));add('circle',{cx:sx(3.25),cy:sy(3.65),r:10,class:'ideal'});add('circle',{cx:sx(1.7),cy:sy(3.65),r:10,class:'ideal'});txt('různé směry → různé body na l∞',sx(.2),sy(3.35),'tiny');explain.innerHTML='<strong>Více směrů</strong><span class="formula">všechny ideální body dohromady tvoří l∞</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script><style>.widget,svg{min-height:0!important}</style></body></html>
