<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - idealni primka P2</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(203,213,225,.56);font-size:12px;pointer-events:none}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer;font:inherit}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:520px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene" id="scene"><div class="hint">Táhni = rotace | Scroll = zoom</div></section>
  <aside class="panel">
    <h1>Ideální přímka l∞</h1>
    <p class="muted">V algebraickém modelu GVG je vybraný afinní řez `w=1`; všechny ideální body leží v rovině `w=0`.</p>
    <div class="tabs"><button class="tab active" data-mode="one">Jeden směr</button><button class="tab" data-mode="many">Více směrů</button><button class="tab" data-mode="formula">w=0</button></div>
    <div class="card" id="explain"></div>
    <div class="result">Ideální přímka je projektivní přímka reprezentovaná 2D podprostorem `w=0`.</div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('scene'),explain=document.getElementById('explain');let mode='one',group;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14171c);
const camera=new THREE.PerspectiveCamera(46,1,.1,100);camera.position.set(4.3,3.7,4.6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(.3,.25,.55);controls.minDistance=3;controls.maxDistance=14;
scene.add(new THREE.AmbientLight(0xffffff,.75));const light=new THREE.DirectionalLight(0xffffff,.85);light.position.set(4,5,6);scene.add(light);
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function label(text,color='#e5e7eb'){const c=document.createElement('canvas');c.width=330;c.height=74;const ctx=c.getContext('2d');ctx.font='700 24px Segoe UI, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(20,23,28,.82)';ctx.strokeStyle='rgba(255,255,255,.18)';rr(ctx,12,8,306,56,10);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.fillText(text,165,38);const tex=new THREE.CanvasTexture(c);const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(1.12,.25,1);s.renderOrder=40;return s}
function addLabel(g,t,p,c){const s=label(t,c);s.position.copy(p);g.add(s)}
function addPlane(g,z,color,op,name){const pts=[new THREE.Vector3(-1.5,-1.2,z),new THREE.Vector3(2.4,-1.2,z),new THREE.Vector3(2.4,2.0,z),new THREE.Vector3(-1.5,2.0,z)];const geo=new THREE.BufferGeometry().setFromPoints(pts);geo.setIndex([0,1,2,0,2,3]);geo.computeVertexNormals();g.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false})));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color,transparent:true,opacity:.9})));addLabel(g,name,new THREE.Vector3(2.2,2.25,z),'#f8fafc')}
function line(g,a,b,color,dashed=false){const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const mat=dashed?new THREE.LineDashedMaterial({color,dashSize:.16,gapSize:.11,transparent:true,opacity:.8}):new THREE.LineBasicMaterial({color});const l=new THREE.Line(geo,mat);if(dashed)l.computeLineDistances();g.add(l)}
function sphere(g,p,color,name){const m=new THREE.Mesh(new THREE.SphereGeometry(.075,24,14),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.15}));m.position.copy(p);g.add(m);if(name)addLabel(g,name,p.clone().add(new THREE.Vector3(.16,.12,.12)),'#f8fafc')}
function rebuild(){if(group)scene.remove(group);group=new THREE.Group();addPlane(group,1,0x38bdf8,.14,'A²: w=1');addPlane(group,0,0xf59e0b,.16,'l∞: w=0');sphere(group,new THREE.Vector3(0,0,0),0xf59e0b,'O');const d1=new THREE.Vector3(1,.38,0),d2=new THREE.Vector3(-.25,1,0);if(mode==='one'||mode==='formula'){line(group,d1.clone().multiplyScalar(-1.6),d1.clone().multiplyScalar(2.0),0x22c55e,true);sphere(group,d1,0x22c55e,'[1,.38,0]');for(let k=-.8;k<=.8;k+=.4)line(group,new THREE.Vector3(-1.3,k,1),new THREE.Vector3(2.0,k+.87,1),0x22c55e)}if(mode==='many'){for(const d of [d1,d2]){line(group,d.clone().multiplyScalar(-1.5),d.clone().multiplyScalar(1.8),0x22c55e,true);sphere(group,d,0x22c55e,'P∞')}for(let k=-.8;k<=.8;k+=.4)line(group,new THREE.Vector3(-1.3,k,1),new THREE.Vector3(2.0,k+.87,1),0x22c55e);for(let k=-.6;k<=.6;k+=.4)line(group,new THREE.Vector3(k,-.9,1),new THREE.Vector3(k-.65,1.7,1),0xf59e0b)}if(mode==='formula')explain.innerHTML='<strong>Rovnice</strong><span class="formula">l∞=[0,0,1]ᵀ<br>l∞ᵀ[x,y,w]=w=0</span>';else if(mode==='many')explain.innerHTML='<strong>Více směrů</strong><span class="formula">různé směry v A² odpovídají různým bodům na l∞</span>';else explain.innerHTML='<strong>Jeden směr</strong><span class="formula">rovnoběžné přímky sdílejí jeden ideální bod</span>';scene.add(group)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));rebuild()});
function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();rebuild();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
