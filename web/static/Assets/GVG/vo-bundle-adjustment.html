<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVG - bundle adjustment</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)340px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.edge{stroke:#64748b;stroke-width:2;stroke-dasharray:5 5}.edge.active{stroke:#f59e0b;stroke-width:3;stroke-dasharray:none}.cam{fill:#1d4ed8;stroke:#93c5fd;stroke-width:2}.pt{fill:#22c55e;stroke:#bbf7d0;stroke-width:2}.err{stroke:#ef4444;stroke-width:3;marker-end:url(#arrow)}.label{fill:#e5edf7;font-size:15px;font-weight:700;text-anchor:middle}.small{fill:#aebccd;font-size:12px;text-anchor:middle}.btn{cursor:pointer}.btn rect{fill:#17202b;stroke:#3d4b5f;stroke-width:2}.btn.active rect{fill:#173454;stroke:#60a5fa}.result{margin-top:auto;border:1px solid rgba(56,189,248,.35);background:rgba(56,189,248,.11);color:#bae6fd;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="svg" viewBox="0 0 900 620"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs></svg></section><aside class="panel"><h1>Bundle adjustment</h1><p class="muted">BA lze kreslit jako factor graph: kamery a 3D body jsou promenne, pozorovani jsou vazby pres reprojekcni chybu.</p><div id="info" class="card"></div><div class="result">Optimalizace je nelinearni, proto se pousti z dobre inicializace a casto opakovane behem SfM.</div></aside></main>
<script>
const svg=document.getElementById('svg'),info=document.getElementById('info');let active='obs';
function el(tag,a={},p=svg){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);p.appendChild(e);return e}
function text(t,x,y,cls='label',p=svg){const e=el('text',{x,y,class:cls},p);e.textContent=t;return e}
const cams=[[160,430,'C1'],[350,455,'C2'],[540,425,'C3'],[725,455,'C4']],pts=[[255,165,'X1'],[410,120,'X2'],[535,178,'X3'],[670,145,'X4'],[465,255,'X5']];
const visible=[[0,0],[0,1],[1,0],[1,1],[1,2],[2,1],[2,2],[2,3],[2,4],[3,2],[3,3],[3,4]];
function rebuild(){[...svg.children].filter(n=>n.tagName.toLowerCase()!=='defs').forEach(n=>n.remove());visible.forEach(([ci,pi])=>{const c=cams[ci],p=pts[pi];el('line',{x1:c[0],y1:c[1],x2:p[0],y2:p[1],class:`edge ${active==='obs'&&ci===2?'active':''}`})});cams.forEach(c=>{el('path',{d:`M${c[0]-28},${c[1]+18} l28,-40 l70,40 z`,class:'cam'});text(c[2],c[0]+22,c[1]+42,'small')});pts.forEach(p=>{el('circle',{cx:p[0],cy:p[1],r:13,class:'pt'});text(p[2],p[0],p[1]-24,'small')});if(active==='err'){el('circle',{cx:540,cy:245,r:7,fill:'#22c55e'});el('circle',{cx:575,cy:260,r:7,fill:'#ef4444'});el('line',{x1:540,y1:245,x2:575,y2:260,class:'err'});text('predicted rho_j(...)',505,230,'small');text('measured x_ij',622,268,'small')}if(active==='drift'){el('path',{d:'M130,515 C260,475 445,495 710,450',fill:'none',stroke:'#22c55e','stroke-width':4});el('path',{d:'M130,515 C270,488 455,535 710,535',fill:'none',stroke:'#ef4444','stroke-width':4,'stroke-dasharray':'8 8'});text('true trajectory',648,432,'small');text('drifting estimate',650,560,'small')}const buttons=[['obs','observations'],['err','one error'],['drift','drift']];buttons.forEach((b,i)=>{const g=el('g',{class:`btn ${active===b[0]?'active':''}`});g.onclick=()=>{active=b[0];rebuild()};el('rect',{x:165+i*205,y:40,width:170,height:42,rx:7},g);text(b[1],250+i*205,66,'label',g)});const msg={obs:['Viditelnost v_ij','Kazda hrana znamena, ze kamera j pozoruje bod i. BA minimalizuje chybu pres vsechny viditelne hrany.'],err:['Reprojection error','Jedna hrana ma chybu x_ij - rho_j(R_j X_i + t_j). Ta se meri primo v obraze.'],drift:['Proc BA pomaha','Kdyz se kamery pridavaji postupne, odhad muze ujizdet. BA znovu svaze vsechny kamery a body pres spolecna pozorovani.']}[active];info.innerHTML=`<strong>${msg[0]}</strong><span class="formula">${msg[1]}<br><br>min sum_i sum_j v_ij ||x_ij - rho_j(R_j X_i + t_j)||^2</span>`}
rebuild();
</script></body></html>
