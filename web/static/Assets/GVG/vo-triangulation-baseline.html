<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVG - triangulation baseline</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)340px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(203,213,225,.58);font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #3d4b5f;border-radius:7px;background:#17202b;color:#e5edf7;padding:9px 10px;font-weight:700;cursor:pointer}.tabs button.active{background:#1d4ed8;border-color:#60a5fa}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border:1px solid rgba(245,158,11,.35);background:rgba(245,158,11,.1);color:#fde68a;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:900px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}</style></head>
<body><main class="widget"><section id="scene" class="scene"><div class="hint">Tahni = rotace | Scroll = zoom</div></section><aside class="panel"><h1>Triangulace a uhel paprsku</h1><p class="muted">3D bod lezi na projekcnich paprscich. Kdyz se paprsky protinaji pod malym uhlem, hloubka je nestabilni.</p><div class="tabs"><button data-mode="wide">Siroka baseline</button><button data-mode="forward">Forward motion</button></div><div id="info" class="card"></div><div class="result">Pozitivni hloubka: zeta1 &gt; 0 a zeta2 &gt; 0. Bod za kamerou znamena spatnou konfiguraci nebo chybnou shodu.</div></aside></main>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('scene'),info=document.getElementById('info'),scene=new THREE.Scene();scene.background=new THREE.Color(0x121820);const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(5.1,4.1,5.4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);const controls=new OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.55,1.25);scene.add(new THREE.AmbientLight(0xffffff,.82));const light=new THREE.DirectionalLight(0xffffff,.9);light.position.set(5,6,6);scene.add(light);let group=new THREE.Group();scene.add(group);let mode='wide';
function lab(t,p,c='#e5e7eb'){const cv=document.createElement('canvas');cv.width=360;cv.height=74;const x=cv.getContext('2d');x.font='700 22px Segoe UI';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(17,24,34,.84)';x.fillRect(12,8,336,56);x.fillStyle=c;x.fillText(t,180,38);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false}));s.position.copy(p);s.scale.set(1.1,.23,1);s.renderOrder=20;group.add(s)}
function line(a,b,c,d=false){const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const mat=d?new THREE.LineDashedMaterial({color:c,dashSize:.13,gapSize:.08,transparent:true,opacity:.8}):new THREE.LineBasicMaterial({color:c});const l=new THREE.Line(geo,mat);if(d)l.computeLineDistances();group.add(l)}
function sphere(p,c,t){const m=new THREE.Mesh(new THREE.SphereGeometry(.075,24,14),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.12}));m.position.copy(p);group.add(m);if(t)lab(t,p.clone().add(new THREE.Vector3(.12,.14,.08)),'#f8fafc')}
function angleDeg(a,b,c){const u=a.clone().sub(b).normalize(),v=c.clone().sub(b).normalize();return Math.acos(THREE.MathUtils.clamp(u.dot(v),-1,1))*180/Math.PI}
function draw(){scene.remove(group);group=new THREE.Group();scene.add(group);group.add(new THREE.GridHelper(6,12,0x334155,0x26303c));const C1=mode==='wide'?new THREE.Vector3(-1.35,0,0):new THREE.Vector3(-.18,0,0);const C2=mode==='wide'?new THREE.Vector3(1.35,0,.05):new THREE.Vector3(.16,0,.85);const X=new THREE.Vector3(.25,1.1,2.65);sphere(C1,0x3b82f6,'C1');sphere(C2,0x3b82f6,'C2');sphere(X,0xffffff,'X');line(C1,C2,0xf59e0b);line(C1,X,0x22c55e);line(C2,X,0x22c55e);line(C1,X.clone().add(X.clone().sub(C1).normalize().multiplyScalar(.7)),0x22c55e,true);line(C2,X.clone().add(X.clone().sub(C2).normalize().multiplyScalar(.7)),0x22c55e,true);lab('zeta1',C1.clone().lerp(X,.45).add(new THREE.Vector3(0,.12,0)),'#bbf7d0');lab('zeta2',C2.clone().lerp(X,.45).add(new THREE.Vector3(0,.12,0)),'#bbf7d0');const deg=angleDeg(C1,X,C2);lab('angle ' + deg.toFixed(1) + ' deg',X.clone().add(new THREE.Vector3(0,.38,0)) , deg>15?'#bbf7d0':'#fecaca');info.innerHTML=`<strong>${mode==='wide'?'Stabilni triangulace':'Spatne podminena triangulace'}</strong><span class="formula">uhel paprsku u X = ${deg.toFixed(1)} deg<br>${mode==='wide'?'Mala obrazova chyba zpusobi malou chybu v hloubce.':'Mala obrazova chyba muze posunout X hodne daleko po hloubce.'}</span>`}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));draw()});document.querySelector('[data-mode="wide"]').classList.add('active');draw();
function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);cam.aspect=Math.max(1,r.width)/Math.max(1,r.height);cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,cam)}animate();
</script></body></html>
