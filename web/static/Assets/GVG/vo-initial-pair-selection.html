<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVG - initial pair selection</title><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)340px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(203,213,225,.58);font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:1px solid #3d4b5f;border-radius:7px;background:#17202b;color:#e5edf7;padding:9px 10px;font-weight:700;cursor:pointer}.tabs button.active{background:#1d4ed8;border-color:#60a5fa}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.11);color:#bbf7d0;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:900px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}</style></head>
<body><main class="widget"><section id="scene" class="scene"><div class="hint">Tahni = rotace | Scroll = zoom</div></section><aside class="panel"><h1>Vyber inicializacniho paru</h1><p class="muted">Slide doporucuje hodne inlieru, neplanarni scenu a zadny cisty forward motion.</p><div class="tabs"><button data-mode="good">Dobry par</button><button data-mode="plane">Planarni scena</button><button data-mode="forward">Forward motion</button></div><div id="info" class="card"></div><div class="result">Velky pomer #inliers(E/F) / #inliers(H) signalizuje, ze par lepe popisuje obecnou 3D scenu nez jednu rovinu.</div></aside></main>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('scene'),info=document.getElementById('info'),scene=new THREE.Scene();scene.background=new THREE.Color(0x121820);
const cam=new THREE.PerspectiveCamera(45,1,.1,100);cam.position.set(5,4.2,5.4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const controls=new OrbitControls(cam,renderer.domElement);controls.enableDamping=true;controls.target.set(0,.55,1.1);scene.add(new THREE.AmbientLight(0xffffff,.8));const light=new THREE.DirectionalLight(0xffffff,.9);light.position.set(5,6,6);scene.add(light);let group=new THREE.Group();scene.add(group);let mode='good';
const texts={good:['Dobry inicializacni par','Kamery maji postranni baseline a body lezi v ruznych hloubkach. Paprsky se protinaji pod slusnym uhlem, triangulace je stabilni.'],plane:['Planarni degenerace','Vetsina bodu lezi na jedne rovine. Homografie H pak vysvetli mnoho shod a F/E neni dobry signal obecne 3D struktury.'],forward:['Cisty pohyb dopredu','Centra kamer lezi skoro na stejnem paprsku. Projekcni paprsky maji maly uhel a hloubka je spatne podminena.']};
function lab(t,p,c='#e5e7eb'){const cv=document.createElement('canvas');cv.width=330;cv.height=72;const x=cv.getContext('2d');x.font='700 22px Segoe UI';x.textAlign='center';x.textBaseline='middle';x.fillStyle='rgba(17,24,34,.84)';x.fillRect(10,8,310,54);x.fillStyle=c;x.fillText(t,165,37);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false,depthWrite:false}));s.position.copy(p);s.scale.set(1.05,.23,1);s.renderOrder=20;group.add(s)}
function line(a,b,c,d=false){const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const mat=d?new THREE.LineDashedMaterial({color:c,dashSize:.13,gapSize:.08,transparent:true,opacity:.8}):new THREE.LineBasicMaterial({color:c});const l=new THREE.Line(geo,mat);if(d)l.computeLineDistances();group.add(l)}
function sphere(p,c,t){const m=new THREE.Mesh(new THREE.SphereGeometry(.065,24,12),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.1}));m.position.copy(p);group.add(m);if(t)lab(t,p.clone().add(new THREE.Vector3(.12,.14,.08)),'#f8fafc')}
function plane(){const pts=[new THREE.Vector3(-1.7,.55,.8),new THREE.Vector3(1.9,.55,.55),new THREE.Vector3(1.7,.55,2.8),new THREE.Vector3(-1.9,.55,3.0)];const geo=new THREE.BufferGeometry().setFromPoints(pts);geo.setIndex([0,1,2,0,2,3]);geo.computeVertexNormals();group.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x22c55e,transparent:true,opacity:.16,side:THREE.DoubleSide,depthWrite:false})));group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x22c55e})));lab('planarni scena',new THREE.Vector3(.3,.85,2.85),'#bbf7d0')}
function frustum(C,dir,c){sphere(C,0x3b82f6);const end=C.clone().add(dir.clone().normalize().multiplyScalar(.65));line(C,end,c);line(end,end.clone().add(new THREE.Vector3(.25,.15,.1)),c);line(end,end.clone().add(new THREE.Vector3(.25,-.15,.1)),c);line(end,end.clone().add(new THREE.Vector3(-.25,.15,.1)),c);line(end,end.clone().add(new THREE.Vector3(-.25,-.15,.1)),c)}
function draw(){scene.remove(group);group=new THREE.Group();scene.add(group);group.add(new THREE.GridHelper(6,12,0x334155,0x26303c));const C1=mode==='forward'?new THREE.Vector3(-.1,0,0):new THREE.Vector3(-1.3,0,0);const C2=mode==='forward'?new THREE.Vector3(.15,0,.85):new THREE.Vector3(1.3,0,.15);frustum(C1,new THREE.Vector3(.25,.25,1),0x60a5fa);frustum(C2,new THREE.Vector3(-.25,.25,1),0xa78bfa);lab('C1',C1.clone().add(new THREE.Vector3(-.15,.25,0)));lab('C2',C2.clone().add(new THREE.Vector3(.15,.25,0)));line(C1,C2,0xf59e0b);lab('baseline',C1.clone().add(C2).multiplyScalar(.5).add(new THREE.Vector3(0,-.2,.1)),'#fde68a');let pts=mode==='plane'?[[-1,.55,1.4],[-.35,.55,1.8],[.65,.55,1.35],[1.15,.55,2.25],[0,.55,2.65]]:[[-1,.65,1.15],[-.35,1.2,1.75],[.65,.35,1.35],[1.0,1.25,2.45],[0,.8,2.9]];if(mode==='plane')plane();for(const p0 of pts){const p=new THREE.Vector3(...p0);sphere(p,0x22c55e);line(C1,p,0x64748b,true);line(C2,p,0x64748b,true)}info.innerHTML=`<strong>${texts[mode][0]}</strong><span class="formula">${texts[mode][1]}</span>`}
document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));draw()});document.querySelector('[data-mode="good"]').classList.add('active');draw();
function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);cam.aspect=Math.max(1,r.width)/Math.max(1,r.height);cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,cam)}animate();
</script></body></html>
