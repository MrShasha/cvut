<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GVG - primky v P2</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:620px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:620px}.grid{stroke:#2b313b;stroke-width:1}.axis{stroke:#8b95a5;stroke-width:2}.line{stroke:#38bdf8;stroke-width:4;filter:drop-shadow(0 0 8px rgba(56,189,248,.35))}.normal{stroke:#f59e0b;stroke-width:4;marker-end:url(#arrowOrange)}.point{fill:#22c55e;stroke:#dcfce7;stroke-width:3}.off{fill:#ef4444;stroke:#fee2e2;stroke-width:3}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;opacity:.7}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:460px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="scene" viewBox="0 0 760 620"><defs><marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker></defs></svg></section><aside class="panel"><h1>Přímka v P²</h1><p class="muted">Přímku reprezentuje vektor l=[a,b,c]. Bod x na ní leží právě tehdy, když lᵀx=0.</p><div class="tabs"><button class="tab active" data-mode="incidence">Incidence</button><button class="tab" data-mode="scale">Násobek</button><button class="tab" data-mode="normal">Koeficienty</button></div><div class="card" id="explain"><strong>Incidence</strong><span class="formula">l=[1,1,-2]^T<br>x=[1,1,1]^T<br>l^T x = 0</span></div><div class="result">Rovnice pro afinní body je x + y - 2 = 0.</div></aside></main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='incidence';const W=760,H=620,p=74,min=-1,max=4;const sx=x=>p+(x-min)/(max-min)*(W-2*p),sy=y=>H-p-(y-min)/(max-min)*(H-2*p);function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}function base(){svg.innerHTML=svg.querySelector('defs').outerHTML;for(let i=-1;i<=4;i++){add('line',{x1:sx(i),y1:sy(-1),x2:sx(i),y2:sy(4),class:'grid'});add('line',{x1:sx(-1),y1:sy(i),x2:sx(4),y2:sy(i),class:'grid'})}add('line',{x1:sx(-1),y1:sy(0),x2:sx(4),y2:sy(0),class:'axis'});add('line',{x1:sx(0),y1:sy(-1),x2:sx(0),y2:sy(4),class:'axis'})}
function render(){base();add('line',{x1:sx(-1),y1:sy(3),x2:sx(4),y2:sy(-2),class:'line'});txt('l: x + y - 2 = 0',sx(1.7),sy(.55));add('circle',{cx:sx(1),cy:sy(1),r:10,class:'point'});txt('x=[1,1,1]',sx(1.1),sy(1.28));add('circle',{cx:sx(2.5),cy:sy(1),r:10,class:'off'});txt('mimo: lᵀx≠0',sx(2.62),sy(1.3),'tiny');if(mode==='normal'){add('line',{x1:sx(0),y1:sy(0),x2:sx(1),y2:sy(1),class:'normal'});txt('(a,b)=(1,1)',sx(.35),sy(.88),'tiny');explain.innerHTML='<strong>Koeficienty</strong><span class="formula">(a,b) určuje normálový směr<br>c posouvá přímku</span>'}else if(mode==='scale'){txt('[1,1,-2] ~ [2,2,-4]',sx(.1),sy(3.55));txt('stejná množina bodů',sx(.1),sy(3.28),'tiny');explain.innerHTML='<strong>Násobek</strong><span class="formula">λl reprezentuje stejnou přímku<br>λ ≠ 0</span>'}else{add('line',{x1:sx(1),y1:sy(1),x2:sx(1),y2:sy(0),class:'guide'});add('line',{x1:sx(1),y1:sy(1),x2:sx(0),y2:sy(1),class:'guide'});explain.innerHTML='<strong>Incidence</strong><span class="formula">l=[1,1,-2]^T<br>x=[1,1,1]^T<br>l^T x = 1+1-2=0</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script></body></html>
