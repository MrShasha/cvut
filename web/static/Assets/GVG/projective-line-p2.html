<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - primka v P2</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.plane{fill:rgba(229,231,235,.06);stroke:#cbd5e1;stroke-width:2}.subspace{fill:rgba(56,189,248,.12);stroke:#38bdf8;stroke-width:2;stroke-dasharray:6 6}.ray{stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.lineL{stroke:#ef4444;stroke-width:3}.normal{stroke:#ef4444;stroke-width:3;marker-end:url(#arrowRed)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}.point{fill:#f8fafc;stroke:#111827;stroke-width:2}.origin{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:460px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene"><svg id="scene" viewBox="0 0 820 620"><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker></defs></svg></section>
  <aside class="panel">
    <h1>Přímka v P²</h1>
    <p class="muted">Podle Fig. 9.5: přímka v projektivní rovině je 2D podprostor v R³; reprezentujeme ji normálou v duálním prostoru.</p>
    <div class="tabs"><button class="tab active" data-mode="subspace">2D podprostor</button><button class="tab" data-mode="normal">Reprezentant l</button><button class="tab" data-mode="incidence">Incidence</button></div>
    <div class="card" id="explain"></div>
    <div class="result">Příklad: x=[1,0,1], y=[0,1,1], l=x×y=[-1,-1,1].</div>
  </aside>
</main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='subspace';
function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function line(a,b,cls){add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls})}
const O=[235,390],A=[440,120],B=[680,205],C=[650,430],D=[410,345],x=[620,230],y=[500,300],z=[375,360];
function base(){svg.innerHTML=svg.querySelector('defs').outerHTML;add('polygon',{points:`${A} ${B} ${C} ${D}`,class:'plane'});txt('A²',437,105);txt('A³',270,115);add('circle',{cx:O[0],cy:O[1],r:8,class:'origin'});txt('O',205,402);line([300,235],[385,455],'dash')}
function drawSubspace(){add('polygon',{points:`${O} ${x} ${y}`,class:'subspace'});line(O,x,'ray');line(O,y,'ray');line(O,z,'ray');add('circle',{cx:x[0],cy:x[1],r:6,class:'point'});add('circle',{cx:y[0],cy:y[1],r:6,class:'point'});line(x,y,'lineL');txt('x',635,225);txt('y',515,294);txt('z',385,354);txt('l = A² ∩ span(x,y)',515,278,'tiny')}
function drawNormal(){drawSubspace();line([238,390],[160,170],'normal');txt('l',150,165);txt('l ⟂ span(x,y)',120,235,'tiny')}
function render(){base();if(mode==='subspace'){drawSubspace();explain.innerHTML='<strong>2D podprostor</strong><span class="formula">body na přímce l vyplní rovinu span(x,y) v R³</span>'}if(mode==='normal'){drawNormal();explain.innerHTML='<strong>Reprezentant přímky</strong><span class="formula">l je 1D podprostor duálního R³<br>l ⟂ span(x,y)</span>'}if(mode==='incidence'){drawNormal();txt('lᵀx=0',540,165,'tiny');txt('lᵀy=0',475,330,'tiny');explain.innerHTML='<strong>Incidence</strong><span class="formula">x=[1,0,1], y=[0,1,1]<br>l=x×y=[-1,-1,1]<br>lᵀx=0, lᵀy=0</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script>
</body>
</html>
