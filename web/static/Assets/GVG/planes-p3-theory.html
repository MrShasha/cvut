<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - roviny v P3</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#111820;color:#e7edf5;font-family:"Segoe UI",Inter,system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b;min-width:0}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.grid{stroke:#263244;stroke-width:1}.axis{stroke:#94a3b8;stroke-width:2;marker-end:url(#arrowGray)}.plane{fill:rgba(56,189,248,.22);stroke:#38bdf8;stroke-width:3}.idealPlane{fill:rgba(167,139,250,.09);stroke:#a78bfa;stroke-width:2;stroke-dasharray:7 7}.idealLine{stroke:#fbbf24;stroke-width:4;stroke-dasharray:8 6}.edge{stroke:#38bdf8;stroke-width:2}.on{fill:#22c55e;stroke:#dcfce7;stroke-width:3}.off{fill:#f97316;stroke:#ffedd5;stroke-width:3}.lineOn{stroke:#22c55e;stroke-width:3}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{font-size:18px;margin:0;color:#f8fafc}.muted{font-size:13px;line-height:1.45;color:#aebccd;margin:0}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tab{border:1px solid #3d4b5f;border-radius:6px;background:#202a38;color:#e5e7eb;padding:8px 6px;cursor:pointer;font:inherit;font-weight:700}.tab.active,.tab:hover{border-color:#60a5fa;background:#173454}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;font-family:Consolas,Menlo,monospace;color:#f8fafc;font-size:12px;line-height:1.55}.result{margin-top:auto;border:1px solid rgba(56,189,248,.35);background:rgba(56,189,248,.11);color:#bae6fd;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:480px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene">
    <svg id="scene" viewBox="0 0 820 620">
      <defs>
        <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/></marker>
      </defs>
    </svg>
  </section>
  <aside class="panel">
    <h1>Rovina jako 4-vektor</h1>
    <p class="muted">V P³ je rovina reprezentována homogenním vektorem π=[a,b,c,d]ᵀ.</p>
    <div class="tabs">
      <button class="tab active" data-mode="incidence">Incidence</button>
      <button class="tab" data-mode="scale">Násobek</button>
      <button class="tab" data-mode="ideal">Ideální řez</button>
    </div>
    <div class="card" id="explain"></div>
    <div class="result">Přímky v P³ nejsou duální k bodům; roviny ano.</div>
  </aside>
</main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='incidence';
function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function line(a,b,cls){add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls})}
const A=[360,210],B=[610,285],C=[560,470],D=[310,390];
const pA=[360,210],pB=[610,285],pC=[560,470],q=[215,390];
function base(){svg.innerHTML=svg.querySelector('defs').outerHTML;for(let i=0;i<8;i++){line([120+i*70,520],[250+i*70,575],'grid')}for(let i=0;i<9;i++){line([120+i*70,520],[40+i*70,575],'grid')}line([110,525],[740,525],'axis');line([110,525],[110,150],'axis');line([110,525],[300,590],'axis');txt('x',745,520);txt('y',116,150);txt('z',305,595);add('polygon',{points:`${A} ${B} ${C} ${D}`,class:'plane'});txt('π: x+y+z-1=0',370,500,'tiny')}
function points(){line(pA,pB,'lineOn');line(pB,pC,'lineOn');add('circle',{cx:pA[0],cy:pA[1],r:10,class:'on'});add('circle',{cx:pB[0],cy:pB[1],r:10,class:'on'});add('circle',{cx:pC[0],cy:pC[1],r:10,class:'on'});add('circle',{cx:q[0],cy:q[1],r:11,class:'off'});txt('A [1,0,0,1]',pA[0]+14,pA[1]-14);txt('B [0,1,0,1]',pB[0]+14,pB[1]-14);txt('C [0,0,1,1]',pC[0]+14,pC[1]+24);txt('Q mimo',q[0]-58,q[1]-18)}
function ideal(){const P=[205,190],Q=[445,255],R=[420,430],S=[180,365];add('polygon',{points:`${P} ${Q} ${R} ${S}`,class:'idealPlane'});line([215,350],[410,205],'idealLine');txt('π∞: w=0',210,180,'tiny');txt('π ∩ π∞: x+y+z=0',275,222,'tiny')}
function render(){base();if(mode==='incidence'){points();explain.innerHTML='<strong>Incidence</strong><span class="formula">π=[1,1,1,-1]ᵀ<br>πᵀA=1+0+0-1=0<br>πᵀB=0, πᵀC=0<br>πᵀQ=1.2+1.2+1.2-1≠0</span>'}if(mode==='scale'){points();txt('π ~ 2π',185,220,'tiny');explain.innerHTML='<strong>Násobek</strong><span class="formula">π ~ λπ, λ≠0<br>[1,1,1,-1]ᵀ ~ [2,2,2,-2]ᵀ<br>stejná množina bodů</span>'}if(mode==='ideal'){points();ideal();explain.innerHTML='<strong>Ideální řez</strong><span class="formula">π ∩ π∞:<br>x+y+z=0, w=0<br>ideální přímka roviny π</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script>
</body>
</html>
