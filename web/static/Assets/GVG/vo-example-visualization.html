<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GVG 4 - example visualization 3D</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)360px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(203,213,225,.58);font-size:12px;pointer-events:none}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border:1px solid rgba(56,189,248,.35);background:rgba(56,189,248,.11);color:#bae6fd;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:900px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}
</style>
</head>
<body>
<main class="widget">
  <section id="scene" class="scene"><div class="hint">Tahni = rotace | Scroll = zoom</div></section>
  <aside class="panel">
    <h1 id="title"></h1>
    <p id="desc" class="muted"></p>
    <div id="math" class="card"></div>
    <div id="note" class="result"></div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const host = document.getElementById('scene');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const math = document.getElementById('math');
const note = document.getElementById('note');
const ex = new URLSearchParams(location.search).get('ex') || '1';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121820);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(5.2, 4.1, 5.8);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, .45, .7);
scene.add(new THREE.AmbientLight(0xffffff, .82));
const light = new THREE.DirectionalLight(0xffffff, .9);
light.position.set(5, 7, 6);
scene.add(light);

let group = new THREE.Group();
scene.add(group);
const C = { blue:0x38bdf8, green:0x22c55e, orange:0xf59e0b, purple:0xa78bfa, red:0xef4444, white:0xf8fafc, gray:0x64748b, grid:0x334155, yellow:0xfde68a };

function setInfo(t, d, m, n) {
  title.textContent = t;
  desc.textContent = d;
  math.innerHTML = m;
  note.textContent = n;
}
function reset(target = new THREE.Vector3(0,.45,.7), pos = new THREE.Vector3(5.2,4.1,5.8)) {
  scene.remove(group);
  group = new THREE.Group();
  scene.add(group);
  group.add(new THREE.GridHelper(7, 14, C.grid, 0x26303c));
  controls.target.copy(target);
  camera.position.copy(pos);
  camera.updateProjectionMatrix();
}
function label(text, p, color = '#e5e7eb', scale = 1) {
  const cv = document.createElement('canvas');
  cv.width = 430; cv.height = 84;
  const ctx = cv.getContext('2d');
  ctx.font = '700 22px Segoe UI';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(17,24,34,.84)';
  ctx.fillRect(10, 10, 410, 64);
  ctx.fillStyle = color;
  ctx.fillText(text, 215, 43);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(cv), transparent:true, depthTest:false, depthWrite:false }));
  s.position.copy(p);
  s.scale.set(1.35 * scale, .26 * scale, 1);
  s.renderOrder = 20;
  group.add(s);
}
function sphere(p, color, text, r = .075) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 28, 16), new THREE.MeshStandardMaterial({ color, emissive:color, emissiveIntensity:.1 }));
  m.position.copy(p);
  group.add(m);
  if (text) label(text, p.clone().add(new THREE.Vector3(.12,.16,.08)), '#f8fafc', .85);
  return m;
}
function line(a, b, color = C.gray, dashed = false) {
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const mat = dashed ? new THREE.LineDashedMaterial({ color, dashSize:.13, gapSize:.08, transparent:true, opacity:.8 }) : new THREE.LineBasicMaterial({ color });
  const l = new THREE.Line(geo, mat);
  if (dashed) l.computeLineDistances();
  group.add(l);
  return l;
}
function arrow(a, b, color = C.orange, dashed = false) {
  line(a, b, color, dashed);
  const dir = b.clone().sub(a).normalize();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.055, .18, 18), new THREE.MeshStandardMaterial({ color }));
  cone.position.copy(b.clone().sub(dir.clone().multiplyScalar(.08)));
  cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  group.add(cone);
}
function planeQuad(pts, color = C.blue, opacity = .16, name = '') {
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  geo.setIndex([0,1,2,0,2,3]);
  geo.computeVertexNormals();
  group.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color, transparent:true, opacity, side:THREE.DoubleSide, depthWrite:false })));
  group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color })));
  if (name) label(name, pts[1].clone().add(new THREE.Vector3(.1,.18,.04)), '#bfdbfe', .82);
}
function axes(origin = new THREE.Vector3(0,0,0), s = .8) {
  arrow(origin, origin.clone().add(new THREE.Vector3(s,0,0)), C.red);
  arrow(origin, origin.clone().add(new THREE.Vector3(0,s,0)), C.green);
  arrow(origin, origin.clone().add(new THREE.Vector3(0,0,s)), C.blue);
  label('x', origin.clone().add(new THREE.Vector3(s+.15,0,0)), '#fecaca', .65);
  label('y', origin.clone().add(new THREE.Vector3(0,s+.15,0)), '#bbf7d0', .65);
  label('z', origin.clone().add(new THREE.Vector3(0,0,s+.15)), '#bfdbfe', .65);
}
function disc(p, color, text, r = .1) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 48), new THREE.MeshBasicMaterial({ color, transparent:true, opacity:.9, side:THREE.DoubleSide }));
  m.position.copy(p);
  m.rotation.x = -Math.PI / 2;
  group.add(m);
  if (text) label(text, p.clone().add(new THREE.Vector3(.12,.16,.08)), '#f8fafc', .8);
}

function ex1Triangulation() {
  reset(new THREE.Vector3(.15,.4,.45), new THREE.Vector3(5.0,3.9,5.7));
  const c1 = new THREE.Vector3(-1,0,0);
  const c2 = new THREE.Vector3(0,1,-1);
  const x = new THREE.Vector3(1,1,1);
  sphere(c1, C.orange, 'C1=(-1,0,0)');
  sphere(c2, C.purple, 'C2=(0,1,-1)');
  sphere(x, C.white, 'X=(1,1,1)');
  line(c1, c2, C.gray);
  arrow(c1, x, C.green);
  arrow(c2, x, C.blue);
  label('u1=(2,1), zeta1=1', c1.clone().lerp(x,.45).add(new THREE.Vector3(-.2,.18,0)), '#bbf7d0');
  label('u2=(2,0), zeta2=1', c2.clone().lerp(x,.45).add(new THREE.Vector3(.18,.18,0)), '#bfdbfe');
  planeQuad([new THREE.Vector3(.25,-.8,-.1),new THREE.Vector3(.25,1.8,-.1),new THREE.Vector3(.25,1.8,2.0),new THREE.Vector3(.25,-.8,2.0)], C.blue, .1, 'schematicka obrazova rovina');
  setInfo('Priklad 1: linearni triangulace', 'Dva obrazove body urcuji dva projekcni paprsky. Hledany 3D bod je jejich spolecny prusecik.', '<strong>Kontrola</strong><span class="formula">Q1[X;1]=(2,1,1)^T<br>~Q2[X;1]=(2,0,1)^T<br>X=(1,1,1)^T<br>zeta1=zeta2=1</span>', 'Vizualizace ukazuje reseni soustavy: oba paprsky se protinaji v bodu X a hloubky jsou kladne.');
}
function ex2Scale() {
  reset(new THREE.Vector3(0,.25,1.05), new THREE.Vector3(5.2,3.8,5.8));
  const c1 = new THREE.Vector3(0,0,0);
  const tPlus = new THREE.Vector3(0,0,1);
  const tMinus = new THREE.Vector3(0,0,-1);
  sphere(c1, C.orange, 'C1');
  sphere(tPlus, C.green, 't+');
  sphere(tMinus, C.red, 't-');
  arrow(c1, tPlus, C.green);
  arrow(c1, tMinus, C.red);
  const pts = [new THREE.Vector3(.9,.35,1.55), new THREE.Vector3(-.55,.55,1.85), new THREE.Vector3(.25,-.45,2.1)];
  pts.forEach((p,i)=>{ sphere(p, C.white, 'X'+(i+1), .06); line(c1,p,C.gray,true); line(tPlus,p,C.green,true); });
  pts.map(p=>p.clone().multiplyScalar(1.65)).forEach((p,i)=>{ sphere(p, C.purple, 'lambda X'+(i+1), .055); line(c1,p,C.purple,true); });
  label('R+ / R- = dve rotace kolem osy z', new THREE.Vector3(.15,-1.05,1.55), '#ddd6fe');
  setInfo('Priklad 2: meritkova nejednoznacnost', 'Essential matrix urci smer translace a ctyri kandidatni dvojice R,t, ale neurci absolutni meritko rekonstrukce.', '<strong>Vysledek</strong><span class="formula">ker(G)=span((0,0,1)^T)<br>t=(0,0,+-1)^T<br>R+ = rotace -90 deg kolem z<br>R- = rotace +90 deg kolem z<br>X -> lambda X, C -> lambda C</span>', 'Skalovana scena ma stejne obrazove smery. Normalizace ||t||=1 jen zvoli jednotku baseline.');
}
function ex3Companion() {
  reset(new THREE.Vector3(0,.1,.6), new THREE.Vector3(4.8,4.0,5.7));
  const origin = new THREE.Vector3(0,0,0);
  arrow(origin, new THREE.Vector3(2.2,0,0), C.red);
  arrow(origin, new THREE.Vector3(0,2.2,0), C.blue);
  label('Re', new THREE.Vector3(2.35,0,0), '#fecaca', .7);
  label('Im', new THREE.Vector3(0,2.35,0), '#bfdbfe', .7);
  line(new THREE.Vector3(-.2,0,0), new THREE.Vector3(2.25,0,0), C.gray);
  line(new THREE.Vector3(0,-1.85,0), new THREE.Vector3(0,1.85,0), C.gray);
  disc(new THREE.Vector3(.803,0,0), C.green, '0.803', .11);
  disc(new THREE.Vector3(1.098,1.591,0), C.orange, '1.098+1.591i', .13);
  disc(new THREE.Vector3(1.098,-1.591,0), C.orange, '1.098-1.591i', .13);
  label('eigenvalues of Mf', new THREE.Vector3(1.15,-1.95,.25), '#fde68a');
  setInfo('Priklad 3: companion matrix', 'Korene polynomu lze ziskat jako vlastni cisla companion matice.', '<strong>Matice</strong><span class="formula">f(x)=2x^3-6x^2+11x-6<br>Mf=[0 0 3; 1 0 -11/2; 0 1 3]<br>det(xI-Mf)=f(x)/2<br>lambda approx 0.803, 1.098 +- 1.591i</span>', 'Body lezi v komplexni rovine spektra companion matice. Tady nejde o kamerovou geometrii, ale o koreny polynomu.');
}
function ex4RankOne() {
  reset(new THREE.Vector3(.25,.25,.15), new THREE.Vector3(4.8,3.8,5.4));
  axes(new THREE.Vector3(0,0,0), .7);
  const r1 = new THREE.Vector3(0,1,0);
  const r2 = new THREE.Vector3(1,2,0);
  const r3 = new THREE.Vector3(2,4,0);
  arrow(new THREE.Vector3(0,0,0), r1, C.red);
  arrow(new THREE.Vector3(0,0,0), r2, C.green);
  arrow(new THREE.Vector3(0,0,0), r3, C.blue);
  label('puvodni r1 neni nasobek', r1.clone().add(new THREE.Vector3(.1,.15,0)), '#fecaca', .75);
  const base = new THREE.Vector3(1,2,0);
  [0.5,1,2].forEach((s,i)=>{ const p = base.clone().multiplyScalar(s); disc(p, [C.orange,C.green,C.purple][i], s===.5?'a11=1/2':(s===1?'r2':'r3'), .08); });
  line(new THREE.Vector3(.25,.5,0), new THREE.Vector3(2.25,4.5,0), C.yellow);
  setInfo('Priklad 4: vynuceni ranku 1', 'Matice ma hodnost 1, kdyz jsou vsechny nenulove radky nasobky jednoho smeru.', '<strong>Dve opravy</strong><span class="formula">A`: prvni radek = 0, r3=2r2<br>A``: r1=(1/2,1,0), r2=2r1, r3=4r1<br>rank = 1</span>', 'Vizualne rank 1 znamena, ze radkove vektory lezi na jedne primce prochazejici pocatkem.');
}
function ex5LinearSystems() {
  reset(new THREE.Vector3(.45,-.15,.45), new THREE.Vector3(5.0,4.0,5.8));
  axes(new THREE.Vector3(0,0,0), .75);
  const d = new THREE.Vector3(1,-1,1).normalize();
  const o = new THREE.Vector3(1,1,0);
  line(d.clone().multiplyScalar(-1.8), d.clone().multiplyScalar(1.8), C.green);
  label('S = span(1,-1,1)', d.clone().multiplyScalar(1.55).add(new THREE.Vector3(.1,.15,0)), '#bbf7d0', .75);
  line(o.clone().add(d.clone().multiplyScalar(-1.8)), o.clone().add(d.clone().multiplyScalar(1.8)), C.orange);
  sphere(o, C.orange, 'x0=(1,1,0)');
  label('x0 + S', o.clone().add(d.clone().multiplyScalar(1.25)).add(new THREE.Vector3(.12,.15,0)), '#fde68a');
  setInfo('Priklad 5: homogenni a nehomogenni system', 'Homogenni reseni je jadro matice. Nehomogenni reseni je posun jadra o jedno konkretni reseni.', '<strong>Reseni</strong><span class="formula">S = { z(1,-1,1)^T }<br>x0=(1,1,0)^T<br>x0+S = {(z+1,-z+1,z)^T}</span>', 'Zelena primka prochazi pocatkem. Oranzova primka je stejny smer, jen posunuty o x0.');
}
function ex6EigenSpace() {
  reset(new THREE.Vector3(.2,.1,.35), new THREE.Vector3(4.8,3.8,5.5));
  axes(new THREE.Vector3(0,0,0), .75);
  const p1 = new THREE.Vector3(-1.4,1.4,-1.4);
  const p2 = new THREE.Vector3(1.4,1.4,-1.4);
  const p3 = new THREE.Vector3(1.4,-1.4,1.4);
  const p4 = new THREE.Vector3(-1.4,-1.4,1.4);
  planeQuad([p1,p2,p3,p4], C.green, .16, 'eigenspace lambda=1');
  arrow(new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0), C.orange);
  arrow(new THREE.Vector3(0,0,0), new THREE.Vector3(0,-1,1), C.blue);
  label('basis: (1,0,0), (0,-1,1)', new THREE.Vector3(.15,1.15,1.35), '#bbf7d0');
  setInfo('Priklad 6: vlastni prostor', 'Matice ma jedine vlastni cislo lambda=1, ale vlastni prostor ma dimenzi 2.', '<strong>Vysledek</strong><span class="formula">p(lambda)=(lambda-1)^3<br>x2=-x3<br>x=x1(1,0,0)^T+x3(0,-1,1)^T<br>geometricka nasobnost = 2</span>', 'Zelena rovina je mnozina smeru, ktere se matici A jen nasobi cislem 1.');
}
function ex7ComplexRoots() {
  reset(new THREE.Vector3(0,0,0), new THREE.Vector3(4.6,3.7,5.4));
  const origin = new THREE.Vector3(0,0,0);
  arrow(origin, new THREE.Vector3(1.9,0,0), C.red);
  arrow(origin, new THREE.Vector3(0,1.9,0), C.blue);
  label('Re', new THREE.Vector3(2.05,0,0), '#fecaca', .7);
  label('Im', new THREE.Vector3(0,2.05,0), '#bfdbfe', .7);
  disc(new THREE.Vector3(1,0,0), C.green, '1', .11);
  disc(new THREE.Vector3(-1,0,0), C.green, '-1', .11);
  disc(new THREE.Vector3(0,1,0), C.orange, 'i x2', .14);
  disc(new THREE.Vector3(0,-1,0), C.orange, '-i x2', .14);
  line(new THREE.Vector3(-1.25,0,0), new THREE.Vector3(1.25,0,0), C.gray);
  line(new THREE.Vector3(0,-1.25,0), new THREE.Vector3(0,1.25,0), C.gray);
  setInfo('Priklad 7: koreny v C', 'Polynom stupne 6 ma sest komplexnich korenu vcetne nasobnosti.', '<strong>Faktorizace</strong><span class="formula">x^6+x^4-x^2-1<br>=(x^2+1)^2(x^2-1)<br>i, i, -i, -i, 1, -1</span>', 'Vetsi oranzove body znaci dvojnasobne koreny i a -i v komplexni rovine.');
}

const renderers = { 1:ex1Triangulation, 2:ex2Scale, 3:ex3Companion, 4:ex4RankOne, 5:ex5LinearSystems, 6:ex6EigenSpace, 7:ex7ComplexRoots };
(renderers[ex] || ex1Triangulation)();

function resize() {
  const r = host.getBoundingClientRect();
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
  camera.aspect = Math.max(1, r.width) / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
