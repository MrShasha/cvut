<!doctype html>
<html lang="cs">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>GVG - SfM pipeline</title>
<style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#121820;color:#e5edf7;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{height:100%;display:grid;grid-template-columns:minmax(0,1fr)330px;gap:12px}.scene,.panel{border:1px solid #334155;border-radius:8px;background:#18202b}.scene{position:relative;overflow:hidden}svg{display:block;width:100%;height:100%}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}h1{font-size:18px;margin:0}.muted{margin:0;color:#aebccd;font-size:13px;line-height:1.45}.card{border:1px solid #2f3b4d;border-radius:7px;background:#111923;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:7px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.step{cursor:pointer}.box{fill:#18202b;stroke:#3d4b5f;stroke-width:2}.step.active .box{fill:#173454;stroke:#60a5fa}.step.done .box{stroke:#22c55e}.txt{fill:#e5edf7;font-size:16px;font-weight:700;text-anchor:middle;dominant-baseline:middle}.sub{fill:#aebccd;font-size:12px;text-anchor:middle}.arrow{stroke:#94a3b8;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.cam{fill:none;stroke:#f8fafc;stroke-width:2}.pt{fill:#22c55e}.ray{stroke:#64748b;stroke-width:1.5;stroke-dasharray:5 5}.result{margin-top:auto;border:1px solid rgba(34,197,94,.35);background:rgba(34,197,94,.11);color:#bbf7d0;border-radius:7px;padding:10px;font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr}.scene{min-height:560px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="svg" viewBox="0 0 900 620" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker></defs></svg></section><aside class="panel"><h1>Incremental SfM pipeline</h1><p class="muted">Klikni na krok v diagramu. Pipeline postupne odhaduje kamery a ridky 3D model, pak je zpresnuje bundle adjustmentem.</p><div class="card" id="info"></div><div class="result">Nejdulezitejsi kontrola: triangulovane body musi mit kladnou hloubku pred kamerami.</div></aside></main>
<script>
const svg=document.getElementById('svg'),info=document.getElementById('info');
const steps=[
 ['features','Feature detection','SIFT/interest points','Najdi stabilni body v kazdem obraze.'],
 ['matching','Feature matching','2D-2D matches','Sparuj deskriptory mezi obrazy a odstran zjevne spatne shody.'],
 ['ransac','H/E/F + RANSAC','robust model','Odhadni H, F nebo E a ponech jen inlier korespondence.'],
 ['init','Two-view init','R,t + first points','Vyber dobry par: hodne inlieru, neplanarni scena, ne cisty pohyb dopredu.'],
 ['motion','Extend motion','new camera pose','Z 2D-3D shod odhadni absolutni polohu dalsi kamery.'],
 ['structure','Extend structure','triangulation','Z novych 2D-2D shod trianguluj dalsi 3D body.'],
 ['ba','Bundle adjustment','min reprojection error','Spolecne zpresni kamery i 3D body minimalizaci reprojekcni chyby.'],
 ['mvs','Dense MVS','dense point cloud','Po SfM lze hledat dense matches a vytvorit husty model.']
];
let active='init';
function el(tag,a={}){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function text(t,x,y,cls='txt'){const e=el('text',{x,y,class:cls});e.textContent=t;return e}
function drawCamera(x,y,s=1){el('path',{d:`M${x},${y} l${70*s},${-28*s} v${56*s} z`,class:'cam'});el('circle',{cx:x,cy:y,r:6*s,fill:'#f59e0b'})}
function rebuild(){[...svg.children].filter(n=>n.tagName.toLowerCase()!=='defs').forEach(n=>n.remove());const pos=[[150,80],[450,80],[750,80],[150,230],[450,230],[750,230],[310,390],[610,390]];for(let i=0;i<pos.length-1;i++){const [x1,y1]=pos[i], [x2,y2]=pos[i+1];el('path',{d:`M${x1+95},${y1} C${x1+150},${y1} ${x2-150},${y2} ${x2-95},${y2}`,class:'arrow'})}steps.forEach((s,i)=>{const [x,y]=pos[i];const g=el('g',{class:`step ${s[0]===active?'active':''} ${i<steps.findIndex(q=>q[0]===active)?'done':''}`});g.dataset.id=s[0];const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',x-105);r.setAttribute('y',y-42);r.setAttribute('width',210);r.setAttribute('height',84);r.setAttribute('rx',8);r.setAttribute('class','box');g.appendChild(r);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',x);t.setAttribute('y',y-8);t.setAttribute('class','txt');t.textContent=s[1];g.appendChild(t);const u=document.createElementNS('http://www.w3.org/2000/svg','text');u.setAttribute('x',x);u.setAttribute('y',y+22);u.setAttribute('class','sub');u.textContent=s[2];g.appendChild(u);g.onclick=()=>{active=s[0];rebuild()};svg.appendChild(g)});drawCamera(250,535,.9);drawCamera(405,520,.9);drawCamera(565,535,.9);for(const p of [[410,470],[470,455],[520,485],[360,485],[600,470],[455,505]])el('circle',{cx:p[0],cy:p[1],r:6,class:'pt'});for(const c of [[250,535],[405,520],[565,535]])for(const p of [[410,470],[470,455],[520,485]])el('line',{x1:c[0],y1:c[1],x2:p[0],y2:p[1],class:'ray'});const s=steps.find(q=>q[0]===active);info.innerHTML=`<strong>${s[1]}</strong><span class="formula">${s[3]}</span>`}
rebuild();
</script></body></html>
