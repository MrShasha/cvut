<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - homogenni souradnice P2</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{position:relative;overflow:hidden}.scene canvas{display:block;width:100%!important;height:100%!important;cursor:grab}.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:rgba(203,213,225,.56);font-size:12px;pointer-events:none}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.control{display:grid;gap:8px}.control input{width:100%;accent-color:#22c55e}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:520px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene" id="scene"><div class="hint">Táhni = rotace | Scroll = zoom</div></section>
  <aside class="panel">
    <h1>Homogenní souřadnice</h1>
    <p class="muted">Bod P² je 1D podprostor v R³. Zástupce `[u,v,w]ᵀ` protne afinní řez `w=1`, pokud `w≠0`.</p>
    <div class="card control"><strong>Souřadnice [u,v,w]</strong><label>w = <span id="wLabel">1.00</span></label><input id="wSlider" type="range" min="0" max="2" step="0.02" value="1"><span class="formula">u=1, v=0.7</span></div>
    <div class="card"><strong>Převod</strong><span class="formula" id="formula">x=u/w, y=v/w</span></div>
    <div class="result" id="result">Bod je konečný, protože w≠0.</div>
  </aside>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const host=document.getElementById('scene'),slider=document.getElementById('wSlider'),wLabel=document.getElementById('wLabel'),formula=document.getElementById('formula'),result=document.getElementById('result');
let group;const U=1,V=.7;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x14171c);
const camera=new THREE.PerspectiveCamera(46,1,.1,100);camera.position.set(4,3.8,4.8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(.55,.35,.65);controls.minDistance=3;controls.maxDistance=14;
scene.add(new THREE.AmbientLight(0xffffff,.75));const light=new THREE.DirectionalLight(0xffffff,.8);light.position.set(4,5,6);scene.add(light);
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function label(text,color='#e5e7eb'){const c=document.createElement('canvas');c.width=330;c.height=74;const ctx=c.getContext('2d');ctx.font='700 25px Segoe UI, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='rgba(20,23,28,.82)';ctx.strokeStyle='rgba(255,255,255,.18)';rr(ctx,12,8,306,56,10);ctx.fill();ctx.stroke();ctx.fillStyle=color;ctx.fillText(text,165,38);const tex=new THREE.CanvasTexture(c);const mat=new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false,depthWrite:false});const s=new THREE.Sprite(mat);s.scale.set(1.12,.25,1);s.renderOrder=40;return s}
function addLabel(g,t,p,c){const s=label(t,c);s.position.copy(p);g.add(s)}
function plane(g,z,color,op,name){const pts=[new THREE.Vector3(-1.2,-1.2,z),new THREE.Vector3(3,-1.2,z),new THREE.Vector3(3,2.3,z),new THREE.Vector3(-1.2,2.3,z)];const geo=new THREE.BufferGeometry().setFromPoints(pts);geo.setIndex([0,1,2,0,2,3]);geo.computeVertexNormals();g.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false})));g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color,transparent:true,opacity:.9})));addLabel(g,name,new THREE.Vector3(2.75,2.45,z),'#f8fafc')}
function line(g,a,b,color,dashed=false){const geo=new THREE.BufferGeometry().setFromPoints([a,b]);const mat=dashed?new THREE.LineDashedMaterial({color,dashSize:.16,gapSize:.11,transparent:true,opacity:.8}):new THREE.LineBasicMaterial({color});const l=new THREE.Line(geo,mat);if(dashed)l.computeLineDistances();g.add(l)}
function sphere(g,p,color,name){const m=new THREE.Mesh(new THREE.SphereGeometry(.075,24,14),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.15}));m.position.copy(p);g.add(m);if(name)addLabel(g,name,p.clone().add(new THREE.Vector3(.18,.13,.12)),'#f8fafc')}
function rebuild(){if(group)scene.remove(group);group=new THREE.Group();plane(group,1,0x38bdf8,.18,'w=1');plane(group,0,0xf59e0b,.1,'w=0');sphere(group,new THREE.Vector3(0,0,0),0xf59e0b,'O');const w=+slider.value;wLabel.textContent=w.toFixed(2);if(w>.001){const p=new THREE.Vector3(U/w,V/w,1);line(group,new THREE.Vector3(0,0,0),p.clone().multiplyScalar(1.25),0x38bdf8);sphere(group,p,0x22c55e,`(${(U/w).toFixed(2)},${(V/w).toFixed(2)})`);formula.textContent=`(u/w,v/w)=(${(U/w).toFixed(2)},${(V/w).toFixed(2)})`;result.textContent='Bod je konečný, protože přímka přes O protne rovinu w=1.'}else{const d=new THREE.Vector3(U,V,0);line(group,d.clone().multiplyScalar(-1.6),d.clone().multiplyScalar(1.8),0xf59e0b,true);sphere(group,d,0xf59e0b,'[1,0.7,0]');formula.textContent='w=0: afinní dělení není definované';result.textContent='Bod je ideální a reprezentuje směr (1,0.7).'}scene.add(group)}
slider.oninput=rebuild;function resize(){const r=host.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();rebuild();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script>
</body>
</html>
