<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GVG - homogenni souradnice P2</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:620px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:620px}.grid{stroke:#2b313b;stroke-width:1}.axis{stroke:#8b95a5;stroke-width:2}.ray{stroke:#38bdf8;stroke-width:3}.point{fill:#22c55e;stroke:#dcfce7;stroke-width:3;filter:drop-shadow(0 0 8px rgba(34,197,94,.45))}.ideal{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7;opacity:.75}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.control{display:grid;gap:8px}.control input{width:100%;accent-color:#22c55e}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:480px}}
</style></head><body><main class="widget"><section class="scene"><svg id="scene" viewBox="0 0 760 620"></svg></section><aside class="panel"><h1>Homogenní souřadnice</h1><p class="muted">Afinní souřadnice vzniknou dělením poslední souřadnicí. Když w jde k nule, bod míří do nekonečna.</p><div class="card control"><strong>Souřadnice [u,v,w]</strong><label>w = <span id="wLabel">1.00</span></label><input id="wSlider" type="range" min="0" max="2" step="0.02" value="1"><span class="formula">u=1, v=0.7</span></div><div class="card"><strong>Převod</strong><span class="formula" id="formula">x=u/w, y=v/w</span></div><div class="result" id="result">Bod je konečný, protože w ≠ 0.</div></aside></main><script>
const svg=document.getElementById('scene'),slider=document.getElementById('wSlider'),wLabel=document.getElementById('wLabel'),formula=document.getElementById('formula'),result=document.getElementById('result');const W=760,H=620,p=74,min=-1,max=5;const sx=x=>p+(x-min)/(max-min)*(W-2*p),sy=y=>H-p-(y-min)/(max-min)*(H-2*p);function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function render(){const w=+slider.value;wLabel.textContent=w.toFixed(2);svg.innerHTML='';for(let i=-1;i<=5;i++){add('line',{x1:sx(i),y1:sy(-1),x2:sx(i),y2:sy(5),class:'grid'});add('line',{x1:sx(-1),y1:sy(i),x2:sx(5),y2:sy(i),class:'grid'})}add('line',{x1:sx(-1),y1:sy(0),x2:sx(5),y2:sy(0),class:'axis'});add('line',{x1:sx(0),y1:sy(-1),x2:sx(0),y2:sy(5),class:'axis'});txt('x',sx(4.85),sy(0)-12);txt('y',sx(0)+12,sy(4.85));add('line',{x1:sx(0),y1:sy(0),x2:sx(4.8),y2:sy(3.36),class:'ray'});txt('směr [1,0.7,0]',sx(3.05),sy(2.75),'tiny');if(w>0.001){const x=1/w,y=.7/w;add('line',{x1:sx(x),y1:sy(y),x2:sx(x),y2:sy(0),class:'guide'});add('line',{x1:sx(x),y1:sy(y),x2:sx(0),y2:sy(y),class:'guide'});add('circle',{cx:sx(Math.min(x,4.8)),cy:sy(Math.min(y,4.8)),r:10,class:'point'});txt(`(${x.toFixed(2)}, ${y.toFixed(2)})`,sx(Math.min(x,4.8))+14,sy(Math.min(y,4.8))-14);formula.textContent=`(u/w,v/w)=(${(1/w).toFixed(2)},${(.7/w).toFixed(2)})`;result.textContent='Bod je konečný, protože w ≠ 0.'}else{add('circle',{cx:sx(4.8),cy:sy(3.36),r:11,class:'ideal'});txt('w = 0: ideální bod',sx(3.05),sy(3.75));formula.textContent='w=0: afinní dělení není definované';result.textContent='Bod je v nekonečnu a reprezentuje směr (1,0.7).'}}
slider.oninput=render;render();
</script><style>.widget,svg{min-height:0!important}</style></body></html>
