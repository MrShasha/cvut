<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GVG - model projektivni roviny</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:620px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:620px}.plane{fill:rgba(56,189,248,.16);stroke:#38bdf8;stroke-width:2}.ideal{fill:rgba(245,158,11,.14);stroke:#f59e0b;stroke-width:2;stroke-dasharray:8 8}.ray{stroke:#e5e7eb;stroke-width:3}.ray2{stroke:#22c55e;stroke-width:4}.dash{stroke-dasharray:7 7}.point{fill:#22c55e;stroke:#dcfce7;stroke-width:3}.origin{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:480px}}
</style></head><body><main class="widget"><section class="scene"><svg id="scene" viewBox="0 0 800 620"></svg></section><aside class="panel"><h1>Geometrický model P²</h1><p class="muted">Projektivní bod je celá přímka přes počátek v R³. Afinní bod vznikne průnikem této přímky s řezem w=1.</p><div class="tabs"><button class="tab active" data-mode="affine">Afinní bod</button><button class="tab" data-mode="scale">Násobky</button><button class="tab" data-mode="ideal">Ideální bod</button></div><div class="card" id="explain"><strong>Afinní bod</strong><span class="formula">[u,v,w] s w≠0 protne rovinu w=1</span></div><div class="card"><strong>Model</strong><span class="formula">P² = přímky přes O v R³<br>[x,y,w] ~ λ[x,y,w]</span></div><div class="result">Jeden projektivní bod není jeden vektor, ale celá nenulová škálovací třída.</div></aside></main><script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='affine';function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function base(){svg.innerHTML='';add('polygon',{points:'185,390 600,300 690,390 270,500',class:'plane'});txt('řez w = 1 (afinní rovina)',365,505,'tiny');add('circle',{cx:385,cy:455,r:9,class:'origin'});txt('O',397,455);add('line',{x1:385,y1:455,x2:610,y2:88,class:'ray dash'});add('line',{x1:385,y1:455,x2:130,y2:120,class:'ray dash'});}
function render(){base();if(mode==='affine'){add('line',{x1:385,y1:455,x2:540,y2:332,class:'ray2'});add('circle',{cx:540,cy:332,r:10,class:'point'});txt('[u,v,1]',552,326);txt('průnik paprsku s w=1',470,278,'tiny');explain.innerHTML='<strong>Afinní bod</strong><span class="formula">paprsek přes O protne w=1<br>[u,v,w] -> (u/w,v/w)</span>'}else if(mode==='scale'){add('line',{x1:385,y1:455,x2:620,y2:270,class:'ray2'});[[470,388,'x'],[540,333,'2x'],[610,278,'3x']].forEach(p=>{add('circle',{cx:p[0],cy:p[1],r:8,class:'point'});txt(p[2],p[0]+10,p[1]-8)});explain.innerHTML='<strong>Násobky</strong><span class="formula">x, 2x, 3x reprezentují stejný bod P²</span>'}else{add('polygon',{points:'520,88 708,146 704,330 530,270',class:'ideal'});txt('směry rovnoběžné s w=1',525,76,'tiny');add('line',{x1:385,y1:455,x2:650,y2:130,class:'ray2'});add('circle',{cx:650,cy:130,r:10,class:'point'});txt('[u,v,0]',662,126);explain.innerHTML='<strong>Ideální bod</strong><span class="formula">paprsek neprotne w=1<br>w=0 reprezentuje směr</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script><style>.widget,svg{min-height:0!important}</style></body></html>
