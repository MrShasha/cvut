<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - geometricky model P2</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.plane{fill:rgba(229,231,235,.06);stroke:#cbd5e1;stroke-width:2}.idealPlane{fill:rgba(34,197,94,.09);stroke:#22c55e;stroke-width:2;stroke-dasharray:7 7}.ray{stroke:#e5e7eb;stroke-width:2.5}.rayMain{stroke:#22c55e;stroke-width:4}.parallel{stroke:#22c55e;stroke-width:2.5}.dash{stroke-dasharray:7 7}.point{fill:#111827;stroke:#e5e7eb;stroke-width:3}.origin{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:860px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:480px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene"><svg id="scene" viewBox="0 0 820 620"></svg></section>
  <aside class="panel">
    <h1>Geometrický model P²</h1>
    <p class="muted">Podle Fig. 9.2: projektivní body jsou přímky v A³ procházející bodem O.</p>
    <div class="tabs">
      <button class="tab active" data-mode="affine">Afinní body</button>
      <button class="tab" data-mode="ideal">Ideální body</button>
      <button class="tab" data-mode="parallel">Směry</button>
    </div>
    <div class="card" id="explain"></div>
    <div class="card"><strong>GVG model</strong><span class="formula">P² = { přímky v A³ přes O }<br>afinní bod: přímka přes O protne A²<br>ideální bod: přímka přes O je rovnoběžná s A²</span></div>
    <div class="result">Ideální body odpovídají směrům rovnoběžek v A².</div>
  </aside>
</main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='affine';
function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function line(a,b,cls){add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls})}
const A=[430,110],B=[670,190],C=[660,430],D=[420,350],O=[220,370];
function plane(){add('polygon',{points:`${A} ${B} ${C} ${D}`,class:'plane'});txt('A²',432,96);txt('A³',265,105);txt('O',190,382);add('circle',{cx:O[0],cy:O[1],r:8,class:'origin'})}
function affinePoints(){[[500,185],[565,245],[505,300]].forEach((p,i)=>{line(O,p,i===1?'rayMain':'ray');add('circle',{cx:p[0],cy:p[1],r:5,class:'point'})});txt('přímky přes O protínají A²',365,500,'tiny')}
function idealPlane(){const P=[172,190],Q=[352,250],R=[350,430],S=[170,370];add('polygon',{points:`${P} ${Q} ${R} ${S}`,class:'idealPlane'});txt('rovina přes O rovnoběžná s A²',118,180,'tiny');line([145,250],[365,320],'rayMain');line([160,310],[380,380],'rayMain');line([180,370],[400,440],'rayMain');txt('svazek přímek přes O',112,455,'tiny')}
function parallelLines(){idealPlane();[[450,170,650,235],[440,205,640,270],[430,240,630,305],[420,275,620,340],[410,310,610,375]].forEach(p=>line([p[0],p[1]],[p[2],p[3]],'parallel'));txt('jeden ideální bod ↔ jeden směr v A²',385,500,'tiny')}
function render(){svg.innerHTML='';plane();if(mode==='affine'){affinePoints();explain.innerHTML='<strong>Afinní body</strong><span class="formula">každý bod X ∈ A² určí právě jednu přímku OX</span>'}if(mode==='ideal'){affinePoints();idealPlane();explain.innerHTML='<strong>Ideální body</strong><span class="formula">přímky přes O rovnoběžné s A² neprotínají A²<br>v P² jsou to ideální body</span>'}if(mode==='parallel'){parallelLines();explain.innerHTML='<strong>Směry rovnoběžek</strong><span class="formula">každý ideální bod reprezentuje jednu třídu rovnoběžek v A²</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script>
</body>
</html>
