<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVG - afinni vs linearni</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)300px;gap:12px;height:100%;min-height:560px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:560px}.grid{stroke:#2b313b;stroke-width:1}.axis{stroke:#8b95a5;stroke-width:2;marker-end:url(#arrow)}.linear{stroke:#38bdf8;stroke-width:4}.affine{stroke:#f59e0b;stroke-width:4}.vec{stroke:#22c55e;stroke-width:4;marker-end:url(#arrowGreen)}.point{fill:#e5e7eb;stroke:#111827;stroke-width:2}.origin{fill:#22c55e}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:820px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:420px}}
</style>
</head>
<body>
<main class="widget">
<section class="scene"><svg id="scene" viewBox="0 0 760 560">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#8b95a5"/></marker><marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#22c55e"/></marker></defs>
</svg></section>
<aside class="panel">
<h1>Afinní vs lineární</h1>
<p class="muted">Lineární mapa drží počátek. Afinní mapa dovolí posun. Afinní prostor proto pracuje s body a vektory odděleně.</p>
<div class="tabs"><button class="tab active" data-mode="linear">Lineární</button><button class="tab" data-mode="affine">Afinní</button><button class="tab" data-mode="points">Body vs vektory</button></div>
<div class="card" id="explain"><strong>Lineární</strong><span class="formula">f(x)=ax, tedy f(0)=0</span></div>
<div class="card"><strong>Klíč</strong><span class="formula">bod - bod = vektor<br>bod + vektor = bod<br>bod + bod nedává afinně smysl</span></div>
<div class="result">Afinní transformace je lineární část plus translace.</div>
</aside>
</main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='linear';
const W=760,H=560,p=70,min=-3,max=3;const sx=x=>p+(x-min)/(max-min)*(W-2*p),sy=y=>H-p-(y-min)/(max-min)*(H-2*p);
function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function base(){svg.innerHTML=svg.querySelector('defs').outerHTML;for(let i=-3;i<=3;i++){add('line',{x1:sx(i),y1:sy(-3),x2:sx(i),y2:sy(3),class:'grid'});add('line',{x1:sx(-3),y1:sy(i),x2:sx(3),y2:sy(i),class:'grid'})}add('line',{x1:sx(-3),y1:sy(0),x2:sx(3),y2:sy(0),class:'axis'});add('line',{x1:sx(0),y1:sy(-3),x2:sx(0),y2:sy(3),class:'axis'});add('circle',{cx:sx(0),cy:sy(0),r:7,class:'point origin'});txt('O',sx(0)+10,sy(0)-10)}
function render(){base();if(mode==='linear'){add('line',{x1:sx(-2.4),y1:sy(-1.6),x2:sx(2.4),y2:sy(1.6),class:'linear'});txt('f(x)=ax prochází počátkem',sx(-2.55),sy(2.45));explain.innerHTML='<strong>Lineární</strong><span class="formula">f(x)=ax<br>f(0)=0</span>'}else if(mode==='affine'){add('line',{x1:sx(-2.4),y1:sy(-0.6),x2:sx(2.4),y2:sy(2.6),class:'affine'});add('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(1),class:'vec'});txt('b',sx(.1),sy(.55));txt('f(x)=ax+b posune počátek',sx(-2.55),sy(2.85));explain.innerHTML='<strong>Afinní</strong><span class="formula">f(x)=ax+b<br>f(0)=b</span>'}else{add('circle',{cx:sx(-1.3),cy:sy(.5),r:8,class:'point'});add('circle',{cx:sx(1.2),cy:sy(1.6),r:8,class:'point'});add('line',{x1:sx(-1.3),y1:sy(.5),x2:sx(1.2),y2:sy(1.6),class:'vec'});txt('x',sx(-1.45),sy(.25));txt('y',sx(1.3),sy(1.85));txt('φ(x,y) = y - x',sx(-.8),sy(1.65));explain.innerHTML='<strong>Body vs vektory</strong><span class="formula">φ(x,y) je vektor z x do y</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script>
</body>
</html>
