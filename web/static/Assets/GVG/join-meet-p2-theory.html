<!DOCTYPE html>
<html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GVG - join a meet v P2</title><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:620px}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%;min-height:620px}.grid{stroke:#2b313b;stroke-width:1}.axis{stroke:#8b95a5;stroke-width:2}.lineA{stroke:#38bdf8;stroke-width:4}.lineB{stroke:#f59e0b;stroke-width:4}.join{stroke:#22c55e;stroke-width:4;filter:drop-shadow(0 0 8px rgba(34,197,94,.35))}.pointA{fill:#38bdf8;stroke:#e0f2fe;stroke-width:3}.pointB{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}.meet{fill:#22c55e;stroke:#dcfce7;stroke-width:3;filter:drop-shadow(0 0 8px rgba(34,197,94,.45))}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene svg{min-height:460px}}</style></head>
<body><main class="widget"><section class="scene"><svg id="scene" viewBox="0 0 760 620"></svg></section><aside class="panel"><h1>Join a meet v P²</h1><p class="muted">V P² se obě základní konstrukce počítají stejnou operací: vektorovým součinem.</p><div class="tabs"><button class="tab active" data-mode="join">Join bodů</button><button class="tab" data-mode="meet">Meet přímek</button></div><div class="card" id="explain"><strong>Join</strong><span class="formula">l = x1 × x2</span></div><div class="result">Dualita: body a přímky v P² používají stejnou algebru.</div></aside></main><script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='join';const W=760,H=620,p=74,min=-1,max=4;const sx=x=>p+(x-min)/(max-min)*(W-2*p),sy=y=>H-p-(y-min)/(max-min)*(H-2*p);function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}function base(){svg.innerHTML='';for(let i=-1;i<=4;i++){add('line',{x1:sx(i),y1:sy(-1),x2:sx(i),y2:sy(4),class:'grid'});add('line',{x1:sx(-1),y1:sy(i),x2:sx(4),y2:sy(i),class:'grid'})}add('line',{x1:sx(-1),y1:sy(0),x2:sx(4),y2:sy(0),class:'axis'});add('line',{x1:sx(0),y1:sy(-1),x2:sx(0),y2:sy(4),class:'axis'})}
function render(){base();if(mode==='join'){add('line',{x1:sx(-.7),y1:sy(-.14),x2:sx(3.4),y2:sy(2.82),class:'join'});add('circle',{cx:sx(.6),cy:sy(.8),r:10,class:'pointA'});add('circle',{cx:sx(2.4),cy:sy(2.1),r:10,class:'pointB'});txt('x1',sx(.72),sy(.65));txt('x2',sx(2.52),sy(1.95));txt('l = x1 × x2',sx(1.4),sy(2.75));explain.innerHTML='<strong>Join</strong><span class="formula">dva body určují přímku<br>l = x1 × x2</span>'}else{add('line',{x1:sx(-.8),y1:sy(3.2),x2:sx(3.4),y2:sy(.6),class:'lineA'});add('line',{x1:sx(-.8),y1:sy(.25),x2:sx(3.5),y2:sy(3.54),class:'lineB'});add('circle',{cx:sx(1.33),cy:sy(1.88),r:11,class:'meet'});txt('x = k × l',sx(1.46),sy(1.72));txt('k',sx(.2),sy(2.65));txt('l',sx(2.5),sy(2.98));explain.innerHTML='<strong>Meet</strong><span class="formula">dvě přímky určují bod<br>x = k × l</span>'}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script><style>.widget,svg{min-height:0!important}</style></body></html>
