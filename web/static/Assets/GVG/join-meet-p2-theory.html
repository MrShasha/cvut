<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GVG - join a meet v P2</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#14171c;color:#e6edf3;font-family:"Segoe UI",system-ui,sans-serif;padding:14px;overflow:hidden}.widget{display:grid;grid-template-columns:minmax(0,1fr)320px;gap:12px;height:100%;min-height:0}.scene,.panel{border:1px solid #343b46;border-radius:8px;background:#1d222b}.scene{overflow:hidden}svg{display:block;width:100%;height:100%}.plane{fill:rgba(229,231,235,.06);stroke:#cbd5e1;stroke-width:2}.subspace{fill:rgba(37,99,235,.1);stroke:#2563eb;stroke-width:2;stroke-dasharray:7 7}.ray{stroke:#2563eb;stroke-width:3;marker-end:url(#arrowBlue)}.lineL{stroke:#ef4444;stroke-width:3}.lineK{stroke:#e879f9;stroke-width:3}.dual{stroke:#ef4444;stroke-width:3;marker-end:url(#arrowRed)}.dualK{stroke:#e879f9;stroke-width:3;marker-end:url(#arrowPink)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}.point{fill:#f8fafc;stroke:#111827;stroke-width:2}.meet{fill:#22c55e;stroke:#dcfce7;stroke-width:3}.origin{fill:#f59e0b;stroke:#fff7ed;stroke-width:3}text{fill:#dbe4f0;font-size:15px;font-weight:750}.tiny{fill:#94a3b8;font-size:12px}.panel{padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}h1{margin:0;color:#f8fafc;font-size:18px}.muted{margin:0;color:#9ca3af;font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tab{border:1px solid #3c4655;border-radius:6px;background:#252c37;color:#e5e7eb;padding:8px 6px;cursor:pointer}.tab.active,.tab:hover{border-color:#60a5fa;background:#17304e}.card{border:1px solid #303743;border-radius:7px;background:#171c24;padding:10px;color:#cbd5e1;font-size:13px;line-height:1.5}.formula{display:block;margin-top:6px;color:#f8fafc;font-family:Consolas,monospace;font-size:12px;line-height:1.55}.result{margin-top:auto;border-radius:7px;padding:10px;background:rgba(34,197,94,.12);color:#bbf7d0;border:1px solid rgba(34,197,94,.35);font-size:13px;line-height:1.45}@media(max-width:840px){body{overflow:auto}.widget{grid-template-columns:1fr;height:auto}.scene{min-height:460px}}
</style>
</head>
<body>
<main class="widget">
  <section class="scene"><svg id="scene" viewBox="0 0 820 620"><defs><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker><marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker><marker id="arrowPink" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#e879f9"/></marker></defs></svg></section>
  <aside class="panel">
    <h1>Join a meet v P²</h1>
    <p class="muted">Podle Fig. 9.8 a 9.9: join dvou bodů je jediná přímka přes ně, meet dvou přímek je jediný incidentní bod.</p>
    <div class="tabs"><button class="tab active" data-mode="join">Join bodů</button><button class="tab" data-mode="meet">Meet přímek</button></div>
    <div class="card" id="explain"></div>
    <div class="result">V homogenních souřadnicích se obojí počítá vektorovým součinem.</div>
  </aside>
</main>
<script>
const svg=document.getElementById('scene'),explain=document.getElementById('explain');let mode='join';
function add(t,a){const e=document.createElementNS('http://www.w3.org/2000/svg',t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);svg.appendChild(e);return e}
function txt(s,x,y,c=''){const e=add('text',{x,y,class:c});e.textContent=s}
function line(a,b,cls){add('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:cls})}
const O=[235,390],A=[440,120],B=[680,205],C=[650,430],D=[410,345],x=[510,285],y=[625,232],m=[555,265],k1=[490,180],k2=[605,410];
function base(){svg.innerHTML=svg.querySelector('defs').outerHTML;add('polygon',{points:`${A} ${B} ${C} ${D}`,class:'plane'});txt('A²',437,105);txt('A³',270,115);add('circle',{cx:O[0],cy:O[1],r:8,class:'origin'});txt('O',205,402);line([300,235],[385,455],'dash')}
function drawJoin(){add('polygon',{points:`${O} ${x} ${y}`,class:'subspace'});line(O,x,'ray');line(O,y,'ray');line(x,y,'lineL');line([235,390],[160,170],'dual');add('circle',{cx:x[0],cy:x[1],r:7,class:'point'});add('circle',{cx:y[0],cy:y[1],r:7,class:'point'});txt('x',522,280);txt('y',638,228);txt('l',570,245);txt('l = x × y',116,165,'tiny');explain.innerHTML='<strong>Join</strong><span class="formula">x=[1,0,1], y=[0,1,1]<br>l=x×y=[-1,-1,1]<br>lᵀx=0, lᵀy=0</span>'}
function drawMeet(){line([455,315],[665,222],'lineL');line(k1,k2,'lineK');line([235,390],[160,170],'dual');line([235,390],[345,415],'dualK');line(O,m,'ray');add('circle',{cx:m[0],cy:m[1],r:8,class:'meet'});txt('x',568,258);txt('l',650,220);txt('k',612,388);txt('x = k × l',116,166,'tiny');explain.innerHTML='<strong>Meet</strong><span class="formula">k=[1,0,-1], l=[0,1,-1]<br>x=k×l=[1,1,1]<br>kᵀx=0, lᵀx=0</span>'}
function render(){base();if(mode==='join')drawJoin();else drawMeet()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});render();
</script>
</body>
</html>
