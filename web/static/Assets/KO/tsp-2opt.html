<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSP 2-OPT</title>
<style>
:root{--bg:#111827;--panel:rgba(24,31,43,.94);--line:rgba(156,163,175,.24);--text:#edf2f7;--muted:#9ca3af;--green:#34d399;--amber:#fbbf24;--rose:#fb7185;--cyan:#22d3ee}
*{box-sizing:border-box}body{min-width:860px;margin:0;padding:14px;overflow-x:auto;background:radial-gradient(circle at 0 0,rgba(251,113,133,.13),transparent 27rem),radial-gradient(circle at 100% 100%,rgba(52,211,153,.10),transparent 28rem),var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px}button{font:inherit}.topbar,.scene,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 18px 44px rgba(0,0,0,.22)}.topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;margin-bottom:10px}.eyebrow,.label,.panel-title{color:var(--muted);font-size:10px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}h1{margin:2px 0 0;font-size:19px;letter-spacing:0}.btn{border:1px solid rgba(34,211,238,.6);border-radius:8px;padding:7px 12px;background:linear-gradient(135deg,rgba(8,145,178,.96),rgba(37,99,235,.90));color:#fff;font-weight:800;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr)292px;gap:10px}.scene{min-height:520px;padding:14px;background:linear-gradient(rgba(156,163,175,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(156,163,175,.04) 1px,transparent 1px),rgba(17,24,39,.84);background-size:24px 24px}svg{width:100%;height:390px;border:1px solid var(--line);border-radius:12px;background:rgba(15,23,42,.68)}.edge{stroke:var(--cyan);stroke-width:5;fill:none}.edge.bad{stroke:var(--rose);stroke-width:7}.edge.good{stroke:var(--green);stroke-width:7}.node circle{fill:#111827;stroke:#cbd5e1;stroke-width:2}.node text{fill:#f8fafc;font-weight:900;font-size:13px;text-anchor:middle;dominant-baseline:middle}.weight rect{fill:rgba(15,23,42,.94);stroke:rgba(148,163,184,.32);rx:5}.weight text{fill:#f8fafc;font-size:12px;font-weight:900;text-anchor:middle;dominant-baseline:middle}.caption{margin-top:10px;border-left:3px solid var(--cyan);border-radius:8px;padding:10px 11px;background:rgba(8,145,178,.12);color:#dbeafe;line-height:1.45}.side{display:grid;gap:10px;align-content:start}.panel{padding:12px}.note{margin:8px 0 0;color:#d1d5db;line-height:1.45}
</style>
</head>
<body>
<div class="topbar"><div><div class="eyebrow">Lokalni hledani</div><h1>2-OPT: odstraneni krizeni hran</h1></div><button class="btn" id="toggle">Ukaz 2-OPT</button></div>
<div class="layout"><main class="scene"><svg id="svg" viewBox="0 0 760 390"></svg><div class="caption" id="caption"></div></main><aside class="side"><section class="panel"><div class="panel-title">Hrany</div><p class="note">Cisla primo v grafu jsou delky hran. Cervene hrany jsou dve odstranene hrany, zelene jsou nove hrany po 2-OPT.</p></section><section class="panel"><div class="panel-title">Princip</div><p class="note">2-OPT odebere dve hrany a obrati segment mezi nimi. U euklidovskeho TSP odstraneni krizeni tour zkrati.</p></section></aside></div>
<script>
const pts={A:[150,80],B:[610,305],C:[150,305],D:[610,80]};
const weights={"A-B":10,"B-C":8,"C-D":10,"D-A":8,"A-C":5,"C-B":8,"B-D":5};
let improved=false;const svg=document.getElementById("svg"),caption=document.getElementById("caption"),btn=document.getElementById("toggle");
function key(u,v){return weights[`${u}-${v}`]!==undefined?`${u}-${v}`:`${v}-${u}`}
function edge(u,v,cls=""){const [x1,y1]=pts[u],[x2,y2]=pts[v];return `<line class="edge ${cls}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`}
function weight(u,v){const [x1,y1]=pts[u],[x2,y2]=pts[v],x=(x1+x2)/2,y=(y1+y2)/2,w=weights[key(u,v)];return `<g class="weight"><rect x="${x-12}" y="${y-10}" width="24" height="20"/><text x="${x}" y="${y+1}">${w}</text></g>`}
function node(id){const [x,y]=pts[id];return `<g class="node"><circle cx="${x}" cy="${y}" r="18"/><text x="${x}" y="${y+1}">${id}</text></g>`}
function draw(){svg.innerHTML="";const edges=!improved?[["A","B"],["B","C"],["C","D"],["D","A"]]:[["A","C"],["C","B"],["B","D"],["D","A"]];edges.forEach(e=>svg.insertAdjacentHTML("beforeend",edge(e[0],e[1],!improved&&((e[0]==="A"&&e[1]==="B")||(e[0]==="C"&&e[1]==="D"))?"bad":improved&&((e[0]==="A"&&e[1]==="C")||(e[0]==="B"&&e[1]==="D"))?"good":"")));edges.forEach(e=>svg.insertAdjacentHTML("beforeend",weight(e[0],e[1])));caption.textContent=!improved?"Puvodni tour obsahuje dve krizici se hrany A-B a C-D. Tyto dve hrany odebereme.":"Po 2-OPT pridame hrany A-C a B-D. Segment B-C se obrati, krizeni zmizi a tour je kratsi.";btn.textContent=improved?"Zpet":"Ukaz 2-OPT";Object.keys(pts).forEach(id=>svg.insertAdjacentHTML("beforeend",node(id)))}
btn.onclick=()=>{improved=!improved;draw()};draw();
</script>
</body>
</html>
