<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ford-Fulkerson</title>
  <style>
    :root{--bg:#0f172a;--panel:#172033;--ink:#e5e7eb;--muted:#94a3b8;--line:#334155;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--amber:#fbbf24;--violet:#a78bfa}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 360px;gap:16px}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
    h1{font-size:22px;margin:0 0 4px}.muted{color:var(--muted);margin:0 0 12px}
    svg{width:100%;height:430px;background:#0b1220;border:1px solid var(--line);border-radius:8px}
    .edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .flow{stroke:var(--blue);stroke-width:7;fill:none;stroke-linecap:round;opacity:.72}
    .active{stroke:var(--amber);stroke-width:6;fill:none;marker-end:url(#arrowHot);filter:url(#glow)}
    .active.back{stroke:var(--violet);marker-end:url(#arrowBack);stroke-dasharray:9 6}
    .cut{stroke:var(--red);stroke-width:4;stroke-dasharray:9 7}.node{fill:#1e293b;stroke:#64748b;stroke-width:2}.node.source,.node.sink{stroke:var(--blue);stroke-width:3}.node.reach{stroke:var(--green);stroke-width:4}
    .txt{fill:var(--ink);font-weight:800;text-anchor:middle;dominant-baseline:middle}.label rect{fill:#0b1220;stroke:#475569;rx:6}.label text{fill:#e5e7eb;font:800 13px Consolas,monospace;text-anchor:middle}
    button{background:#24324a;color:var(--ink);border:1px solid #475569;border-radius:7px;padding:9px 12px;cursor:pointer}button.primary{background:#0e7490;border-color:#22d3ee}.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .stat{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.2)}.stat:last-child{border:0}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#26364f;color:#cbd5e1;font-size:12px;margin-bottom:8px}
    .formula{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;font:800 13px Consolas,monospace;color:#dbeafe;margin-top:10px}.legend{display:grid;gap:7px;margin-top:12px;color:#cbd5e1}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px}
    @media(max-width:860px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>Ford-Fulkerson: augmentace a min-cut</h1>
      <p class="muted">Hrany jsou značeny jako <b>f/u</b>. Fialová cesta jde proti původní hraně a snižuje už poslaný tok.</p>
      <svg id="svg" viewBox="0 0 780 430" aria-label="Ford-Fulkerson flow network"></svg>
      <div class="controls">
        <button id="prev">← zpět</button>
        <button class="primary" id="next">další krok →</button>
        <button id="reset">reset</button>
      </div>
    </main>
    <aside class="panel">
      <span class="badge" id="badge"></span>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="stat"><span>Hodnota toku</span><b id="value"></b></div>
      <div class="stat"><span>Bottleneck γ</span><b id="gamma"></b></div>
      <div class="stat"><span>Aktivní cesta</span><b id="path"></b></div>
      <div class="formula" id="formula"></div>
      <div class="legend">
        <div><span class="dot" style="background:var(--blue)"></span>aktuální tok</div>
        <div><span class="dot" style="background:var(--amber)"></span>augmentace vpřed</div>
        <div><span class="dot" style="background:var(--violet)"></span>zpětná hrana v reziduálním grafu</div>
        <div><span class="dot" style="background:var(--red)"></span>minimální řez</div>
      </div>
    </aside>
  </div>
  <script>
    const nodes={s:[90,215],A:[300,105],B:[300,325],t:[660,215]};
    const edges=[
      {id:"sA",from:"s",to:"A",u:3,label:[190,145]},
      {id:"sB",from:"s",to:"B",u:2,label:[190,285]},
      {id:"AB",from:"A",to:"B",u:2,label:[326,215],curve:[238,215]},
      {id:"At",from:"A",to:"t",u:2,label:[500,145]},
      {id:"Bt",from:"B",to:"t",u:3,label:[500,285]}
    ];
    const steps=[
      {f:{sA:0,sB:0,AB:0,At:0,Bt:0},title:"Start: nulový tok",text:"Všechny dolní meze jsou 0, takže nulový tok je přípustný.",gamma:"-",path:"-",formula:"f(e)=0 pro všechny hrany"},
      {f:{sA:2,sB:0,AB:2,At:0,Bt:2},act:[["sA",1],["AB",1],["Bt",1]],title:"1. cesta s → A → B → t",text:"Bottleneck je hrana A→B s kapacitou 2. Pošleme 2 jednotky.",gamma:"2",path:"s-A-B-t",formula:"γ = min(3,2,3) = 2"},
      {f:{sA:3,sB:0,AB:2,At:1,Bt:2},act:[["sA",1],["At",1]],title:"2. cesta s → A → t",text:"Ještě zbývá 1 jednotka kapacity na s→A, proto doplníme horní větev.",gamma:"1",path:"s-A-t",formula:"|f| = 3"},
      {f:{sA:3,sB:1,AB:2,At:1,Bt:3},act:[["sB",1],["Bt",1]],title:"3. cesta s → B → t",text:"Hrana B→t se nasytí. Tok má hodnotu 4, ale ještě to není maximum.",gamma:"1",path:"s-B-t",formula:"B→t: 2/3 → 3/3"},
      {f:{sA:3,sB:2,AB:1,At:2,Bt:3},act:[["sB",1],["AB",-1],["At",1]],title:"4. cesta s → B → A → t",text:"V reziduálním grafu použijeme zpětnou hranu B→A. Tím snížíme tok na A→B a přesměrujeme jej do A→t.",gamma:"1",path:"s-B-A-t",formula:"A→B: 2/2 → 1/2"},
      {f:{sA:3,sB:2,AB:1,At:2,Bt:3},reach:["s"],cut:true,title:"Konec: žádná s-t cesta v reziduálním grafu",text:"Ze zdroje už nevede žádná reziduální hrana vpřed. Tok je maximální a řez {s} má kapacitu 3+2=5.",gamma:"-",path:"-",formula:"max-flow = min-cut = 5"}
    ];
    let step=0;
    const NS="http://www.w3.org/2000/svg";
    function el(n,a={}){const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
    function d(e,rev=false){const [x1,y1]=nodes[rev?e.to:e.from], [x2,y2]=nodes[rev?e.from:e.to]; if(e.curve){const [cx,cy]=e.curve;return `M${x1},${y1} Q${cx},${cy} ${x2},${y2}`} return `M${x1},${y1} L${x2},${y2}`}
    function edge(id){return edges.find(e=>e.id===id)}
    function active(id){return (steps[step].act||[]).find(a=>a[0]===id)}
    function render(){
      const s=steps[step], svg=document.getElementById("svg"); svg.innerHTML="";
      const defs=el("defs"); defs.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><marker id="arrowHot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#fbbf24"/></marker><marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#a78bfa"/></marker><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>'; svg.append(defs);
      if(s.cut) svg.append(el("line",{x1:160,y1:35,x2:160,y2:395,class:"cut"}));
      edges.forEach(e=>{
        svg.append(el("path",{d:d(e),class:"edge"}));
        if(s.f[e.id]>0) svg.append(el("path",{d:d(e),class:"flow","stroke-width":4+s.f[e.id]}));
        const a=active(e.id); if(a) svg.append(el("path",{d:d(e,a[1]<0),class:"active"+(a[1]<0?" back":"")}));
        const g=el("g",{class:"label"}); g.append(el("rect",{x:e.label[0]-28,y:e.label[1]-15,width:56,height:28,rx:6})); const tx=el("text",{x:e.label[0],y:e.label[1]+5}); tx.textContent=`${s.f[e.id]}/${e.u}`; g.append(tx); svg.append(g);
      });
      Object.entries(nodes).forEach(([id,[x,y]])=>{const g=el("g"); const c=el("circle",{cx:x,cy:y,r:id==="s"||id==="t"?30:26,class:`node ${id==="s"?"source":id==="t"?"sink":""} ${(s.reach||[]).includes(id)?"reach":""}`}); const t=el("text",{x,y:y+1,class:"txt"}); t.textContent=id; g.append(c,t); svg.append(g)});
      document.getElementById("badge").textContent=`${step+1} / ${steps.length}`;
      document.getElementById("title").textContent=s.title;
      document.getElementById("text").textContent=s.text;
      document.getElementById("value").textContent=s.f.sA+s.f.sB;
      document.getElementById("gamma").textContent=s.gamma;
      document.getElementById("path").textContent=s.path;
      document.getElementById("formula").textContent=s.formula;
    }
    document.getElementById("next").onclick=()=>{step=Math.min(steps.length-1,step+1);render()};
    document.getElementById("prev").onclick=()=>{step=Math.max(0,step-1);render()};
    document.getElementById("reset").onclick=()=>{step=0;render()};
    render();
  </script>
</body>
</html>
