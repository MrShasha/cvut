<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chetto-Silly-Bouchentouf</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #f8fafc;
      --line: #cbd5e1;
      --text: #111827;
      --muted: #64748b;
      --green: #16a34a;
      --blue: #2563eb;
      --orange: #f97316;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .wrap {
      height: 760px;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: #94a3b8; background: #f8fafc; }

    .counter {
      min-width: 86px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .main {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      min-height: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
      min-height: 0;
    }

    .viz {
      background: #fff;
      padding: 12px;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
      padding: 14px;
    }

    .step-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .step-text {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .formula {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      font: 700 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-line;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      overflow: hidden;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }

    th, td {
      padding: 7px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: center;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      background: #f8fafc;
    }

    tr:last-child td { border-bottom: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>Chetto-Silly-Bouchentouf: převod závislých úloh na nezávislé</h1>
        <p class="subtitle">Závislosti zapíšeme do zpřísněných release times a deadlines. Potom stačí spustit Hornův EDF.</p>
      </div>
      <div class="controls">
        <button type="button" id="prev">←</button>
        <button type="button" id="play">Play</button>
        <button type="button" id="next">→</button>
        <span class="counter" id="counter"></span>
      </div>
    </header>

    <main class="main">
      <section class="panel viz">
        <svg id="viz" viewBox="0 0 760 560" aria-label="Chetto-Silly-Bouchentouf graph"></svg>
      </section>

      <aside class="panel side">
        <div>
          <h2 class="step-title" id="stepTitle"></h2>
          <p class="step-text" id="stepText"></p>
        </div>

        <div class="formula" id="formula"></div>

        <table>
          <thead>
            <tr><th>úloha</th><th>p</th><th>r</th><th>d</th><th>r'</th><th>d'</th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </aside>
    </main>
  </div>

  <script>
    const jobs = [
      { id: "T1", p: 2, r: 0, d: 12, x: 120, y: 120, color: "#2563eb" },
      { id: "T2", p: 1, r: 1, d: 11, x: 300, y: 120, color: "#0891b2" },
      { id: "T3", p: 2, r: 0, d: 10, x: 420, y: 260, color: "#ca8a04" },
      { id: "T4", p: 2, r: 3, d: 12, x: 180, y: 360, color: "#7c3aed" },
      { id: "T5", p: 1, r: 0, d: 8, x: 620, y: 260, color: "#dc2626" }
    ];

    const edges = [
      ["T1", "T3"],
      ["T2", "T3"],
      ["T3", "T5"],
      ["T4", "T5"]
    ];

    const finalR = { T1: 0, T2: 1, T3: 2, T4: 3, T5: 5 };
    const finalD = { T1: 5, T2: 5, T3: 7, T4: 7, T5: 8 };

    const schedule = [
      { job: "T1", start: 0, end: 2 },
      { job: "T2", start: 2, end: 3 },
      { job: "T3", start: 3, end: 5 },
      { job: "T4", start: 5, end: 7 },
      { job: "T5", start: 7, end: 8 }
    ];

    const steps = [
      {
        title: "1. Původní závislé úlohy",
        text: "EDF sám o sobě vidí jen deadlines. Proto nejdřív upravíme časová okna tak, aby precedence constraints byly vynucené i bez šipek.",
        formula: "DAG:\nT1 → T3, T2 → T3,\nT3 → T5, T4 → T5",
        rPrime: {},
        dPrime: {},
        highlight: []
      },
      {
        title: "2. Forward: zdroje DAGu",
        text: "Úlohy bez předchůdců si zatím nechají původní release time.",
        formula: "r'1=0, r'2=1, r'4=3",
        rPrime: { T1: 0, T2: 1, T4: 3 },
        dPrime: {},
        highlight: ["T1", "T2", "T4"]
      },
      {
        title: "3. Forward: spočítáme T3",
        text: "T3 může začít až po dokončení T1 i T2.",
        formula: "r'3 = max(r3, r'1+p1, r'2+p2)\n    = max(0, 0+2, 1+1)\n    = 2",
        rPrime: { T1: 0, T2: 1, T3: 2, T4: 3 },
        dPrime: {},
        highlight: ["T1", "T2", "T3"]
      },
      {
        title: "4. Forward: spočítáme T5",
        text: "T5 čeká na T3 i T4, proto vezmeme pozdější z jejich nejdřívějších dokončení.",
        formula: "r'5 = max(r5, r'3+p3, r'4+p4)\n    = max(0, 2+2, 3+2)\n    = 5",
        rPrime: { T1: 0, T2: 1, T3: 2, T4: 3, T5: 5 },
        dPrime: {},
        highlight: ["T3", "T4", "T5"]
      },
      {
        title: "5. Backward: sink DAGu",
        text: "T5 nemá následníky, proto si nechá původní deadline.",
        formula: "d'5 = d5 = 8",
        rPrime: finalR,
        dPrime: { T5: 8 },
        highlight: ["T5"]
      },
      {
        title: "6. Backward: T3 a T4",
        text: "Aby T5 stihla deadline 8 a trvá 1, její předchůdci musí skončit nejpozději v 7.",
        formula: "d'3 = min(10, d'5-p5) = min(10, 8-1) = 7\nd'4 = min(12, d'5-p5) = min(12, 8-1) = 7",
        rPrime: finalR,
        dPrime: { T3: 7, T4: 7, T5: 8 },
        highlight: ["T3", "T4", "T5"]
      },
      {
        title: "7. Backward: T1 a T2",
        text: "T1 a T2 musí skončit dost brzy, aby se ještě vešla T3 délky 2.",
        formula: "d'1 = min(12, d'3-p3) = min(12, 7-2) = 5\nd'2 = min(11, d'3-p3) = min(11, 7-2) = 5",
        rPrime: finalR,
        dPrime: finalD,
        highlight: ["T1", "T2", "T3"]
      },
      {
        title: "8. Spustíme Hornův EDF",
        text: "Teď už můžeme šipky odstranit. Zpřísněné časy samy vynutí pořadí kompatibilní s původním DAGem.",
        formula: "nezávislé úlohy:\n(r',d') =\nT1(0,5), T2(1,5), T3(2,7),\nT4(3,7), T5(5,8)",
        rPrime: finalR,
        dPrime: finalD,
        highlight: [],
        independent: true
      },
      {
        title: "9. Výsledek",
        text: "EDF na transformované instanci dá přípustný rozvrh. Původní precedence jsou dodržené: T1,T2 před T3 a T3,T4 před T5.",
        formula: "rozvrh:\nT1[0,2], T2[2,3], T3[3,5], T4[5,7], T5[7,8]\n\nvšechny d' jsou splněné",
        rPrime: finalR,
        dPrime: finalD,
        highlight: [],
        independent: true,
        schedule: true
      }
    ];

    let index = 0;
    let timer = null;

    const svg = document.getElementById("viz");

    function job(id) { return jobs.find(j => j.id === id); }

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }

    function addText(parent, text, x, y, opts = {}) {
      const el = svgEl("text", {
        x, y,
        "font-size": opts.size || 13,
        "font-weight": opts.weight || 600,
        fill: opts.fill || "#111827",
        "text-anchor": opts.anchor || "start"
      });
      el.textContent = text;
      parent.appendChild(el);
      return el;
    }

    function drawArrow(from, to, active, independent) {
      const a = job(from);
      const b = job(to);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      const ux = dx / len;
      const uy = dy / len;
      const x1 = a.x + ux * 46;
      const y1 = a.y + uy * 36;
      const x2 = b.x - ux * 50;
      const y2 = b.y - uy * 39;
      const line = svgEl("line", {
        x1, y1, x2, y2,
        stroke: independent ? "#cbd5e1" : active ? "#f97316" : "#334155",
        "stroke-width": active ? 4 : 2.2,
        "stroke-dasharray": independent ? "6 6" : "0",
        "marker-end": independent ? "url(#arrowMuted)" : "url(#arrow)"
      });
      svg.appendChild(line);
    }

    function drawNode(j, step) {
      const active = step.highlight.includes(j.id);
      const rp = step.rPrime[j.id];
      const dp = step.dPrime[j.id];
      svg.appendChild(svgEl("circle", {
        cx: j.x,
        cy: j.y,
        r: active ? 44 : 40,
        fill: "#fff",
        stroke: active ? "#f97316" : j.color,
        "stroke-width": active ? 5 : 3
      }));
      addText(svg, j.id, j.x, j.y - 9, { anchor: "middle", size: 17, weight: 800 });
      addText(svg, `p=${j.p}`, j.x, j.y + 13, { anchor: "middle", size: 12, fill: "#475569" });
      addText(svg, `r=${j.r}, d=${j.d}`, j.x, j.y + 31, { anchor: "middle", size: 11, fill: "#64748b" });

      const top = `r'=${rp === undefined ? "?" : rp}`;
      const bottom = `d'=${dp === undefined ? "?" : dp}`;
      addText(svg, top, j.x, j.y + 62, { anchor: "middle", size: 12, fill: "#16a34a", weight: 800 });
      addText(svg, bottom, j.x, j.y + 78, { anchor: "middle", size: 12, fill: "#dc2626", weight: 800 });
    }

    function drawSchedule() {
      const x0 = 92;
      const y = 470;
      const scale = 72;
      addText(svg, "Horn/EDF na T':", 26, y - 18, { size: 14, weight: 800 });
      svg.appendChild(svgEl("line", { x1: x0, x2: x0 + 8 * scale, y1: y + 34, y2: y + 34, stroke: "#111827", "stroke-width": 3 }));
      for (let t = 0; t <= 8; t++) {
        const xx = x0 + t * scale;
        svg.appendChild(svgEl("line", { x1: xx, x2: xx, y1: y + 20, y2: y + 48, stroke: "#cbd5e1", "stroke-width": 1 }));
        addText(svg, String(t), xx, y + 66, { anchor: "middle", size: 11, fill: "#64748b" });
      }
      schedule.forEach(seg => {
        const j = job(seg.job);
        const rect = svgEl("rect", {
          x: x0 + seg.start * scale,
          y,
          width: (seg.end - seg.start) * scale,
          height: 34,
          rx: 5,
          fill: j.color,
          opacity: 0.88
        });
        svg.appendChild(rect);
        addText(svg, seg.job, x0 + (seg.start + seg.end) * scale / 2, y + 23, { anchor: "middle", size: 12, fill: "#fff", weight: 800 });
      });
    }

    function draw() {
      const step = steps[index];
      svg.innerHTML = `
        <defs>
          <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2,2 L10,6 L2,10 Z" fill="#334155"></path>
          </marker>
          <marker id="arrowMuted" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
            <path d="M2,2 L10,6 L2,10 Z" fill="#cbd5e1"></path>
          </marker>
        </defs>
      `;
      addText(svg, step.independent ? "Šipky už nejsou potřeba: běží EDF na T'" : "Původní DAG závislostí", 24, 28, { size: 16, weight: 800 });
      addText(svg, "zeleně r' = nejdřívější možný start, červeně d' = nejpozdější bezpečné dokončení", 24, 50, { size: 12, fill: "#64748b" });

      edges.forEach(([a, b]) => {
        const active = step.highlight.includes(a) && step.highlight.includes(b);
        drawArrow(a, b, active, step.independent);
      });
      jobs.forEach(j => drawNode(j, step));
      if (step.schedule) drawSchedule();
    }

    function renderTable(step) {
      document.getElementById("rows").innerHTML = jobs.map(j => `
        <tr>
          <td style="font-weight:800;color:${j.color}">${j.id}</td>
          <td>${j.p}</td>
          <td>${j.r}</td>
          <td>${j.d}</td>
          <td style="color:#16a34a;font-weight:800">${step.rPrime[j.id] === undefined ? "—" : step.rPrime[j.id]}</td>
          <td style="color:#dc2626;font-weight:800">${step.dPrime[j.id] === undefined ? "—" : step.dPrime[j.id]}</td>
        </tr>
      `).join("");
    }

    function render() {
      const step = steps[index];
      draw();
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepText").textContent = step.text;
      document.getElementById("formula").textContent = step.formula;
      document.getElementById("counter").textContent = `${index + 1} / ${steps.length}`;
      renderTable(step);
    }

    function go(delta) {
      index = Math.max(0, Math.min(steps.length - 1, index + delta));
      render();
    }

    document.getElementById("prev").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    document.getElementById("play").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play").textContent = "Play";
        return;
      }
      document.getElementById("play").textContent = "Pause";
      timer = setInterval(() => {
        if (index === steps.length - 1) {
          clearInterval(timer);
          timer = null;
          document.getElementById("play").textContent = "Play";
          return;
        }
        go(1);
      }, 1400);
    });

    render();
  </script>
</body>
</html>
