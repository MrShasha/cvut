<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Min-cost flow</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #172033;
      --ink: #e5e7eb;
      --muted: #9ca3af;
      --line: #334155;
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
      --blue: #38bdf8;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 Inter, "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 365px;
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
      letter-spacing: 0;
    }

    .muted {
      margin: 0 0 12px;
      color: var(--muted);
    }

    svg {
      width: 100%;
      height: 430px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(rgba(148, 163, 184, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .06) 1px, transparent 1px),
        #0b1220;
      background-size: 32px 32px;
    }

    .edge {
      fill: none;
      stroke: #64748b;
      stroke-width: 3;
    }

    .edge.flow {
      stroke: var(--green);
      stroke-width: 5;
    }

    .edge.cheap {
      stroke: var(--blue);
      stroke-width: 4;
    }

    .edge.reverse {
      stroke: var(--red);
      stroke-width: 4;
      stroke-dasharray: 8 6;
    }

    .edge.cycle {
      stroke: var(--amber);
      stroke-width: 6;
    }

    .edge.faded {
      opacity: .25;
    }

    .node {
      fill: #1e293b;
      stroke: #64748b;
      stroke-width: 2.3;
    }

    .node.source {
      stroke: var(--blue);
      stroke-width: 4;
    }

    .node.sink {
      stroke: var(--violet);
      stroke-width: 4;
    }

    .txt {
      fill: var(--ink);
      font-weight: 850;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .label rect,
    .note rect {
      fill: #0b1220;
      stroke: #475569;
      stroke-width: 1.2;
    }

    .label text {
      fill: #f8fafc;
      font: 800 12px Consolas, monospace;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .note text {
      fill: #e5e7eb;
      font: 750 12px Inter, "Segoe UI", Arial, sans-serif;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 9px 12px;
      color: var(--ink);
      background: #24324a;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
    }

    button.primary {
      border-color: #22d3ee;
      background: #0e7490;
    }

    .badge {
      display: inline-block;
      margin-bottom: 8px;
      border-radius: 999px;
      padding: 3px 8px;
      color: #cbd5e1;
      background: #26364f;
      font-size: 12px;
      font-weight: 800;
    }

    .formula {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: #dbeafe;
      background: #0b1220;
      font: 800 13px Consolas, monospace;
      white-space: pre-line;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 880px) {
      .wrap { grid-template-columns: 1fr; }
      svg { height: 390px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>Min-cost flow: cycle-canceling 🔁</h1>
      <p class="muted">Záporný cyklus v reziduálním grafu znamená: stejný tok jde přesměrovat levněji.</p>
      <svg id="svg" viewBox="0 0 860 430" aria-label="Cycle canceling diagram"></svg>
      <div class="controls">
        <button id="prev">← zpět</button>
        <button class="primary" id="next">další krok →</button>
        <button id="reset">reset</button>
      </div>
    </main>

    <aside class="panel">
      <span class="badge" id="badge"></span>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="formula" id="formula"></div>
      <p class="hint" id="hint"></p>
    </aside>
  </div>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const nodes = {
      s: [95, 215],
      a: [340, 105],
      b: [340, 325],
      t: [625, 215]
    };

    const originalEdges = [
      { id: "s-a", from: "s", to: "a", cost: 0, cap: 1, before: 1, after: 0, label: [198, 132], curve: [175, 105, 250, 92] },
      { id: "a-t", from: "a", to: "t", cost: 5, cap: 1, before: 1, after: 0, label: [492, 132], curve: [452, 92, 545, 108] },
      { id: "s-b", from: "s", to: "b", cost: 0, cap: 1, before: 0, after: 1, label: [198, 300], curve: [175, 330, 250, 342] },
      { id: "b-t", from: "b", to: "t", cost: 1, cap: 1, before: 0, after: 1, label: [492, 300], curve: [452, 342, 545, 322] }
    ];

    const residualEdges = [
      { id: "a-s", from: "a", to: "s", cost: 0, cap: 1, label: [196, 76], curve: [252, 55, 160, 78], reverseOf: "s-a" },
      { id: "s-b", from: "s", to: "b", cost: 0, cap: 1, label: [198, 300], curve: [175, 330, 250, 342] },
      { id: "b-t", from: "b", to: "t", cost: 1, cap: 1, label: [492, 300], curve: [452, 342, 545, 322] },
      { id: "t-a", from: "t", to: "a", cost: -5, cap: 1, label: [548, 76], curve: [555, 60, 455, 58], reverseOf: "a-t" }
    ];

    const steps = [
      {
        title: "1. Máme přípustný, ale drahý tok",
        text: "Potřebujeme poslat jednu jednotku ze s do t. Aktuálně jde přes horní cestu s→a→t, která stojí 5.",
        formula: "tok: s→a→t\ncena = 0 + 5 = 5\n\nspodní cesta s→b→t je zatím prázdná",
        stage: "before"
      },
      {
        title: "2. Reziduální graf ukáže, co lze změnit",
        text: "Nepoužité hrany můžeme použít dopředu. Hrany, po kterých už teče tok, můžeme použít zpět a tím tok na nich zrušit.",
        formula: "dopředu:\ns→b  cena 0\nb→t  cena 1\n\nzpět:\na→s  cena 0\nt→a  cena -5",
        stage: "residual"
      },
      {
        title: "3. Najdeme záporný cyklus",
        text: "Cyklus a→s→b→t→a má zápornou cenu. To znamená, že když po něm pošleme tok, celková cena klesne a bilance se nezmění.",
        formula: "a→s:  0\ns→b:  0\nb→t: +1\nt→a: -5\n\nsoučet = -4",
        stage: "cycle"
      },
      {
        title: "4. Augmentujeme po cyklu",
        text: "Bottleneck je 1, takže po cyklu pošleme jednu jednotku. Zpětné hrany zruší drahou horní cestu, dopředné hrany zapnou levnou spodní cestu.",
        formula: "γ = min(1,1,1,1) = 1\n\ns→a: 1 → 0\na→t: 1 → 0\ns→b: 0 → 1\nb→t: 0 → 1",
        stage: "augment"
      },
      {
        title: "5. Výsledek je levnější tok",
        text: "Po změně teče stejná jedna jednotka ze s do t, ale jde spodní cestou s→b→t. Hodnota toku se nezměnila, cena klesla.",
        formula: "tok: s→b→t\ncena = 0 + 1 = 1\n\npokles ceny: 5 → 1",
        stage: "after"
      },
      {
        title: "6. Kdy algoritmus skončí",
        text: "Cycle-canceling opakuje stejný krok, dokud v reziduálním grafu existuje záporný cyklus. Jakmile žádný není, tok už nejde zlevnit tímto přesměrováním.",
        formula: "žádný záporný cyklus v G_f\n⇔ aktuální tok je min-cost flow",
        stage: "done"
      }
    ];

    let step = 0;
    const svg = document.getElementById("svg");

    function el(name, attrs = {}) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function defs() {
      const d = el("defs");
      d.innerHTML = `
        <marker id="arrowGray" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#94a3b8"></path>
        </marker>
        <marker id="arrowGreen" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#34d399"></path>
        </marker>
        <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#38bdf8"></path>
        </marker>
        <marker id="arrowRed" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#fb7185"></path>
        </marker>
        <marker id="arrowAmber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="12" markerHeight="12" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#fbbf24"></path>
        </marker>`;
      svg.append(d);
    }

    function markerFor(className) {
      if (className.includes("cycle")) return "url(#arrowAmber)";
      if (className.includes("reverse")) return "url(#arrowRed)";
      if (className.includes("flow")) return "url(#arrowGreen)";
      if (className.includes("cheap")) return "url(#arrowBlue)";
      return "url(#arrowGray)";
    }

    function shortenPoint(point, toward, amount = 34) {
      const dx = toward[0] - point[0];
      const dy = toward[1] - point[1];
      const len = Math.hypot(dx, dy) || 1;
      return [point[0] + dx / len * amount, point[1] + dy / len * amount];
    }

    function pathData(edge) {
      const from = nodes[edge.from];
      const to = nodes[edge.to];
      if (edge.curve) {
        const c1 = [edge.curve[0], edge.curve[1]];
        const c2 = [edge.curve[2], edge.curve[3]];
        const start = shortenPoint(from, c1);
        const end = shortenPoint(to, c2);
        return `M ${start[0]} ${start[1]} C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${end[0]} ${end[1]}`;
      }
      const start = shortenPoint(from, to);
      const end = shortenPoint(to, from);
      return `M ${start[0]} ${start[1]} L ${end[0]} ${end[1]}`;
    }

    function drawEdge(edge, className, label) {
      svg.append(el("path", {
        d: pathData(edge),
        class: className,
        "marker-end": markerFor(className)
      }));
      drawLabel(edge.label[0], edge.label[1], label, label.length > 12 ? 116 : 96);
    }

    function drawLabel(x, y, value, width = 96) {
      const g = el("g", { class: "label" });
      g.append(el("rect", { x: x - width / 2, y: y - 14, width, height: 28, rx: 6 }));
      const t = el("text", { x, y: y + 1 });
      t.textContent = value;
      g.append(t);
      svg.append(g);
    }

    function drawNote(x, y, value, width = 245) {
      const g = el("g", { class: "note" });
      g.append(el("rect", { x: x - width / 2, y: y - 16, width, height: 32, rx: 7 }));
      const t = el("text", { x, y: y + 1 });
      t.textContent = value;
      g.append(t);
      svg.append(g);
    }

    function drawNode(id, cls = "") {
      const [x, y] = nodes[id];
      svg.append(el("circle", { cx: x, cy: y, r: 30, class: `node ${cls}` }));
      const t = el("text", { x, y: y + 1, class: "txt" });
      t.textContent = id;
      svg.append(t);
    }

    function drawOriginal(stage) {
      originalEdges.forEach(edge => {
        const flow = stage === "after" || stage === "done" ? edge.after : edge.before;
        let cls = flow > 0 ? "edge flow" : "edge";
        if (stage === "before" && edge.id === "a-t") cls = "edge flow";
        if ((stage === "after" || stage === "done") && (edge.id === "s-b" || edge.id === "b-t")) cls = "edge flow";
        drawEdge(edge, cls, `${flow}/${edge.cap}, c=${edge.cost}`);
      });

      if (stage === "before") {
        drawNote(705, 94, "aktuálně platíme drahou hranu c=5", 270);
      }

      if (stage === "after" || stage === "done") {
        drawNote(705, 94, "stejná hodnota toku, nižší cena", 250);
      }
    }

    function drawResidual(stage) {
      residualEdges.forEach(edge => {
        let cls = edge.reverseOf ? "edge reverse" : "edge cheap";
        if (stage === "cycle" || stage === "augment") cls = "edge cycle";
        drawEdge(edge, cls, `cap ${edge.cap}, c=${edge.cost}`);
      });

      if (stage === "residual") {
        drawNote(705, 94, "zpětná hrana = možnost zrušit tok", 260);
        drawNote(705, 326, "dopředná hrana = možnost přidat tok", 260);
      }

      if (stage === "cycle") {
        drawNote(705, 94, "součet cen na cyklu je záporný", 270);
      }

      if (stage === "augment") {
        drawNote(705, 94, "pošleme γ=1 po celém cyklu", 245);
        drawNote(705, 326, "reverse části ruší starý tok", 245);
      }
    }

    function render() {
      const active = steps[step];
      svg.innerHTML = "";
      defs();

      if (active.stage === "residual" || active.stage === "cycle" || active.stage === "augment") {
        drawResidual(active.stage);
      } else {
        drawOriginal(active.stage);
      }

      drawNode("s", "source");
      drawNode("a");
      drawNode("b");
      drawNode("t", "sink");

      document.getElementById("badge").textContent = `${step + 1} / ${steps.length}`;
      document.getElementById("title").textContent = active.title;
      document.getElementById("text").textContent = active.text;
      document.getElementById("formula").textContent = active.formula;
      document.getElementById("hint").textContent = "Cycle neporuší bilance: do každého vrcholu na cyklu jedna změna přijde a jedna odejde.";
    }

    document.getElementById("next").onclick = () => {
      step = Math.min(steps.length - 1, step + 1);
      render();
    };
    document.getElementById("prev").onclick = () => {
      step = Math.max(0, step - 1);
      render();
    };
    document.getElementById("reset").onclick = () => {
      step = 0;
      render();
    };

    render();
  </script>
</body>
</html>
