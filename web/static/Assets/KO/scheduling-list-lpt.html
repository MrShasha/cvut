<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>List scheduling and LPT</title>
  <style>
    :root { --bg:#111827; --panel:#172033; --ink:#e5e7eb; --muted:#9ca3af; --line:#334155; --blue:#38bdf8; --green:#34d399; --amber:#fbbf24; --violet:#a78bfa; --red:#fb7185; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .muted, .note { color: var(--muted); }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
    button { border: 1px solid #475569; border-radius: 7px; padding: 9px 12px; color: var(--ink); background: #24324a; cursor: pointer; font: inherit; font-weight: 750; }
    button.active { background: #0e7490; border-color: #22d3ee; }
    .gantt { display: grid; gap: 12px; margin-top: 12px; }
    .row { display: grid; grid-template-columns: 42px 1fr; align-items: center; gap: 10px; }
    .machine { color: #cbd5e1; font: 900 13px Consolas, monospace; }
    .track { position: relative; height: 42px; border: 1px solid #475569; border-radius: 8px; background: #0b1220; overflow: hidden; }
    .bar { position: absolute; top: 5px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: #0f172a; font: 900 12px Consolas, monospace; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
    .metric { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #0b1220; padding: 10px; font: 800 13px Consolas, monospace; }
    .metric span:nth-child(2n) { color: #dbeafe; }
    .queue { color: #dbeafe; font: 800 13px Consolas, monospace; background: #0b1220; border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-top: 10px; }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>List scheduling vs. LPT</h1>
      <p class="muted">Greedy pravidlo: další úlohu dej na procesor, který se uvolní nejdřív.</p>
      <div class="controls">
        <button data-mode="list" class="active">původní seznam</button>
        <button data-mode="lpt">LPT</button>
      </div>
      <div class="gantt" id="gantt"></div>
    </main>
    <aside class="panel">
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="metric" id="metrics"></div>
      <div class="queue" id="queue"></div>
      <p class="note">LPT je stále List Scheduling, jen se seznam předem seřadí od nejdelších úloh. Velké bloky tak nezůstanou na konec.</p>
    </aside>
  </div>
  <script>
    const tasks = [
      { id: "A", p: 7, color: "#38bdf8" },
      { id: "B", p: 6, color: "#34d399" },
      { id: "C", p: 5, color: "#fbbf24" },
      { id: "D", p: 4, color: "#a78bfa" },
      { id: "E", p: 3, color: "#fb7185" },
      { id: "F", p: 2, color: "#60a5fa" },
      { id: "G", p: 2, color: "#f472b6" }
    ];
    const R = 3;
    let mode = "list";
    const modes = {
      list: {
        title: "Původní seznam: malé úlohy první",
        text: "Greedy přiřazuje správně na nejdříve volný procesor, ale dlouhá úloha A zůstane až na konec.",
        order: ["E", "F", "G", "D", "C", "B", "A"]
      },
      lpt: {
        title: "LPT: nejdelší úlohy první",
        text: "Seznam seřadíme podle p_j sestupně. Dlouhé úlohy se rozmístí, dokud jsou procesory prázdné.",
        order: ["A", "B", "C", "D", "E", "F", "G"]
      }
    };
    const byId = Object.fromEntries(tasks.map(t => [t.id, t]));
    function schedule(orderIds) {
      const machines = Array.from({ length: R }, () => ({ t: 0, jobs: [] }));
      orderIds.map(id => byId[id]).forEach(task => {
        machines.sort((a, b) => a.t - b.t);
        const m = machines[0];
        m.jobs.push({ ...task, start: m.t, end: m.t + task.p });
        m.t += task.p;
      });
      return machines;
    }
    function render() {
      const cfg = modes[mode];
      const machines = schedule(cfg.order);
      const cmax = Math.max(...machines.map(m => m.t));
      const lower = Math.max(Math.max(...tasks.map(t => t.p)), tasks.reduce((s, t) => s + t.p, 0) / R);
      document.getElementById("title").textContent = cfg.title;
      document.getElementById("text").textContent = cfg.text;
      document.getElementById("metrics").innerHTML = `
        <span>R</span><span>${R}</span>
        <span>dolní mez</span><span>${lower.toFixed(2)}</span>
        <span>Cmax</span><span>${cmax}</span>
        <span>poměr k LB</span><span>${(cmax / lower).toFixed(2)}</span>`;
      document.getElementById("queue").textContent = `seznam: ${cfg.order.map(id => "T" + id).join(" → ")}`;
      document.getElementById("gantt").innerHTML = machines.map((machine, index) => `
        <div class="row">
          <div class="machine">P${index + 1}</div>
          <div class="track">
            ${machine.jobs.map(job => `
              <div class="bar" style="left:${job.start / cmax * 100}%;width:${job.p / cmax * 100}%;background:${job.color}">
                T${job.id}
              </div>`).join("")}
          </div>
        </div>`).join("");
      document.querySelectorAll("button").forEach(btn => btn.classList.toggle("active", btn.dataset.mode === mode));
    }
    document.querySelector(".controls").onclick = event => {
      if (!event.target.dataset.mode) return;
      mode = event.target.dataset.mode;
      render();
    };
    render();
    addEventListener("resize", render);
  </script>
</body>
</html>
