<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>McNaughtonuv algoritmus</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --panel: #f8fafc;
      --line: #cbd5e1;
      --text: #111827;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .wrap {
      height: 720px;
      padding: 18px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
    }
    h1 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { border-color: #94a3b8; background: #f8fafc; }
    .counter { min-width: 86px; text-align: center; color: var(--muted); font-size: 13px; }
    .main { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 16px; min-height: 0; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; min-height: 0; }
    .chart { background: #fff; padding: 12px; }
    svg { width: 100%; height: 100%; display: block; }
    .side { display: grid; grid-template-rows: auto auto 1fr; gap: 12px; padding: 14px; }
    .step-title { margin: 0; font-size: 18px; line-height: 1.25; }
    .step-text { margin: 6px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .formula {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      font: 700 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-line;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    th, td { padding: 7px 8px; border-bottom: 1px solid #e5e7eb; text-align: center; }
    th { color: var(--muted); font-size: 12px; background: #f8fafc; }
    tr:last-child td { border-bottom: 0; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 13px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>McNaughtonův algoritmus pro P|pmtn|Cmax</h1>
        <p class="subtitle">Preempce je povolena. Úlohy lijeme po řádcích délky C*; přetečení pokračuje na dalším procesoru.</p>
      </div>
      <div class="controls">
        <button id="prev" type="button">←</button>
        <button id="play" type="button">Play</button>
        <button id="next" type="button">→</button>
        <span id="counter" class="counter"></span>
      </div>
    </header>

    <main class="main">
      <section class="panel chart">
        <svg id="viz" viewBox="0 0 760 520" aria-label="McNaughton schedule"></svg>
      </section>
      <aside class="panel side">
        <div>
          <h2 class="step-title" id="stepTitle"></h2>
          <p class="step-text" id="stepText"></p>
        </div>
        <div class="formula" id="formula"></div>
        <table>
          <thead><tr><th>úloha</th><th>p</th><th>části</th><th>stav</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </aside>
    </main>

    <div class="legend" id="legend"></div>
  </div>

  <script>
    const R = 3;
    const C = 4;
    const jobs = [
      { id: "T1", p: 2, color: "#2563eb" },
      { id: "T2", p: 3, color: "#0891b2" },
      { id: "T3", p: 2, color: "#ca8a04" },
      { id: "T4", p: 3, color: "#7c3aed" },
      { id: "T5", p: 2, color: "#dc2626" }
    ];

    const pieces = [
      { job: "T1", p: 1, start: 0, end: 2, label: "T1" },
      { job: "T2", p: 1, start: 2, end: 4, label: "T2'" },
      { job: "T2", p: 2, start: 0, end: 1, label: "T2''" },
      { job: "T3", p: 2, start: 1, end: 3, label: "T3" },
      { job: "T4", p: 2, start: 3, end: 4, label: "T4'" },
      { job: "T4", p: 3, start: 0, end: 2, label: "T4''" },
      { job: "T5", p: 3, start: 2, end: 4, label: "T5" }
    ];

    const steps = [
      {
        title: "1. Spočítáme optimální mez C*",
        text: "Ani preempce neumí porušit dvě dolní meze: nejdelší úloha a průměrná práce na procesor.",
        formula: "p = (2,3,2,3,2), R = 3\nΣp = 12, max p_j = 3\nC* = max(3, 12/3) = 4",
        visible: 0,
        active: -1
      },
      {
        title: "2. T1 se vejde na P1",
        text: "Začínáme na prvním procesoru od času 0.",
        formula: "P1: T1[0,2]\nt = 2 ≤ C*",
        visible: 1,
        active: 0
      },
      {
        title: "3. T2 přeteče konec P1",
        text: "T2 má délku 3. Na P1 zbývají jen 2 jednotky, proto ji rozdělíme.",
        formula: "T2 první část: P1[2,4]\nzbytek T2: délka 1",
        visible: 2,
        active: 1
      },
      {
        title: "4. Zbytek T2 jde na P2",
        text: "Druhá část stejné úlohy pokračuje na dalším procesoru od času 0.",
        formula: "T2 druhá část: P2[0,1]\nkaždá úloha je nejvýše ve 2 částech",
        visible: 3,
        active: 2
      },
      {
        title: "5. T3 se vejde za T2 na P2",
        text: "Pokračujeme v nalévání úloh na stejný řádek.",
        formula: "P2: T3[1,3]\nt = 3",
        visible: 4,
        active: 3
      },
      {
        title: "6. T4 opět přeteče",
        text: "Na P2 zbývá 1 jednotka, T4 má délku 3. Rozdělíme ji.",
        formula: "T4 první část: P2[3,4]\nzbytek T4: délka 2",
        visible: 5,
        active: 4
      },
      {
        title: "7. Zbytek T4 a T5 dokončí P3",
        text: "T4 pokračuje na P3 a T5 vyplní zbytek do C*=4.",
        formula: "P3: T4[0,2], T5[2,4]\nCmax = 4",
        visible: 7,
        active: 6
      },
      {
        title: "Výsledek",
        text: "Rozvrh dosahuje obou dolních mezí, proto je optimální.",
        formula: "Cmax = C* = 4\npreemptované úlohy: T2, T4\nkaždá max. 2 části",
        visible: 7,
        active: -1
      }
    ];

    let index = 0;
    let timer = null;
    const svg = document.getElementById("viz");

    function job(id) { return jobs.find(j => j.id === id); }
    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    }
    function text(parent, value, x, y, opts = {}) {
      const el = svgEl("text", {
        x, y,
        "font-size": opts.size || 13,
        "font-weight": opts.weight || 600,
        fill: opts.fill || "#111827",
        "text-anchor": opts.anchor || "start"
      });
      el.textContent = value;
      parent.appendChild(el);
      return el;
    }

    function draw(step) {
      svg.innerHTML = "";
      const x0 = 96;
      const y0 = 96;
      const rowH = 96;
      const scale = 138;

      text(svg, "C* = 4", 28, 30, { size: 18, weight: 800 });
      text(svg, "Každý procesor má interval [0, C*]. Přetečení jde na další procesor.", 28, 54, { size: 13, fill: "#64748b" });

      for (let t = 0; t <= C; t++) {
        const x = x0 + t * scale;
        svg.appendChild(svgEl("line", { x1: x, x2: x, y1: y0 - 28, y2: y0 + rowH * R - 38, stroke: t === C ? "#111827" : "#e5e7eb", "stroke-width": t === C ? 3 : 1 }));
        text(svg, String(t), x, y0 + rowH * R - 14, { size: 12, fill: "#64748b", anchor: "middle" });
      }

      for (let r = 0; r < R; r++) {
        const y = y0 + r * rowH;
        text(svg, "P" + (r + 1), 38, y + 34, { size: 16, weight: 800 });
        svg.appendChild(svgEl("line", { x1: x0, x2: x0 + C * scale, y1: y + 42, y2: y + 42, stroke: "#cbd5e1", "stroke-width": 2 }));
        svg.appendChild(svgEl("rect", { x: x0, y: y + 4, width: C * scale, height: 58, fill: "none", stroke: "#94a3b8", "stroke-width": 1.5 }));
      }

      pieces.slice(0, step.visible).forEach((piece, i) => {
        const j = job(piece.job);
        const y = y0 + (piece.p - 1) * rowH + 8;
        const rect = svgEl("rect", {
          x: x0 + piece.start * scale,
          y,
          width: (piece.end - piece.start) * scale,
          height: 50,
          rx: 6,
          fill: j.color,
          opacity: i === step.active ? 1 : 0.85,
          stroke: i === step.active ? "#111827" : j.color,
          "stroke-width": i === step.active ? 3 : 1
        });
        svg.appendChild(rect);
        text(svg, piece.label, x0 + ((piece.start + piece.end) / 2) * scale, y + 31, { anchor: "middle", fill: "#fff", weight: 800 });
      });
    }

    function render() {
      const step = steps[index];
      draw(step);
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepText").textContent = step.text;
      document.getElementById("formula").textContent = step.formula;
      document.getElementById("counter").textContent = `${index + 1} / ${steps.length}`;
      document.getElementById("rows").innerHTML = jobs.map(j => {
        const parts = pieces.filter(p => p.job === j.id && pieces.indexOf(p) < step.visible);
        const done = parts.reduce((s, p) => s + p.end - p.start, 0);
        return `<tr>
          <td style="font-weight:800;color:${j.color}">${j.id}</td>
          <td>${j.p}</td>
          <td>${parts.length || "—"}</td>
          <td>${done === j.p ? "hotovo" : done ? "část " + done + "/" + j.p : "čeká"}</td>
        </tr>`;
      }).join("");
    }

    function go(delta) {
      index = Math.max(0, Math.min(steps.length - 1, index + delta));
      render();
    }

    document.getElementById("legend").innerHTML = jobs.map(j => `<span><span class="dot" style="background:${j.color}"></span>${j.id}</span>`).join("") + "<span>dashed border C* = konec řádku</span>";
    document.getElementById("prev").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    document.getElementById("play").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play").textContent = "Play";
        return;
      }
      document.getElementById("play").textContent = "Pause";
      timer = setInterval(() => {
        if (index === steps.length - 1) {
          clearInterval(timer);
          timer = null;
          document.getElementById("play").textContent = "Play";
          return;
        }
        go(1);
      }, 1200);
    });
    render();
  </script>
</body>
</html>
