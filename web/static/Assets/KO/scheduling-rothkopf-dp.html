<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rothkopf DP</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --panel: #f8fafc;
      --line: #d8e0ea;
      --text: #111827;
      --muted: #64748b;
      --blue: #2563eb;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .wrap {
      height: 760px;
      padding: 16px;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 12px;
    }
    .head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .subtitle {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      min-width: 38px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font: 700 14px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    button:hover { background: #f8fafc; border-color: #94a3b8; }
    .count {
      min-width: 70px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .report {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px 12px;
      min-width: 0;
    }
    .stat span {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }
    .stat strong {
      display: block;
      color: var(--text);
      font: 800 16px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .main {
      display: grid;
      grid-template-columns: minmax(540px, 1.15fr) minmax(360px, 0.85fr);
      gap: 12px;
      min-height: 0;
    }
    .panel {
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .viz { padding: 10px; background: #fff; }
    svg { display: block; width: 100%; height: 100%; }
    .side {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      padding: 12px;
      background: var(--panel);
    }
    .step {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
    }
    .step h2 {
      margin: 0 0 6px;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .step p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .formula {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 11px;
      font: 800 14px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-line;
    }
    .states {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      overflow: auto;
    }
    .states h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 3px;
      padding: 5px 8px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font: 800 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .pill.best { background: #dcfce7; color: #15803d; }
    @media (max-width: 860px) {
      .wrap { height: 900px; overflow: hidden; }
      .report { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .main { grid-template-columns: 1fr; grid-template-rows: minmax(430px, 1fr) 360px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="head">
      <div>
        <h1>Rothkopf&#367;v DP pro P||Cmax</h1>
        <p class="subtitle">Pro mal&yacute; po&#269;et procesor&#367; lze stav kreslit jako tabulku zat&iacute;&#382;en&iacute;. Pro R=2 je to 2D grid: osa t1 je zat&iacute;&#382;en&iacute; P1, osa t2 je zat&iacute;&#382;en&iacute; P2.</p>
      </div>
      <div class="controls">
        <button id="prev" type="button" aria-label="P&#345;edchoz&iacute; krok">&#8592;</button>
        <button id="play" type="button">Play</button>
        <button id="next" type="button" aria-label="Dal&#353;&iacute; krok">&#8594;</button>
        <span id="counter" class="count"></span>
      </div>
    </header>

    <section class="report" aria-label="Report instance">
      <div class="stat"><span>instance</span><strong>n=3, R=2</strong></div>
      <div class="stat"><span>processing times</span><strong>p=(2,1,2)</strong></div>
      <div class="stat"><span>horn&iacute; mez</span><strong>UB=5</strong></div>
      <div class="stat"><span>aktu&aacute;ln&iacute; vrstva</span><strong id="layerStat">i=0</strong></div>
      <div class="stat"><span>nejlep&#353;&iacute; report</span><strong id="bestStat">Cmax=3</strong></div>
    </section>

    <main class="main">
      <section class="panel viz">
        <svg id="viz" viewBox="0 0 820 560" aria-label="Rothkopf DP grid"></svg>
      </section>
      <aside class="panel side">
        <div class="step">
          <h2 id="stepTitle"></h2>
          <p id="stepText"></p>
        </div>
        <div class="formula" id="formula"></div>
        <div class="states" id="states"></div>
      </aside>
    </main>
  </div>

  <script>
    const jobs = [
      { id: "T1", p: 2, color: "#bfdbfe", stroke: "#2563eb" },
      { id: "T2", p: 1, color: "#dcfce7", stroke: "#16a34a" },
      { id: "T3", p: 2, color: "#fde68a", stroke: "#d97706" }
    ];
    const R = 2;
    const UB = jobs.reduce((sum, job) => sum + job.p, 0);

    function key(state) { return state.join(","); }
    function parse(k) { return k.split(",").map(Number); }
    function maxLoad(k) { return Math.max(...parse(k)); }

    const layers = [new Set(["0,0"])];
    const transitions = [];
    for (const job of jobs) {
      const prev = layers[layers.length - 1];
      const next = new Set();
      const edges = [];
      for (const k of prev) {
        const state = parse(k);
        for (let r = 0; r < R; r++) {
          const ns = state.slice();
          ns[r] += job.p;
          const nk = key(ns);
          next.add(nk);
          edges.push({ from: k, to: nk, machine: r + 1, job });
        }
      }
      layers.push(next);
      transitions.push(edges);
    }

    const bestStates = [...layers[jobs.length]].filter(k => maxLoad(k) === 3);
    const steps = [
      {
        title: "0. Start DP",
        text: "Na začátku není naplánovaná žádná úloha. Jediný dosažitelný stav je (0,0).",
        formula: "x0(0,0)=1\nostatní buňky jsou 0",
        layer: 0
      },
      {
        title: "1. Přidáme T1, p1=2",
        text: "Úlohu T1 můžeme položit na P1 nebo na P2. Proto vzniknou stavy (2,0) a (0,2).",
        formula: "(0,0)+T1 na P1 -> (2,0)\n(0,0)+T1 na P2 -> (0,2)",
        layer: 1,
        transition: 0
      },
      {
        title: "2. Přidáme T2, p2=1",
        text: "Z každé staré buňky vedou dvě šipky: přidat novou úlohu na P1 nebo na P2.",
        formula: "(2,0)+1 -> (3,0), (2,1)\n(0,2)+1 -> (1,2), (0,3)",
        layer: 2,
        transition: 1
      },
      {
        title: "3. Přidáme T3, p3=2",
        text: "Po poslední úloze projdeme dosažitelné buňky a hledáme nejmenší hodnotu max(t1,t2).",
        formula: "nejlepší buňky:\n(3,2) a (2,3)\nCmax = max(3,2) = 3",
        layer: 3,
        transition: 2,
        best: true
      },
      {
        title: "4. Rekonstrukce rozvrhu",
        text: "Jedno optimální rozdělení je P1: T1,T2 a P2: T3. Makespan je 3, protože P1 má zátěž 3 a P2 zátěž 2.",
        formula: "P1 = T1 + T2 = 2 + 1 = 3\nP2 = T3 = 2\nCmax* = 3",
        layer: 3,
        best: true,
        schedule: true
      }
    ];

    let index = 0;
    let timer = null;
    const svg = document.getElementById("viz");

    function svgEl(tag, attrs = {}) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [name, value] of Object.entries(attrs)) el.setAttribute(name, value);
      return el;
    }

    function drawText(parent, value, x, y, opts = {}) {
      const el = svgEl("text", {
        x, y,
        fill: opts.fill || "#111827",
        "font-size": opts.size || 13,
        "font-weight": opts.weight || 700,
        "text-anchor": opts.anchor || "start",
        "font-family": opts.family || "Inter, Arial, sans-serif"
      });
      el.textContent = value;
      parent.appendChild(el);
      return el;
    }

    function cellPos(state) {
      const [t1, t2] = parse(state);
      const x0 = 70;
      const y0 = 70;
      const size = 54;
      return {
        x: x0 + t1 * size,
        y: y0 + (UB - t2) * size,
        cx: x0 + t1 * size + size / 2,
        cy: y0 + (UB - t2) * size + size / 2,
        size
      };
    }

    function markerDefs() {
      const defs = svgEl("defs");
      const marker = svgEl("marker", {
        id: "arrow",
        markerWidth: 10,
        markerHeight: 10,
        refX: 8,
        refY: 5,
        orient: "auto"
      });
      marker.appendChild(svgEl("path", { d: "M1,1 L9,5 L1,9 Z", fill: "#dc2626" }));
      defs.appendChild(marker);
      svg.appendChild(defs);
    }

    function drawGrid(step) {
      const x0 = 70;
      const y0 = 70;
      const size = 54;
      drawText(svg, "DP tabulka stavu x_i(t1,t2)", 26, 32, { size: 18, weight: 800 });
      drawText(svg, "buňka = dosažitelné zatížení po prvních i úlohách", 26, 54, { size: 12, weight: 600, fill: "#64748b" });

      drawText(svg, "t2", x0 - 34, y0 - 18, { size: 13, fill: "#64748b" });
      drawText(svg, "t1", x0 + (UB + 1) * size + 8, y0 + (UB + 1) * size - 10, { size: 13, fill: "#64748b" });

      for (let a = 0; a <= UB; a++) {
        drawText(svg, String(a), x0 + a * size + size / 2, y0 + (UB + 1) * size + 18, { size: 12, fill: "#64748b", anchor: "middle" });
        drawText(svg, String(a), x0 - 18, y0 + (UB - a) * size + size / 2 + 4, { size: 12, fill: "#64748b", anchor: "middle" });
      }

      for (let t1 = 0; t1 <= UB; t1++) {
        for (let t2 = 0; t2 <= UB; t2++) {
          const x = x0 + t1 * size;
          const y = y0 + (UB - t2) * size;
          svg.appendChild(svgEl("rect", {
            x, y, width: size - 2, height: size - 2,
            fill: "#f8fafc",
            stroke: "#e5e7eb",
            "stroke-width": 1
          }));
        }
      }

      if (step.transition !== undefined) {
        for (const tr of transitions[step.transition]) {
          const a = cellPos(tr.from);
          const b = cellPos(tr.to);
          const dx = b.cx - a.cx;
          const dy = b.cy - a.cy;
          const len = Math.max(1, Math.hypot(dx, dy));
          const sx = a.cx + (dx / len) * 16;
          const sy = a.cy + (dy / len) * 16;
          const ex = b.cx - (dx / len) * 18;
          const ey = b.cy - (dy / len) * 18;
          svg.appendChild(svgEl("path", {
            d: `M ${sx} ${sy} L ${ex} ${ey}`,
            fill: "none",
            stroke: "#dc2626",
            "stroke-width": 2.5,
            "marker-end": "url(#arrow)",
            opacity: 0.72
          }));
        }
      }

      const active = layers[step.layer];
      for (const k of active) {
        const [t1, t2] = parse(k);
        const pos = cellPos(k);
        const isBest = step.best && bestStates.includes(k);
        const isBalanced = t1 + t2 === jobs.slice(0, step.layer).reduce((sum, job) => sum + job.p, 0);
        svg.appendChild(svgEl("rect", {
          x: pos.x + 7,
          y: pos.y + 7,
          width: pos.size - 16,
          height: pos.size - 16,
          rx: 7,
          fill: isBest ? "#dcfce7" : "#dbeafe",
          stroke: isBest ? "#16a34a" : "#2563eb",
          "stroke-width": isBest ? 3 : 2
        }));
        drawText(svg, `(${t1},${t2})`, pos.cx, pos.cy + 5, {
          size: 12,
          weight: 800,
          anchor: "middle",
          fill: isBest ? "#15803d" : "#1d4ed8",
          family: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        });
        if (isBest) {
          drawText(svg, "min", pos.cx, pos.y + 4, { size: 11, anchor: "middle", fill: "#16a34a" });
        } else if (step.layer === jobs.length && isBalanced) {
          drawText(svg, `max=${Math.max(t1, t2)}`, pos.cx, pos.y + 4, { size: 10, anchor: "middle", fill: "#64748b" });
        }
      }
    }

    function drawSchedule() {
      const x = 520;
      const y = 100;
      const scale = 74;
      drawText(svg, "Rekonstruovaný rozvrh", x, 42, { size: 18, weight: 800 });
      drawText(svg, "vybereme buňku (3,2)", x, 64, { size: 12, weight: 600, fill: "#64748b" });

      for (let t = 0; t <= 3; t++) {
        const xx = x + 70 + t * scale;
        svg.appendChild(svgEl("line", { x1: xx, y1: y + 26, x2: xx, y2: y + 160, stroke: "#cbd5e1", "stroke-width": 1 }));
        drawText(svg, String(t), xx, y + 185, { size: 12, fill: "#64748b", anchor: "middle" });
      }
      drawText(svg, "P1", x + 14, y + 54, { size: 14, weight: 800 });
      drawText(svg, "P2", x + 14, y + 124, { size: 14, weight: 800 });
      svg.appendChild(svgEl("line", { x1: x + 70, y1: y + 64, x2: x + 70 + 3 * scale, y2: y + 64, stroke: "#111827", "stroke-width": 2 }));
      svg.appendChild(svgEl("line", { x1: x + 70, y1: y + 134, x2: x + 70 + 3 * scale, y2: y + 134, stroke: "#111827", "stroke-width": 2 }));

      const blocks = [
        { row: 0, start: 0, dur: 2, job: jobs[0] },
        { row: 0, start: 2, dur: 1, job: jobs[1] },
        { row: 1, start: 0, dur: 2, job: jobs[2] }
      ];
      for (const block of blocks) {
        const bx = x + 70 + block.start * scale;
        const by = y + (block.row === 0 ? 32 : 102);
        svg.appendChild(svgEl("rect", {
          x: bx,
          y: by,
          width: block.dur * scale,
          height: 48,
          rx: 6,
          fill: block.job.color,
          stroke: block.job.stroke,
          "stroke-width": 2
        }));
        drawText(svg, block.job.id, bx + block.dur * scale / 2, by + 30, { size: 14, weight: 800, anchor: "middle" });
      }
      svg.appendChild(svgEl("line", { x1: x + 70 + 3 * scale, y1: y + 18, x2: x + 70 + 3 * scale, y2: y + 156, stroke: "#16a34a", "stroke-width": 3 }));
      drawText(svg, "Cmax = 3", x + 70 + 3 * scale, y + 16, { size: 14, weight: 800, fill: "#16a34a", anchor: "middle" });

      const noteY = y + 235;
      svg.appendChild(svgEl("rect", { x, y: noteY, width: 270, height: 86, rx: 8, fill: "#f0fdf4", stroke: "#86efac", "stroke-width": 2 }));
      drawText(svg, "Proč optimum?", x + 16, noteY + 28, { size: 14, weight: 800, fill: "#15803d" });
      drawText(svg, "celková práce = 5, R=2", x + 16, noteY + 52, { size: 12, weight: 600, fill: "#166534" });
      drawText(svg, "dolní mez je ceil(5/2)=3", x + 16, noteY + 72, { size: 12, weight: 600, fill: "#166534" });
    }

    function drawReportBox(step) {
      const x = 520;
      const y = step.schedule ? 430 : 90;
      const layer = layers[step.layer];
      const finalBest = step.layer === jobs.length
        ? [...layer].map(k => ({ k, m: maxLoad(k) })).sort((a, b) => a.m - b.m || a.k.localeCompare(b.k))[0]
        : null;

      svg.appendChild(svgEl("rect", { x, y, width: 270, height: 148, rx: 8, fill: "#fff", stroke: "#d8e0ea", "stroke-width": 2 }));
      drawText(svg, "Report vrstvy", x + 16, y + 30, { size: 16, weight: 800 });
      drawText(svg, `i = ${step.layer}`, x + 16, y + 58, { size: 13, fill: "#64748b" });
      drawText(svg, `zpracováno: ${jobs.slice(0, step.layer).map(job => `${job.id}:${job.p}`).join(", ") || "-"}`, x + 16, y + 82, { size: 13, fill: "#64748b" });
      drawText(svg, `počet stavů: ${layer.size}`, x + 16, y + 106, { size: 13, fill: "#64748b" });
      if (finalBest) {
        drawText(svg, `min max(t1,t2): ${finalBest.k} -> ${finalBest.m}`, x + 16, y + 130, { size: 13, weight: 800, fill: "#16a34a" });
      } else {
        drawText(svg, "zatim pouze tvorime vrstvu", x + 16, y + 130, { size: 13, fill: "#64748b" });
      }
    }

    function draw() {
      const step = steps[index];
      svg.innerHTML = "";
      markerDefs();
      drawGrid(step);
      if (step.schedule) drawSchedule();
      else drawReportBox(step);
    }

    function render() {
      const step = steps[index];
      draw();
      document.getElementById("stepTitle").textContent = step.title;
      document.getElementById("stepText").textContent = step.text;
      document.getElementById("formula").textContent = step.formula;
      document.getElementById("counter").textContent = `${index + 1} / ${steps.length}`;
      document.getElementById("layerStat").textContent = `i=${step.layer}`;
      document.getElementById("bestStat").textContent = step.layer === jobs.length ? "Cmax=3" : "čekáme";

      const values = [...layers[step.layer]].sort((a, b) => maxLoad(a) - maxLoad(b) || a.localeCompare(b));
      document.getElementById("states").innerHTML = [
        "<h3>Dosažitelné buňky v aktuální vrstvě</h3>",
        ...values.map(k => `<span class="pill ${bestStates.includes(k) && step.best ? "best" : ""}">${k}</span>`)
      ].join("");
    }

    function go(delta) {
      index = Math.max(0, Math.min(steps.length - 1, index + delta));
      render();
    }

    document.getElementById("prev").addEventListener("click", () => go(-1));
    document.getElementById("next").addEventListener("click", () => go(1));
    document.getElementById("play").addEventListener("click", () => {
      if (timer) {
        clearInterval(timer);
        timer = null;
        document.getElementById("play").textContent = "Play";
        return;
      }
      document.getElementById("play").textContent = "Pause";
      timer = setInterval(() => {
        if (index === steps.length - 1) {
          clearInterval(timer);
          timer = null;
          document.getElementById("play").textContent = "Play";
          return;
        }
        go(1);
      }, 1200);
    });

    render();
  </script>
</body>
</html>
