<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feasible flow and lower bounds</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #172033;
      --ink: #e5e7eb;
      --muted: #9ca3af;
      --line: #334155;
      --blue: #38bdf8;
      --green: #34d399;
      --red: #fb7185;
      --amber: #fbbf24;
      --violet: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.45 Inter, "Segoe UI", Arial, sans-serif;
    }

    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 365px;
      gap: 16px;
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
      letter-spacing: 0;
    }

    .muted {
      margin: 0 0 12px;
      color: var(--muted);
    }

    svg {
      width: 100%;
      height: 430px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(rgba(148, 163, 184, .06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, .06) 1px, transparent 1px),
        #0b1220;
      background-size: 32px 32px;
    }

    .edge {
      fill: none;
      stroke: #64748b;
      stroke-width: 3;
    }

    .edge.hot {
      stroke: var(--amber);
      stroke-width: 5;
    }

    .edge.used {
      stroke: var(--green);
      stroke-width: 5;
    }

    .edge.super {
      stroke: var(--blue);
      stroke-width: 4;
      stroke-dasharray: 9 7;
    }

    .edge.ghost {
      opacity: .34;
    }

    .node {
      fill: #1e293b;
      stroke: #64748b;
      stroke-width: 2.2;
    }

    .node.pos {
      stroke: var(--green);
      stroke-width: 4;
    }

    .node.neg {
      stroke: var(--red);
      stroke-width: 4;
    }

    .node.zero {
      stroke: var(--violet);
      stroke-width: 3;
    }

    .node.super {
      stroke: var(--blue);
      stroke-width: 4;
    }

    .txt {
      fill: var(--ink);
      font-weight: 850;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .subtxt {
      fill: #cbd5e1;
      font: 800 12px Consolas, monospace;
      text-anchor: middle;
    }

    .label rect,
    .note rect {
      fill: #0b1220;
      stroke: #475569;
      stroke-width: 1.2;
    }

    .label text,
    .note text {
      fill: #f8fafc;
      font: 800 12px Consolas, monospace;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .note text {
      font: 700 12px Inter, "Segoe UI", Arial, sans-serif;
    }

    .balance {
      fill: #dbeafe;
      font: 850 13px Consolas, monospace;
      text-anchor: middle;
    }

    .balance.pos { fill: var(--green); }
    .balance.neg { fill: var(--red); }
    .balance.zero { fill: var(--violet); }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 1px solid #475569;
      border-radius: 7px;
      padding: 9px 12px;
      color: var(--ink);
      background: #24324a;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
    }

    button.primary {
      border-color: #22d3ee;
      background: #0e7490;
    }

    .badge {
      display: inline-block;
      margin-bottom: 8px;
      border-radius: 999px;
      padding: 3px 8px;
      color: #cbd5e1;
      background: #26364f;
      font-size: 12px;
      font-weight: 800;
    }

    .formula {
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: #dbeafe;
      background: #0b1220;
      font: 800 13px Consolas, monospace;
      white-space: pre-line;
    }

    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 880px) {
      .wrap { grid-template-columns: 1fr; }
      svg { height: 390px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1 id="mainTitle"></h1>
      <p class="muted" id="mainSubtitle"></p>
      <svg id="svg" viewBox="0 0 860 430" aria-label="Flow reduction diagram"></svg>
      <div class="controls">
        <button id="prev">← zpět</button>
        <button class="primary" id="next">další krok →</button>
        <button id="reset">reset</button>
      </div>
    </main>

    <aside class="panel">
      <span class="badge" id="badge"></span>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="formula" id="formula"></div>
      <p class="hint" id="hint"></p>
    </aside>
  </div>

  <script>
    const NS = "http://www.w3.org/2000/svg";
    const mode = location.hash === "#balances" ? "balances" : "lower";

    const configs = {
      lower: {
        title: "Dolní meze: odstranění povinného toku",
        subtitle: "Dolní mez je povinné minimum na hraně. Trik je minimum odečíst a vyřešit jen zbývající tok.",
        nodes: {
          A: [190, 220],
          B: [430, 105],
          C: [430, 335]
        },
        edges: [
          { from: "A", to: "B", l: 2, u: 5, label: [305, 130], curve: [280, 145, 345, 112] },
          { from: "B", to: "C", l: 1, u: 4, label: [485, 220] },
          { from: "C", to: "A", l: 1, u: 4, label: [305, 310], curve: [345, 328, 280, 295] }
        ],
        balances: { A: -1, B: 1, C: 0 },
        steps: [
          {
            title: "1. Zadání: každá hrana má interval [l,u]",
            text: "Hrana nemůže nést libovolně málo toku. Například A→B musí mít aspoň 2 a nejvýš 5 jednotek.",
            formula: "A→B [2,5]\nB→C [1,4]\nC→A [1,4]\n\nl = povinné minimum\nu = maximální kapacita",
            stage: "original"
          },
          {
            title: "2. Nejdřív vložíme povinné minimum l(e)",
            text: "Představ si, že každou hranu hned naplníme jejím minimem. To ještě nemusí být korektní tok v uzlech.",
            formula: "A→B: vložíme 2\nB→C: vložíme 1\nC→A: vložíme 1\n\nToto je jen povinná část toku.",
            stage: "mandatory"
          },
          {
            title: "3. Zbytek hrany má kapacitu u(e)-l(e)",
            text: "Po odečtení minima řešíme novou proměnnou f'(e). Ta už začíná od nuly a může využít jen zbylou kapacitu.",
            formula: "A→B: 5-2=3\nB→C: 4-1=3\nC→A: 4-1=3\n\n0 ≤ f'(e) ≤ u(e)-l(e)",
            stage: "shift"
          },
          {
            title: "4. Povinné minimum rozhodí uzly",
            text: "V každém uzlu porovnáme povinný přítok a povinný odtok. Rozdíl se zapíše jako bilance.",
            formula: "b(v)=Σ l_in - Σ l_out\n\nA: 1-2 = -1\nB: 2-1 = +1\nC: 1-1 = 0",
            stage: "balances"
          },
          {
            title: "5. Bilance převedeme na max-flow",
            text: "Kladné bilance napojíme ze super-zdroje S. Záporné bilance napojíme do super-odpadu T. Pak hledáme tok, který tyto super-hrany nasytí.",
            formula: "B má b=+1  ⇒  S→B cap 1\nA má b=-1  ⇒  A→T cap 1\nC má b=0   ⇒  nic nepřidáme",
            stage: "super"
          },
          {
            title: "6. Vrátíme se k původnímu toku f=l+f'",
            text: "Max-flow pošle jednu jednotku po cestě S→B→C→A→T. To znamená f'(B,C)=1 a f'(C,A)=1.",
            formula: "f(A,B)=2+0=2\nf(B,C)=1+1=2\nf(C,A)=1+1=2\n\nV uzlech už sedí přítok = odtok.",
            stage: "done"
          }
        ]
      },
      balances: {
        title: "Přípustný tok s bilancemi",
        subtitle: "Hledáme přímo tok f(e), který splní kapacity hran a bilance vrcholů.",
        nodes: {
          A: [190, 220],
          B: [430, 105],
          C: [430, 335]
        },
        edges: [
          { from: "A", to: "B", cap: 2, flow: 2, label: [305, 130], curve: [280, 145, 345, 112] },
          { from: "A", to: "C", cap: 2, flow: 1, label: [305, 310], curve: [280, 295, 345, 328] },
          { from: "B", to: "C", cap: 2, flow: 2, label: [485, 220] }
        ],
        balances: { A: 3, B: 0, C: -3 },
        steps: [
          {
            title: "1. Zadání: kapacity a bilance",
            text: "Vrchol A má dodat 3 jednotky, C má 3 jednotky přijmout a B je pouze průchozí. Součet bilancí musí být nula.",
            formula: "b(A)=+3  dodává\nb(B)=0   průchozí\nb(C)=-3  spotřebuje\n\nΣ b(v)=+3+0-3=0",
            stage: "setup"
          },
          {
            title: "2. Zkusíme konkrétní tok f(e)",
            text: "Po hranách pošleme tok tak, aby žádná hrana nepřekročila kapacitu. Popisek 2/2 znamená tok 2 z kapacity 2.",
            formula: "f(A,B)=2  z kapacity 2\nf(A,C)=1  z kapacity 2\nf(B,C)=2  z kapacity 2",
            stage: "candidate"
          },
          {
            title: "3. Ověříme rovnici v každém uzlu",
            text: "Používáme rovnici odtok minus přítok rovná se bilance. Když sedí všechny uzly, tok je vzhledem k bilancím přípustný.",
            formula: "Σ f_out(v) - Σ f_in(v) = b(v)\n\nA: (2+1)-0 = +3 ✓\nB: 2-2 = 0 ✓\nC: 0-(1+2) = -3 ✓",
            stage: "check"
          },
          {
            title: "4. Redukce na max-flow",
            text: "Kladné bilance napojíme ze super-zdroje S. Záporné bilance napojíme do super-odpadu T. Původní hrany zůstanou mezi A, B, C.",
            formula: "S→A cap 3\nC→T cap 3\n\nA dodá 3 jednotky, C musí 3 jednotky odebrat.",
            stage: "super"
          },
          {
            title: "5. Kontrola saturace super-hran",
            text: "Pokud max-flow pošle přes S→A celé 3 a přes C→T celé 3, všechny požadavky bilancí jsou splněné.",
            formula: "S→A: 3/3 saturováno\nC→T: 3/3 saturováno\n\n⇒ přípustný tok s bilancemi existuje",
            stage: "saturated"
          }
        ]
      }
    };

    let step = 0;
    const cfg = configs[mode];

    const svg = document.getElementById("svg");
    const title = document.getElementById("title");
    const text = document.getElementById("text");
    const formula = document.getElementById("formula");
    const badge = document.getElementById("badge");
    const hint = document.getElementById("hint");

    document.getElementById("mainTitle").textContent = cfg.title;
    document.getElementById("mainSubtitle").textContent = cfg.subtitle;

    function el(name, attrs = {}) {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    }

    function defs() {
      const d = el("defs");
      d.innerHTML = `
        <marker id="arrowGray" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="10" markerHeight="10" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#94a3b8"></path>
        </marker>
        <marker id="arrowAmber" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#fbbf24"></path>
        </marker>
        <marker id="arrowGreen" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#34d399"></path>
        </marker>
        <marker id="arrowBlue" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto">
          <path d="M0 0 L12 6 L0 12z" fill="#38bdf8"></path>
        </marker>`;
      svg.append(d);
    }

    function markerFor(className) {
      if (className.includes("super")) return "url(#arrowBlue)";
      if (className.includes("used")) return "url(#arrowGreen)";
      if (className.includes("hot")) return "url(#arrowAmber)";
      return "url(#arrowGray)";
    }

    function shortenPoint(point, toward, amount = 36) {
      const dx = toward[0] - point[0];
      const dy = toward[1] - point[1];
      const len = Math.hypot(dx, dy) || 1;
      return [
        point[0] + dx / len * amount,
        point[1] + dy / len * amount
      ];
    }

    function pathData(edge, nodes = cfg.nodes) {
      const from = nodes[edge.from];
      const to = nodes[edge.to];
      if (edge.curve) {
        const c1 = [edge.curve[0], edge.curve[1]];
        const c2 = [edge.curve[2], edge.curve[3]];
        const start = shortenPoint(from, c1);
        const end = shortenPoint(to, c2);
        return `M ${start[0]} ${start[1]} C ${c1[0]} ${c1[1]}, ${c2[0]} ${c2[1]}, ${end[0]} ${end[1]}`;
      }
      const start = shortenPoint(from, to);
      const end = shortenPoint(to, from);
      return `M ${start[0]} ${start[1]} L ${end[0]} ${end[1]}`;
    }

    function drawEdge(edge, className, labelText) {
      svg.append(el("path", {
        d: pathData(edge),
        class: className,
        "marker-end": markerFor(className)
      }));
      if (labelText) drawLabel(edge.label[0], edge.label[1], labelText);
    }

    function drawLine(from, to, className, labelAt, labelText) {
      svg.append(el("path", {
        d: `M ${from[0]} ${from[1]} L ${to[0]} ${to[1]}`,
        class: className,
        "marker-end": markerFor(className)
      }));
      if (labelText) drawLabel(labelAt[0], labelAt[1], labelText);
    }

    function drawLabel(x, y, value, width = 92) {
      const g = el("g", { class: "label" });
      g.append(el("rect", { x: x - width / 2, y: y - 14, width, height: 28, rx: 6 }));
      const t = el("text", { x, y: y + 1 });
      t.textContent = value;
      g.append(t);
      svg.append(g);
    }

    function drawNote(x, y, value, width = 180) {
      const g = el("g", { class: "note" });
      g.append(el("rect", { x: x - width / 2, y: y - 16, width, height: 32, rx: 7 }));
      const t = el("text", { x, y: y + 1 });
      t.textContent = value;
      g.append(t);
      svg.append(g);
    }

    function balanceClass(value) {
      if (value > 0) return "pos";
      if (value < 0) return "neg";
      return "zero";
    }

    function drawNode(id, x, y, cls = "") {
      svg.append(el("circle", { cx: x, cy: y, r: 30, class: `node ${cls}` }));
      const t = el("text", { x, y: y + 1, class: "txt" });
      t.textContent = id;
      svg.append(t);
    }

    function drawBalance(id, value, x, y) {
      const b = el("text", { x, y: y + 50, class: `balance ${balanceClass(value)}` });
      b.textContent = `b=${value > 0 ? "+" : ""}${value}`;
      svg.append(b);
    }

    function renderLower(stage) {
      cfg.edges.forEach(edge => {
        let label = `[${edge.l},${edge.u}]`;
        let cls = "edge";
        if (stage === "original") cls = "edge hot";
        if (stage === "mandatory" || stage === "balances") {
          label = `l=${edge.l}`;
          cls = "edge used";
        }
        if (stage === "shift" || stage === "super") label = `cap ${edge.u - edge.l}`;
        if (stage === "done") {
          const residual = edge.from === "A" && edge.to === "B" ? 0 : 1;
          label = `${edge.l}+${residual}=${edge.l + residual}`;
          cls = residual > 0 ? "edge used" : "edge";
        }
        drawEdge(edge, cls, label);
      });

      if (stage === "original") {
        drawNote(636, 86, "interval [l,u]: minimum a maximum", 250);
      }

      if (stage === "mandatory") {
        drawNote(636, 86, "nejdřív vložíme jen povinné l(e)", 260);
        drawLabel(190, 150, "in 1, out 2", 112);
        drawLabel(430, 160, "in 2, out 1", 112);
        drawLabel(430, 390, "in 1, out 1", 112);
      }

      if (stage === "shift") {
        drawNote(635, 86, "po odečtení l(e) zůstane volná kapacita", 300);
      }

      if (stage === "balances" || stage === "super" || stage === "done") {
        drawNote(660, 86, "bilance vzniknou jen z povinných l(e)", 250);
      }

      if (stage === "balances") {
        drawLabel(190, 150, "1-2=-1", 86);
        drawLabel(430, 160, "2-1=+1", 86);
        drawLabel(430, 390, "1-1=0", 80);
      }

      if (stage === "super" || stage === "done") {
        const S = [70, 220];
        const T = [720, 220];
        const superCls = stage === "done" ? "edge used" : "edge super";
        drawLine(S, [402, 105], superCls, [244, 92], stage === "done" ? "1/1" : "cap 1");
        drawLine([220, 220], [690, 220], superCls, [570, 196], stage === "done" ? "1/1" : "cap 1");
        drawNode("S", S[0], S[1], "super");
        drawNode("T", T[0], T[1], "super");
        drawNote(640, 322, stage === "done" ? "cesta S→B→C→A→T je saturovaná" : "stačí nasytit S→B a A→T", 270);
      }

      Object.entries(cfg.nodes).forEach(([id, [x, y]]) => {
        const b = cfg.balances[id];
        const cls = stage === "balances" || stage === "super" || stage === "done" ? balanceClass(b) : "";
        drawNode(id, x, y, cls);
        if (stage === "balances" || stage === "super" || stage === "done") drawBalance(id, b, x, y);
      });
    }

    function renderBalances(stage) {
      const showFlow = stage === "candidate" || stage === "check" || stage === "saturated";
      cfg.edges.forEach(edge => {
        const cls = showFlow ? "edge used" : "edge";
        const label = showFlow ? `${edge.flow}/${edge.cap}` : `cap ${edge.cap}`;
        drawEdge(edge, cls, label);
      });

      if (stage === "setup") {
        drawNote(655, 88, "zadání: kapacity u(e) + bilance b(v)", 270);
      }

      if (stage === "candidate") {
        drawNote(650, 88, "popisek je f(e)/u(e)", 190);
      }

      if (stage === "check") {
        drawNote(650, 88, "v každém uzlu: odtok - přítok = b(v)", 270);
        drawLabel(190, 150, "(2+1)-0=3", 112);
        drawLabel(430, 160, "2-2=0", 82);
        drawLabel(430, 390, "0-(1+2)=-3", 118);
      }

      if (stage === "super" || stage === "saturated") {
        const S = [70, 220];
        const T = [720, 335];
        drawLine(S, [160, 220], stage === "saturated" ? "edge used" : "edge super", [106, 185], stage === "saturated" ? "3/3" : "cap 3");
        drawLine([460, 335], [690, 335], stage === "saturated" ? "edge used" : "edge super", [600, 360], stage === "saturated" ? "3/3" : "cap 3");
        drawNode("S", S[0], S[1], "super");
        drawNode("T", T[0], T[1], "super");
        drawNote(650, 88, "kontrolujeme saturaci super-hran", 240);
      }

      Object.entries(cfg.nodes).forEach(([id, [x, y]]) => {
        const b = cfg.balances[id];
        drawNode(id, x, y, balanceClass(b));
        drawBalance(id, b, x, y);
      });
    }

    function render() {
      const active = cfg.steps[step];
      svg.innerHTML = "";
      defs();

      if (mode === "balances") renderBalances(active.stage);
      else renderLower(active.stage);

      badge.textContent = `${step + 1} / ${cfg.steps.length}`;
      title.textContent = active.title;
      text.textContent = active.text;
      formula.textContent = active.formula;
      hint.textContent = mode === "balances"
        ? "Dolní meze jsou až další téma; tady se řeší přímo tok f(e) a kapacity u(e)."
        : "Po vyřešení transformované úlohy nezapomeň přičíst dolní meze zpět: f=l+f'.";
    }

    document.getElementById("next").onclick = () => {
      step = Math.min(cfg.steps.length - 1, step + 1);
      render();
    };
    document.getElementById("prev").onclick = () => {
      step = Math.max(0, step - 1);
      render();
    };
    document.getElementById("reset").onclick = () => {
      step = 0;
      render();
    };

    render();
  </script>
</body>
</html>
