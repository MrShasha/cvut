<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lower bounds ve flow</title>
  <style>
    :root{--bg:#111827;--panel:#172033;--ink:#e5e7eb;--muted:#9ca3af;--line:#334155;--blue:#38bdf8;--green:#34d399;--red:#fb7185;--amber:#fbbf24}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}
    .wrap{max-width:1180px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 360px;gap:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
    h1{font-size:22px;margin:0 0 4px}.muted{color:var(--muted);margin:0 0 12px}svg{width:100%;height:390px;background:#0b1220;border:1px solid var(--line);border-radius:8px}
    .edge{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.edge.hot{stroke:var(--amber);stroke-width:5}.edge.super{stroke:var(--green);stroke-width:4;stroke-dasharray:8 6}
    .node{fill:#1e293b;stroke:#64748b;stroke-width:2}.node.pos{stroke:var(--green);stroke-width:4}.node.neg{stroke:var(--red);stroke-width:4}.node.super{stroke:var(--blue);stroke-width:4}
    .txt{fill:var(--ink);font-weight:800;text-anchor:middle;dominant-baseline:middle}.label rect{fill:#0b1220;stroke:#475569}.label text{fill:#e5e7eb;font:800 12px Consolas,monospace;text-anchor:middle}.balance{font:800 13px Consolas,monospace;fill:#dbeafe;text-anchor:middle}
    button{background:#24324a;color:var(--ink);border:1px solid #475569;border-radius:7px;padding:9px 12px;cursor:pointer}button.primary{background:#0e7490;border-color:#22d3ee}.controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#26364f;color:#cbd5e1;font-size:12px;margin-bottom:8px}
    .formula{background:#0b1220;border:1px solid var(--line);border-radius:8px;padding:10px;font:800 13px Consolas,monospace;color:#dbeafe;margin-top:10px;white-space:pre-line}
    @media(max-width:860px){.wrap{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>Dolní meze: převod na obyčejný max-flow</h1>
      <p class="muted">Když má hrana povinný tok l(e), nulový tok už nemusí být přípustný.</p>
      <svg id="svg" viewBox="0 0 780 390"></svg>
      <div class="controls"><button id="prev">← zpět</button><button class="primary" id="next">další krok →</button><button id="reset">reset</button></div>
    </main>
    <aside class="panel">
      <span class="badge" id="badge"></span>
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="formula" id="formula"></div>
    </aside>
  </div>
  <script>
    const NS="http://www.w3.org/2000/svg";
    const baseNodes={A:[180,190],B:[390,105],C:[390,275]};
    const baseEdges=[
      {from:"A",to:"B",l:2,u:5,label:[285,130]},
      {from:"A",to:"C",l:1,u:4,label:[285,250]},
      {from:"B",to:"C",l:1,u:3,label:[430,190]}
    ];
    const steps=[
      {title:"1. Původní síť s dolními mezemi",text:"Hrana [l,u] musí nést alespoň l jednotek toku. Nemůžeme automaticky začít s f=0.",formula:"příklad hran:\nA→B [2,5]\nA→C [1,4]\nB→C [1,3]",mode:"orig"},
      {title:"2. Odečteme povinné minimum",text:"Substituce f(e)=l(e)+f'(e). Nová kapacita je u'(e)=u(e)-l(e), dolní mez je 0.",formula:"A→B: u'=5-2=3\nA→C: u'=4-1=3\nB→C: u'=3-1=2",mode:"shift"},
      {title:"3. Spočítáme bilance uzlů",text:"Povinné toky rozbijí Kirchhoffův zákon. Bilance říká, kolik musí transformovaný tok dodat nebo odebrat.",formula:"b(v)=Σ l_in - Σ l_out\nb(A)=-3, b(B)=1, b(C)=2",mode:"balance"},
      {title:"4. Přidáme super-zdroj a super-odpad",text:"Pro b(v)>0 přidáme S→v s kapacitou b(v). Pro b(v)<0 přidáme v→T s kapacitou -b(v). Feasible flow existuje, když se všechny tyto hrany nasytí.",formula:"S→B cap 1\nS→C cap 2\nA→T cap 3",mode:"super"}
    ];
    let step=0;
    function el(n,a={}){const e=document.createElementNS(NS,n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}
    function arrow(svg){const d=el("defs");d.innerHTML='<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker>';svg.append(d)}
    function node(svg,id,x,y,cls=""){svg.append(el("circle",{cx:x,cy:y,r:28,class:"node "+cls}));const t=el("text",{x,y:y+1,class:"txt"});t.textContent=id;svg.append(t)}
    function line(svg,x1,y1,x2,y2,cls="edge"){svg.append(el("line",{x1,y1,x2,y2,class:cls}))}
    function label(svg,x,y,text){const g=el("g",{class:"label"});g.append(el("rect",{x:x-42,y:y-14,width:84,height:26,rx:6}));const t=el("text",{x,y:y+4});t.textContent=text;g.append(t);svg.append(g)}
    function render(){
      const s=steps[step], svg=document.getElementById("svg"); svg.innerHTML=""; arrow(svg);
      const n={...baseNodes}; if(s.mode==="super"){n.S=[70,190];n.T=[650,190]}
      baseEdges.forEach(e=>{const [x1,y1]=n[e.from], [x2,y2]=n[e.to]; line(svg,x1,y1,x2,y2,s.mode==="orig"?"edge hot":"edge"); label(svg,e.label[0],e.label[1],s.mode==="orig"?`[${e.l},${e.u}]`:`u'=${e.u-e.l}`)});
      if(s.mode==="super"){line(svg,98,190,362,110,"edge super");label(svg,235,130,"1");line(svg,98,190,362,270,"edge super");label(svg,235,250,"2");line(svg,208,190,622,190,"edge super");label(svg,415,175,"3")}
      Object.entries(n).forEach(([id,[x,y]])=>{let cls=id==="S"||id==="T"?"super":""; if(s.mode==="balance"||s.mode==="super"){if(id==="B"||id==="C")cls+=" pos"; if(id==="A")cls+=" neg"} node(svg,id,x,y,cls); if(s.mode==="balance"&&id.length===1){const b={A:"b=-3",B:"b=1",C:"b=2"}[id]; const tx=el("text",{x,y:y+48,class:"balance"});tx.textContent=b;svg.append(tx)}});
      document.getElementById("badge").textContent=`${step+1} / ${steps.length}`;
      document.getElementById("title").textContent=s.title;
      document.getElementById("text").textContent=s.text;
      document.getElementById("formula").textContent=s.formula;
    }
    document.getElementById("next").onclick=()=>{step=Math.min(steps.length-1,step+1);render()};
    document.getElementById("prev").onclick=()=>{step=Math.max(0,step-1);render()};
    document.getElementById("reset").onclick=()=>{step=0;render()};
    render();
  </script>
</body>
</html>
