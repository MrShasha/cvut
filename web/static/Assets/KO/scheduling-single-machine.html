<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rozvrhování na jednom zdroji</title>
  <style>
    :root {
      --bg: #111827;
      --panel: #172033;
      --ink: #e5e7eb;
      --muted: #9ca3af;
      --line: #334155;
      --blue: #38bdf8;
      --green: #34d399;
      --amber: #fbbf24;
      --red: #fb7185;
      --violet: #a78bfa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .muted { color: var(--muted); margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    button { border: 1px solid #475569; border-radius: 7px; padding: 9px 12px; color: var(--ink); background: #24324a; cursor: pointer; font: inherit; font-weight: 750; }
    button.active { background: #0e7490; border-color: #22d3ee; }
    .jobs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
    .job { border: 1px solid #475569; border-radius: 8px; padding: 8px; background: #0b1220; }
    .job strong { display: block; font-size: 16px; }
    .job span { display: block; color: #cbd5e1; font: 800 12px Consolas, monospace; }
    .timeline { position: relative; height: 128px; border: 1px solid var(--line); border-radius: 8px; background: #0b1220; overflow: hidden; }
    .axis { position: absolute; left: 32px; right: 16px; bottom: 24px; height: 2px; background: #475569; }
    .tick { position: absolute; bottom: 12px; transform: translateX(-50%); color: #94a3b8; font: 800 11px Consolas, monospace; }
    .bar { position: absolute; top: 36px; height: 38px; border-radius: 6px; display: grid; place-items: center; color: #082f49; font-weight: 900; box-shadow: inset 0 0 0 1px rgba(255,255,255,.28); }
    .bar small { display: block; font: 800 10px Consolas, monospace; color: #0f172a; }
    .metric { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: #0b1220; padding: 10px; font: 800 13px Consolas, monospace; }
    .metric span:nth-child(2n) { color: #dbeafe; }
    .note { margin-top: 10px; color: var(--muted); font-size: 13px; }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } .jobs { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="panel">
      <h1>Jedno zařízení: SPT, WSPT, EDD</h1>
      <p class="muted">Stejné úlohy, různé kritérium. Správné pořadí závisí na tom, co minimalizujeme.</p>
      <div class="jobs" id="jobs"></div>
      <div class="controls" id="controls"></div>
      <div class="timeline" id="timeline"></div>
    </main>
    <aside class="panel">
      <h2 id="title"></h2>
      <p id="text"></p>
      <div class="metric" id="metrics"></div>
      <p class="note" id="note"></p>
    </aside>
  </div>
  <script>
    const jobs = [
      { id: "A", p: 5, w: 8, d: 7, color: "#38bdf8" },
      { id: "B", p: 2, w: 3, d: 12, color: "#34d399" },
      { id: "C", p: 4, w: 7, d: 5, color: "#fbbf24" },
      { id: "D", p: 1, w: 1, d: 9, color: "#a78bfa" }
    ];
    const rules = {
      spt: {
        title: "SPT: shortest processing time",
        text: "Minimalizuje prostý součet dokončení ΣCj. Krátké úlohy nesmí čekat za dlouhými.",
        note: "Použij pro 1||ΣCj.",
        order: xs => [...xs].sort((a, b) => a.p - b.p)
      },
      wspt: {
        title: "WSPT: Smithovo pravidlo",
        text: "Minimalizuje vážený součet ΣwjCj. Nejdřív běží úloha s nejvyšším poměrem wj/pj.",
        note: "Použij pro 1||ΣwjCj.",
        order: xs => [...xs].sort((a, b) => b.w / b.p - a.w / a.p)
      },
      edd: {
        title: "EDD: earliest due date",
        text: "Minimalizuje Lmax. Nejdřív běží úloha s nejbližším due date.",
        note: "Použij pro 1||Lmax.",
        order: xs => [...xs].sort((a, b) => a.d - b.d)
      }
    };
    let active = "spt";
    const jobsEl = document.getElementById("jobs");
    const controlsEl = document.getElementById("controls");
    const timeline = document.getElementById("timeline");
    const metrics = document.getElementById("metrics");

    function renderJobs() {
      jobsEl.innerHTML = jobs.map(job => `
        <div class="job">
          <strong style="color:${job.color}">T${job.id}</strong>
          <span>p=${job.p}, w=${job.w}, d=${job.d}</span>
          <span>w/p=${(job.w / job.p).toFixed(2)}</span>
        </div>`).join("");
    }

    function schedule(order) {
      let t = 0;
      return order.map(job => {
        const start = t;
        t += job.p;
        return { ...job, start, finish: t, lateness: t - job.d };
      });
    }

    function renderTimeline(rows) {
      const total = Math.max(...rows.map(x => x.finish));
      const left = 32;
      const width = timeline.clientWidth - 48;
      timeline.innerHTML = '<div class="axis"></div>';
      for (let i = 0; i <= total; i += 2) {
        const x = left + width * i / total;
        const tick = document.createElement("div");
        tick.className = "tick";
        tick.style.left = `${x}px`;
        tick.textContent = i;
        timeline.append(tick);
      }
      rows.forEach(job => {
        const bar = document.createElement("div");
        bar.className = "bar";
        bar.style.left = `${left + width * job.start / total}px`;
        bar.style.width = `${Math.max(28, width * job.p / total)}px`;
        bar.style.background = job.color;
        bar.innerHTML = `T${job.id}<small>${job.start}-${job.finish}</small>`;
        timeline.append(bar);
      });
    }

    function render() {
      const rule = rules[active];
      const rows = schedule(rule.order(jobs));
      const sumC = rows.reduce((s, x) => s + x.finish, 0);
      const sumWC = rows.reduce((s, x) => s + x.w * x.finish, 0);
      const lmax = Math.max(...rows.map(x => x.lateness));
      document.getElementById("title").textContent = rule.title;
      document.getElementById("text").textContent = rule.text;
      document.getElementById("note").textContent = rule.note;
      metrics.innerHTML = `
        <span>pořadí</span><span>${rows.map(x => "T" + x.id).join(" → ")}</span>
        <span>ΣCj</span><span>${sumC}</span>
        <span>ΣwjCj</span><span>${sumWC}</span>
        <span>Lmax</span><span>${lmax}</span>`;
      renderTimeline(rows);
      [...controlsEl.children].forEach(btn => btn.classList.toggle("active", btn.dataset.rule === active));
    }

    controlsEl.innerHTML = Object.keys(rules).map(key => `<button data-rule="${key}">${key.toUpperCase()}</button>`).join("");
    controlsEl.onclick = event => {
      const key = event.target.dataset.rule;
      if (!key) return;
      active = key;
      render();
    };
    renderJobs();
    render();
    addEventListener("resize", render);
  </script>
</body>
</html>
