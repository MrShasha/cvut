<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitonické řazení — PAG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    padding: 16px;
  }
  h1 { color: #569cd6; font-size: 1.2em; margin-bottom: 14px; }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
    background: #2d2d2d;
    padding: 12px;
    border-radius: 8px;
  }
  button {
    background: #0984e3;
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 0.88em;
    transition: background 0.2s;
  }
  button:hover { background: #0773c5; }
  button:disabled { background: #555; cursor: default; }
  label { color: #9cdcfe; font-size: 0.85em; }
  select {
    background: #3c3c3c;
    color: #d4d4d4;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 0.88em;
  }
  .info {
    background: #2d2d2d;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 0.85em;
    color: #9cdcfe;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .info span { color: #c3e88d; }
  canvas {
    display: block;
    background: #252525;
    border-radius: 8px;
    width: 100%;
  }
  .step-indicator {
    margin-top: 10px;
    text-align: center;
    font-size: 0.9em;
    color: #888;
  }
  .step-indicator strong { color: #c3e88d; }
</style>
</head>
<body>
<h1>Bitonické řazení — vizualizace</h1>
<div class="controls">
  <label>Počet prvků:</label>
  <select id="nSelect" onchange="reset()">
    <option value="8">8</option>
    <option value="16" selected>16</option>
    <option value="32">32</option>
  </select>
  <button onclick="reset()">Nová data</button>
  <button id="btnPrev" onclick="prevStep()" disabled>◀ Předchozí</button>
  <button id="btnNext" onclick="nextStep()">Další ▶</button>
  <button id="btnPlay" onclick="togglePlay()">▶ Přehrát</button>
</div>
<div class="info">
  <div>Fáze: <span id="infoPhase">—</span></div>
  <div>Krok: <span id="infoStep">—</span></div>
  <div>Popis: <span id="infoDesc">—</span></div>
  <div>Hloubka: <span id="infoDepth">—</span> / <span id="infoDepthTotal">—</span></div>
</div>
<canvas id="canvas" height="320"></canvas>
<div class="step-indicator" id="stepBar"></div>

<script>
let arr = [], steps = [], currentStep = 0, playTimer = null;

function getN() { return parseInt(document.getElementById('nSelect').value); }

function reset() {
  const n = getN();
  arr = Array.from({length: n}, (_, i) => i + 1);
  // Fisher-Yates shuffle
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  steps = [];
  generateSteps([...arr], n);
  currentStep = 0;
  stopPlay();
  updateUI();
  draw();
}

function generateSteps(a, n) {
  // Generate all bitonicSort steps
  let state = [...a];
  steps = [];
  steps.push({ arr: [...state], highlights: [], desc: "Počáteční stav (nesortováno)", phase: 0, stepNum: 0 });

  let depth = 0;
  // Bitonic sort: phase k (k=1..log n), step j (j=k..1)
  for (let k = 1; (1 << k) <= n; k++) {
    for (let j = k; j >= 1; j--) {
      depth++;
      const highlights = [];
      const next = [...state];
      for (let i = 0; i < n; i++) {
        const l = i ^ (1 << (j - 1));
        if (l > i) {
          const dir = ((i >> k) & 1) === 0;
          if ((next[i] > next[l]) === dir) {
            [next[i], next[l]] = [next[l], next[i]];
            highlights.push([i, l]);
          } else {
            highlights.push([i, l, 'noswap']);
          }
        }
      }
      state = next;
      const logN = Math.log2(n);
      steps.push({
        arr: [...state],
        highlights,
        desc: `Fáze ${k} (bloky 2^${k}), krok ${j}`,
        phase: k,
        stepNum: depth,
        depthTotal: logN * (logN + 1) / 2,
      });
    }
  }
  steps.push({ arr: [...state], highlights: [], desc: "Seřazeno ✓", phase: -1, stepNum: depth });
}

function draw() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = 320;
  const n = getN();
  const step = steps[currentStep];
  if (!step) return;

  ctx.fillStyle = '#252525';
  ctx.fillRect(0, 0, W, H);

  const a = step.arr;
  const maxVal = n;
  const barW = Math.floor((W - 20) / n);
  const maxH = H - 40;

  // Highlight sets
  const swapped = new Set(), noswap = new Set();
  (step.highlights || []).forEach(h => {
    if (h[2] === 'noswap') { noswap.add(h[0]); noswap.add(h[1]); }
    else { swapped.add(h[0]); swapped.add(h[1]); }
  });

  a.forEach((v, i) => {
    const x = 10 + i * barW;
    const barH = Math.round((v / maxVal) * maxH);
    const y = H - 30 - barH;
    let color = '#4a9eff';
    if (swapped.has(i)) color = '#00e676';
    else if (noswap.has(i)) color = '#ff7675';
    else if (step.phase === -1) color = '#00b894';

    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y, barW - 2, barH);

    if (n <= 16) {
      ctx.fillStyle = '#aaa';
      ctx.font = `${Math.min(11, barW - 2)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(v, x + barW/2, H - 14);
    }
  });

  // Draw comparison arcs for highlighted pairs
  if (step.highlights && n <= 16) {
    (step.highlights).forEach(h => {
      const i = h[0], l = h[1];
      const xi = 10 + i * barW + barW/2;
      const xl = 10 + l * barW + barW/2;
      const mid = (xi + xl) / 2;
      const radius = Math.abs(xl - xi) / 2;
      ctx.beginPath();
      ctx.arc(mid, H - 30, radius, Math.PI, 0);
      ctx.strokeStyle = h[2] === 'noswap' ? '#ff7675' : '#00e676';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
  }
}

function updateUI() {
  const step = steps[currentStep];
  if (!step) return;
  document.getElementById('infoPhase').textContent = step.phase >= 0 ? step.phase : 'Hotovo';
  document.getElementById('infoStep').textContent = `${currentStep} / ${steps.length - 1}`;
  document.getElementById('infoDesc').textContent = step.desc;
  document.getElementById('infoDepth').textContent = step.stepNum || 0;
  const logN = Math.log2(getN());
  document.getElementById('infoDepthTotal').textContent = Math.round(logN * (logN + 1) / 2);

  document.getElementById('btnPrev').disabled = currentStep === 0;
  document.getElementById('btnNext').disabled = currentStep === steps.length - 1;

  // Step bar
  const pct = steps.length > 1 ? (currentStep / (steps.length - 1) * 100).toFixed(0) : 0;
  document.getElementById('stepBar').innerHTML = `Průběh: <strong>${pct}%</strong> (krok ${currentStep}/${steps.length-1})`;
}

function nextStep() {
  if (currentStep < steps.length - 1) { currentStep++; draw(); updateUI(); }
}
function prevStep() {
  if (currentStep > 0) { currentStep--; draw(); updateUI(); }
}
function togglePlay() {
  if (playTimer) { stopPlay(); }
  else { startPlay(); }
}
function startPlay() {
  document.getElementById('btnPlay').textContent = '⏸ Pauza';
  playTimer = setInterval(() => {
    if (currentStep < steps.length - 1) { currentStep++; draw(); updateUI(); }
    else { stopPlay(); }
  }, 300);
}
function stopPlay() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
  document.getElementById('btnPlay').textContent = '▶ Přehrát';
}

window.addEventListener('resize', draw);
reset();
</script>
</body>
</html>
