<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isoefektivita — PAG</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1e1e1e;
    color: #d4d4d4;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    color: #569cd6;
    font-size: 1.3em;
    margin-bottom: 16px;
  }
  .layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 16px;
  }
  .controls {
    background: #2d2d2d;
    border-radius: 8px;
    padding: 16px;
  }
  .controls h3 {
    color: #9cdcfe;
    margin-bottom: 12px;
    font-size: 0.9em;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .control-group {
    margin-bottom: 14px;
  }
  .control-group label {
    display: block;
    color: #9cdcfe;
    margin-bottom: 5px;
    font-size: 0.82em;
  }
  select, input[type=range] {
    width: 100%;
    background: #3c3c3c;
    color: #d4d4d4;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 5px 8px;
    font-size: 0.88em;
  }
  input[type=range] {
    padding: 4px 0;
    cursor: pointer;
    accent-color: #0984e3;
  }
  .canvas-panel {
    background: #2d2d2d;
    border-radius: 8px;
    padding: 16px;
  }
  canvas {
    display: block;
    width: 100%;
    border-radius: 4px;
    background: #252525;
  }
  .algo-list {
    margin-top: 14px;
  }
  .algo-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 0.85em;
    cursor: pointer;
    opacity: 0.9;
  }
  .algo-item:hover { opacity: 1; }
  .color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .checkbox-custom {
    width: 14px;
    height: 14px;
    border: 2px solid #555;
    border-radius: 2px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
  }
  .checkbox-custom.checked { background: #0984e3; border-color: #0984e3; }
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }
  .stat-box {
    background: #3c3c3c;
    border-radius: 5px;
    padding: 8px 10px;
    text-align: center;
  }
  .stat-label { font-size: 0.72em; color: #888; }
  .stat-value { font-size: 1em; font-weight: 600; color: #c3e88d; }
  .info-text {
    font-size: 0.82em;
    color: #aaa;
    line-height: 1.6;
    margin-top: 12px;
  }
</style>
</head>
<body>
<h1>Isoefektivita algoritmů — PAG</h1>
<div class="layout">
  <div class="controls">
    <h3>Zobrazení</h3>
    <div class="control-group">
      <label>Osa X: Počet procesorů p</label>
      <select id="xscale" onchange="draw()">
        <option value="linear">Lineární</option>
        <option value="log" selected>Logaritmická</option>
      </select>
    </div>
    <div class="control-group">
      <label>Osa Y: Velikost problému W</label>
      <select id="yscale" onchange="draw()">
        <option value="linear">Lineární</option>
        <option value="log" selected>Logaritmická</option>
      </select>
    </div>
    <div class="control-group">
      <label>Max p: <span id="pMaxVal">1024</span></label>
      <input type="range" id="pMaxSlider" min="2" max="10" value="10" step="1" oninput="updatePMax()">
    </div>

    <h3 style="margin-top:16px; margin-bottom:10px;">Algoritmy</h3>
    <div class="algo-list" id="algoList"></div>

    <div class="info-text">
      Isoefektivita $f(p)$: jak rychle musí narůstat W, aby efektivita E zůstala konstantní. Strmější křivka = horší škálovatelnost.
    </div>
  </div>

  <div class="canvas-panel">
    <canvas id="chart" width="600" height="400"></canvas>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Nejlepší škálovatelnost</div>
        <div class="stat-value" id="statBest">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Nejhorší škálovatelnost</div>
        <div class="stat-value" id="statWorst">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">p = <span id="curP">—</span></div>
        <div class="stat-value" id="curW">—</div>
      </div>
    </div>
  </div>
</div>

<script>
const algorithms = [
  {
    name: "Sčítání čísel",
    desc: "Θ(p log p)",
    color: "#0984e3",
    fn: p => p * Math.log2(p),
    enabled: true,
  },
  {
    name: "Quicksort",
    desc: "Θ(p log²p)",
    color: "#00b894",
    fn: p => p * Math.pow(Math.log2(p), 2),
    enabled: true,
  },
  {
    name: "Matice×Vektor 2D",
    desc: "Θ(p^1.5)",
    color: "#fdcb6e",
    fn: p => Math.pow(p, 1.5),
    enabled: true,
  },
  {
    name: "Cannon / Gauss 2D",
    desc: "Θ(p^1.5 log³p)",
    color: "#e17055",
    fn: p => Math.pow(p, 1.5) * Math.pow(Math.log2(p), 3),
    enabled: true,
  },
  {
    name: "Prim / Dijkstra",
    desc: "Θ(p² log²p)",
    color: "#a29bfe",
    fn: p => p * p * Math.pow(Math.log2(p), 2),
    enabled: true,
  },
  {
    name: "Odd-Even Sort",
    desc: "Θ(p·2^p)",
    color: "#ff7675",
    fn: p => p * Math.pow(2, Math.min(p, 30)),
    enabled: false,
  },
];

// Build algo list
const algoList = document.getElementById('algoList');
algorithms.forEach((a, i) => {
  const div = document.createElement('div');
  div.className = 'algo-item';
  div.innerHTML = `<div class="color-dot" style="background:${a.color}"></div>
    <div class="checkbox-custom ${a.enabled ? 'checked' : ''}" id="chk${i}">✓</div>
    <span>${a.name} <span style="color:#888">${a.desc}</span></span>`;
  div.onclick = () => {
    a.enabled = !a.enabled;
    document.getElementById('chk'+i).className = 'checkbox-custom' + (a.enabled ? ' checked' : '');
    draw();
  };
  algoList.appendChild(div);
});

function updatePMax() {
  const v = parseInt(document.getElementById('pMaxSlider').value);
  document.getElementById('pMaxVal').textContent = Math.pow(2, v);
  draw();
}

function draw() {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.offsetWidth;
  const H = canvas.height = 400;
  const pad = { left: 60, right: 20, top: 20, bottom: 40 };

  ctx.fillStyle = '#252525';
  ctx.fillRect(0, 0, W, H);

  const pMaxK = parseInt(document.getElementById('pMaxSlider').value);
  const pMax = Math.pow(2, pMaxK);
  const xscale = document.getElementById('xscale').value;
  const yscale = document.getElementById('yscale').value;

  // Collect all values
  const ps = [];
  for (let k = 1; k <= pMaxK; k++) ps.push(Math.pow(2, k));

  const allVals = [];
  algorithms.filter(a => a.enabled).forEach(a => ps.forEach(p => {
    const v = a.fn(p);
    if (isFinite(v) && v > 0) allVals.push(v);
  }));

  if (allVals.length === 0) return;

  const yMin = Math.min(...allVals);
  const yMax = Math.max(...allVals);
  const xMin = 2, xMax = pMax;

  function toX(p) {
    if (xscale === 'log') {
      return pad.left + (Math.log2(p) - Math.log2(xMin)) / (Math.log2(xMax) - Math.log2(xMin)) * (W - pad.left - pad.right);
    }
    return pad.left + (p - xMin) / (xMax - xMin) * (W - pad.left - pad.right);
  }
  function toY(w) {
    const yn = yscale === 'log' ? (Math.log(w) - Math.log(yMin)) / (Math.log(yMax) - Math.log(yMin))
                                : (w - yMin) / (yMax - yMin);
    return H - pad.bottom - yn * (H - pad.top - pad.bottom);
  }

  // Grid
  ctx.strokeStyle = '#3c3c3c';
  ctx.lineWidth = 1;
  for (let k = 1; k <= pMaxK; k++) {
    const x = toX(Math.pow(2, k));
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, H - pad.bottom); ctx.stroke();
  }

  // Axes
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(pad.left, pad.top); ctx.lineTo(pad.left, H - pad.bottom);
  ctx.lineTo(W - pad.right, H - pad.bottom);
  ctx.stroke();

  // X labels
  ctx.fillStyle = '#888';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'center';
  for (let k = 1; k <= pMaxK; k += Math.max(1, Math.floor(pMaxK/8))) {
    const p = Math.pow(2, k);
    const x = toX(p);
    ctx.fillText('2^'+k, x, H - pad.bottom + 14);
  }
  ctx.fillText('Procesory p', pad.left + (W-pad.left-pad.right)/2, H - 2);

  // Y label
  ctx.save(); ctx.translate(14, pad.top + (H-pad.top-pad.bottom)/2);
  ctx.rotate(-Math.PI/2); ctx.fillText('Velikost W', 0, 0); ctx.restore();

  // Lines
  algorithms.filter(a => a.enabled).forEach(a => {
    ctx.strokeStyle = a.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let first = true;
    ps.forEach(p => {
      const v = a.fn(p);
      if (!isFinite(v) || v <= 0) return;
      const x = toX(p), y = toY(v);
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Label at end
    const lastP = ps[ps.length-1];
    const lastV = a.fn(lastP);
    if (isFinite(lastV) && lastV > 0) {
      const x = toX(lastP), y = Math.max(pad.top + 10, Math.min(H - pad.bottom - 4, toY(lastV)));
      ctx.fillStyle = a.color;
      ctx.font = 'bold 10px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(a.desc, x - 4, y - 4);
    }
  });

  // Stats
  const enabled = algorithms.filter(a => a.enabled);
  if (enabled.length > 0) {
    const p16 = 16;
    const vals16 = enabled.map(a => ({name: a.desc, v: a.fn(p16)})).filter(x => isFinite(x.v));
    if (vals16.length > 0) {
      vals16.sort((a, b) => a.v - b.v);
      document.getElementById('statBest').textContent = vals16[0].name;
      document.getElementById('statWorst').textContent = vals16[vals16.length-1].name;
      document.getElementById('curP').textContent = p16;
      document.getElementById('curW').textContent = enabled.map(a => a.fn(p16).toFixed(0)).join(' / ');
    }
  }
}

updatePMax();
window.addEventListener('resize', draw);
</script>
</body>
</html>
