<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All-Reduce & Prefix Sum — animace</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1e1e1e; color: #d4d4d4; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; padding: 16px; }
h1 { color: #569cd6; font-size: 1.2em; margin-bottom: 12px; }
.main { display: grid; grid-template-columns: 1fr 310px; gap: 14px; }
.panel { background: #2d2d2d; border-radius: 8px; padding: 14px; }
.panel h3 { color: #9cdcfe; font-size: 0.85em; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
label { color: #9cdcfe; font-size: 0.82em; white-space: nowrap; }
select, input[type=range] { background: #3c3c3c; color: #d4d4d4; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 0.88em; }
input[type=range] { padding: 2px 0; accent-color: #0984e3; cursor: pointer; }
.btn { background: #0984e3; color: #fff; border: none; border-radius: 5px; padding: 7px 16px; font-size: 0.88em; cursor: pointer; font-weight: 600; }
.btn:hover { background: #0773c5; } .btn.secondary { background: #3c3c3c; } .btn.secondary:hover { background: #4a4a4a; }
canvas { display: block; width: 100%; background: #252525; border-radius: 6px; }
.step-info { background: #1a1a2e; border-left: 3px solid #0984e3; border-radius: 0 6px 6px 0; padding: 10px 14px; margin-bottom: 10px; font-size: 0.85em; line-height: 1.6; min-height: 60px; }
.deriv-box { background: #252525; border-radius: 6px; padding: 12px; font-size: 0.83em; line-height: 1.8; }
.deriv-row { display: flex; gap: 8px; align-items: baseline; margin-bottom: 2px; }
.deriv-lbl { color: #888; min-width: 130px; font-size: 0.9em; }
.deriv-val { color: #c3e88d; font-family: monospace; }
.highlight { color: #0984e3; font-weight: 700; }
.progress-wrap { background: #3c3c3c; border-radius: 4px; height: 6px; margin: 8px 0; }
.progress-bar { background: #0984e3; height: 6px; border-radius: 4px; transition: width .3s; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.stat { background: #3c3c3c; border-radius: 5px; padding: 8px 10px; border-left: 3px solid; }
.stat.blue { border-color: #0984e3; } .stat.green { border-color: #00b894; }
.stat-lbl { font-size: 0.72em; color: #888; text-transform: uppercase; }
.stat-val { font-size: 1.05em; font-weight: 700; color: #d4d4d4; margin-top: 2px; }
.tab-btns { display: flex; gap: 6px; margin-bottom: 10px; }
.tab-btn { background: #3c3c3c; color: #888; border: none; border-radius: 5px; padding: 6px 14px; font-size: 0.82em; cursor: pointer; }
.tab-btn.active { background: #0984e3; color: #fff; font-weight: 700; }
.node-table { width: 100%; border-collapse: collapse; font-size: 0.8em; margin-top: 6px; }
.node-table th { color: #888; font-weight: 400; padding: 3px 6px; text-align: center; border-bottom: 1px solid #444; }
.node-table td { padding: 4px 6px; text-align: center; border-bottom: 1px solid #333; }
.node-table td.acc { color: #c3e88d; font-family: monospace; font-weight: 700; }
.node-table td.prefix { color: #74b9ff; font-family: monospace; font-weight: 700; }
</style>
</head>
<body>
<h1>All-Reduce &amp; Prefix Sum — hyperkrychle</h1>

<div class="main">
<div>
  <div class="panel" style="margin-bottom:10px;">
    <div class="tab-btns">
      <button class="tab-btn active" id="tabAllReduce" onclick="switchMode('allreduce')">All-Reduce</button>
      <button class="tab-btn" id="tabPrefix" onclick="switchMode('prefix')">Prefix Sum</button>
    </div>
    <div class="row">
      <label>p = 2^</label>
      <input type="range" id="pSlider" min="1" max="4" value="3" style="width:80px;" oninput="updateP()">
      <span style="color:#c3e88d; font-weight:700;" id="pVal">8</span>
      <label>&nbsp;Hodnoty: seed</label>
      <input type="range" id="seed" min="1" max="99" value="42" style="width:60px;" oninput="reset()">
    </div>
    <div class="row">
      <button class="btn" id="playBtn" onclick="togglePlay()">▶ Přehrát</button>
      <button class="btn secondary" onclick="stepBack()">◀ Zpět</button>
      <button class="btn secondary" onclick="stepFwd()">Vpřed ▶</button>
      <button class="btn secondary" onclick="reset()">↺ Reset</button>
      <label>Rychlost:</label>
      <input type="range" id="speed" min="300" max="2000" value="900" step="100" style="width:80px;">
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress" style="width:0%"></div></div>
  </div>

  <canvas id="cv" height="310"></canvas>
  <div class="step-info" id="stepInfo">Stiskni ▶ nebo krok vpřed.</div>
</div>

<div>
  <div class="panel" style="margin-bottom:10px;">
    <h3>Hodnoty procesorů</h3>
    <table class="node-table" id="nodeTable">
      <thead><tr><th>P</th><th>Vstup</th><th id="accHead">Akumulátor</th><th id="prefixHead" style="display:none">Prefix</th></tr></thead>
      <tbody id="nodeBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h3>Odvození složitosti</h3>
    <div class="deriv-box">
      <div class="deriv-row"><span class="deriv-lbl">Algoritmus:</span><span class="deriv-val" id="dAlg">—</span></div>
      <div class="deriv-row"><span class="deriv-lbl">Topologie:</span><span class="deriv-val">Hyperkrychle</span></div>
      <div class="deriv-row"><span class="deriv-lbl">Fáze:</span><span class="deriv-val" id="dPhases">—</span></div>
      <div class="deriv-row"><span class="deriv-lbl">Kroků na fázi:</span><span class="deriv-val" id="dStepsPhase">log p</span></div>
      <div class="deriv-row"><span class="deriv-lbl">Datový objem:</span><span class="deriv-val" id="dDataVol">m slov (konst.)</span></div>
      <hr style="border-color:#444; margin: 8px 0;">
      <div class="deriv-row"><span class="deriv-lbl">T (tₛ):</span><span class="deriv-val" id="dTs">—</span></div>
      <div class="deriv-row"><span class="deriv-lbl">T (tᵥ):</span><span class="deriv-val" id="dTw">—</span></div>
      <div class="deriv-row"><span class="deriv-lbl highlight">T celkem:</span><span class="deriv-val highlight" id="dTotal">—</span></div>
      <div style="color:#888; font-size:0.8em; margin-top:8px;" id="dNote">—</div>
    </div>
    <div class="stat-grid">
      <div class="stat blue"><div class="stat-lbl">Krok</div><div class="stat-val" id="sCurStep">0/0</div></div>
      <div class="stat green"><div class="stat-lbl">Zpráv celkem</div><div class="stat-val" id="sMsgs">0</div></div>
    </div>
  </div>
</div>
</div>

<script>
let p = 8, mode = 'allreduce';
let initVals = [], steps = [];
let curStep = -1;
// For each step: {pairs, desc} -- pairs: {from, to, dim}
// State: accum[i] = accumulated value at proc i (for allreduce: running sum of received so far)
//        prefix[i] = prefix sum at proc i (for prefix: sum of all j<=i that contributed)
let accum = [], prefixSums = [];

let arrows = [], playing = false, playTimer = null, animFrame = null, lastTime = null;

function seededRand(seed, i) {
  // simple LCG
  let s = (seed * 1664525 + 1013904223 + i * 22695477) & 0xffffffff;
  return ((s >>> 0) % 9) + 1;
}

function initValsFrom() {
  const seed = parseInt(document.getElementById('seed').value);
  initVals = [];
  for (let i=0;i<p;i++) initVals.push(seededRand(seed, i));
}

function buildSteps() {
  steps = [];
  const d = Math.log2(p);
  if (mode === 'allreduce') {
    // One-to-all broadcast pattern: log p steps on hypercube
    // Step b: each node sends its current accumulated to partner at dimension b
    for (let b=0; b<d; b++) {
      const pairs = [];
      for (let i=0;i<p;i++) {
        const j = i ^ (1<<b);
        if (i < j) { pairs.push({from:i,to:j,dim:b}); pairs.push({from:j,to:i,dim:b}); }
      }
      steps.push({ pairs, desc: `Krok ${b+1} (dim ${b}): každý pošle akumulátor partnerovi, pak sečte` });
    }
  } else {
    // Prefix sum — two phases on hypercube
    // Phase 1 (reduce-to-root-like): log p steps up
    for (let b=0; b<d; b++) {
      const pairs = [];
      for (let i=0;i<p;i++) {
        const j = i ^ (1<<b);
        // only nodes where bit b is 0 receive (they accumulate lower half)
        if ((i>>b)&1) pairs.push({from:i,to:j,dim:b,phase:1});
      }
      steps.push({ pairs, desc: `Fáze 1 krok ${b+1} (dim ${b}): uzly s bitem ${b}=1 pošlou nody s bitem ${b}=0`, phase:1 });
    }
    // Phase 2 (broadcast prefix): log p steps down
    for (let b=d-1; b>=0; b--) {
      const pairs = [];
      for (let i=0;i<p;i++) {
        const j = i ^ (1<<b);
        // nodes where bit b is 0 send to nodes where bit b is 1
        if (!((i>>b)&1)) pairs.push({from:i,to:j,dim:b,phase:2});
      }
      steps.push({ pairs, desc: `Fáze 2 krok ${d-b} (dim ${b}): uzly s bitem ${b}=0 pošlou prefix uzlům s bitem ${b}=1`, phase:2 });
    }
  }
}

function initState() {
  accum = [...initVals];
  prefixSums = Array(p).fill(0);
}

function applyStep(idx) {
  curStep = idx;
  const st = steps[idx];
  const pos = nodePositions();
  const dur = parseInt(document.getElementById('speed').value)/1000*0.5;

  if (mode === 'allreduce') {
    // Both sides simultaneously exchange and add
    const newAccum = [...accum];
    st.pairs.forEach(({from,to}) => { newAccum[to] += accum[from]; });
    accum = newAccum;
  } else {
    // Phase 1: receiver adds sender's accum
    // Phase 2: receiver sets its prefix from sender
    if (st.phase === 1) {
      const newAccum = [...accum];
      st.pairs.forEach(({from,to}) => { newAccum[to] += accum[from]; });
      accum = newAccum;
    } else {
      // phase 2: compute actual prefix sums
      const newPrefix = [...prefixSums];
      st.pairs.forEach(({from,to}) => {
        // sender has prefix sum for "lower nodes" — receiver = sender's prefix + sender's portion
        newPrefix[to] = prefixSums[from] + accum[from];
        // Note: simplified model — actual prefix sum is complex; show the idea
      });
      prefixSums = newPrefix;
    }
  }

  // Arrows
  st.pairs.forEach(({from,to}) => {
    if (pos[from]&&pos[to]) arrows.push({fx:pos[from].x,fy:pos[from].y,tx:pos[to].x,ty:pos[to].y,t:0,dur});
  });
  updateUI(idx);
  cancelAnimationFrame(animFrame); animFrame=requestAnimationFrame(ts=>drawFrame(ts));
}

function rebuildState(upTo) {
  initState();
  for (let i=0;i<=upTo;i++) {
    const st = steps[i];
    if (mode==='allreduce') {
      const newA=[...accum]; st.pairs.forEach(({from,to})=>{newA[to]+=accum[from];}); accum=newA;
    } else if (st.phase===1) {
      const newA=[...accum]; st.pairs.forEach(({from,to})=>{newA[to]+=accum[from];}); accum=newA;
    } else {
      const newP=[...prefixSums]; st.pairs.forEach(({from,to})=>{newP[to]=prefixSums[from]+accum[from];}); prefixSums=newP;
    }
  }
}

function nodePositions() {
  const W=cv.offsetWidth, H=310, cx=W/2, cy=H/2, R=Math.min(W,H)/2-38;
  const d=Math.log2(p); const pos=[];
  for (let i=0;i<p;i++) {
    let x=0,y=0;
    for (let b=0;b<d;b++) {
      if (b%2===0) x+=((i>>b)&1)*(R*1.7/(d>2?2:1));
      else          y+=((i>>b)&1)*(R*1.7/(d>2?2:1));
    }
    pos.push({x:cx-R*.85+x,y:cy-R*.85+y});
  }
  return pos;
}

function hypercubeEdges() {
  const e=[]; const d=Math.log2(p);
  for (let i=0;i<p;i++) for (let b=0;b<d;b++) if ((i>>b&1)===0) e.push([i,i|(1<<b)]);
  return e;
}

const cv = document.getElementById('cv'); const ctx = cv.getContext('2d');

function drawFrame(ts) {
  const W=cv.width=cv.offsetWidth, H=cv.height=310;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#252525'; ctx.fillRect(0,0,W,H);
  const pos=nodePositions(); const edgeList=hypercubeEdges();
  const curDim = curStep>=0 ? steps[curStep].dim : -1;

  // Edges — highlight current dimension
  edgeList.forEach(([a,b])=>{
    const diffBit=Math.log2(a^b);
    ctx.strokeStyle = (diffBit===curDim) ? '#0984e3' : '#3c3c3c';
    ctx.lineWidth = (diffBit===curDim) ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(pos[a].x,pos[a].y); ctx.lineTo(pos[b].x,pos[b].y); ctx.stroke();
  });

  // Animate arrows
  if (ts && lastTime) {
    const dt=(ts-lastTime)/1000;
    arrows.forEach(a=>a.t=Math.min(1,a.t+dt/a.dur));
    arrows=arrows.filter(a=>a.t<1);
  }
  lastTime=ts;
  arrows.forEach(ar=>{
    const x=ar.fx+(ar.tx-ar.fx)*ar.t, y=ar.fy+(ar.ty-ar.fy)*ar.t;
    ctx.beginPath(); ctx.moveTo(ar.fx,ar.fy); ctx.lineTo(x,y);
    ctx.strokeStyle='#0984e360'; ctx.lineWidth=2; ctx.stroke();
    const ang=Math.atan2(ar.ty-ar.fy,ar.tx-ar.fx);
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.lineTo(x-9*Math.cos(ang-.4),y-9*Math.sin(ang-.4));
    ctx.lineTo(x-9*Math.cos(ang+.4),y-9*Math.sin(ang+.4));
    ctx.closePath(); ctx.fillStyle='#0984e3'; ctx.fill();
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle='#c3e88d'; ctx.fill();
  });

  // Max value for color scaling
  const maxVal = accum.reduce((a,b)=>Math.max(a,Math.abs(b)),1);
  const totalSum = initVals.reduce((a,b)=>a+b,0);

  pos.forEach((pt,i)=>{
    const frac = accum[i]/totalSum;
    const r=18;
    // Background circle
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
    const isDone = mode==='allreduce' ? accum[i]===totalSum : false;
    ctx.fillStyle = isDone ? '#00b894' : '#3c3c3c'; ctx.fill();
    // Partial fill arc showing accumulation progress
    if (!isDone && frac>0 && frac<1) {
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y);
      ctx.arc(pt.x,pt.y,r,-Math.PI/2,-Math.PI/2+2*Math.PI*Math.min(frac,1));
      ctx.closePath(); ctx.fillStyle='#0984e3'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
    ctx.strokeStyle='#555'; ctx.lineWidth=1.5; ctx.stroke();

    ctx.fillStyle='#fff'; ctx.font='bold 9px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(i, pt.x, pt.y);

    // Value label
    ctx.font='9px monospace'; ctx.fillStyle='#c3e88d';
    ctx.fillText(accum[i], pt.x, pt.y+r+10);
    if (mode==='prefix' && prefixSums[i]>0) {
      ctx.fillStyle='#74b9ff'; ctx.fillText('p:'+prefixSums[i], pt.x, pt.y+r+20);
    }
  });

  ctx.font='10px sans-serif'; ctx.textBaseline='top'; ctx.textAlign='left'; ctx.fillStyle='#888';
  ctx.fillText('Modrá hrana = aktivní dimenze. Číslo pod uzlem = akumulátor.', 6, H-14);

  if (arrows.length>0) animFrame=requestAnimationFrame(ts=>drawFrame(ts));
}

function updateUI(step) {
  const total=steps.length;
  document.getElementById('progress').style.width=(total>0?(step+1)/total*100:0)+'%';
  document.getElementById('sCurStep').textContent=`${Math.max(0,step+1)}/${total}`;
  const msgs=steps.slice(0,step+1).reduce((a,s)=>a+s.pairs.length,0);
  document.getElementById('sMsgs').textContent=msgs;

  if (step<0) {
    document.getElementById('stepInfo').innerHTML=`Každý procesor P${0}…P${p-1} má vstupní hodnotu. Topologie: hyperkrychle. Cíl: <strong>${mode==='allreduce'?'každý dostane globální součet':'P<sub>i</sub> dostane součet hodnot P<sub>0</sub>…P<sub>i</sub>'}</strong>.`;
  } else {
    const st=steps[step];
    document.getElementById('stepInfo').innerHTML=`<strong>Krok ${step+1}/${total}:</strong> ${st.desc}<br>Zpráv v tomto kroku: <strong style="color:#c3e88d">${st.pairs.length}</strong>`;
  }

  // Node table
  const tbody=document.getElementById('nodeBody'); tbody.innerHTML='';
  for (let i=0;i<Math.min(p,8);i++) {
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>P${i}</td><td>${initVals[i]}</td><td class="acc">${accum[i]}</td>`+(mode==='prefix'?`<td class="prefix">${prefixSums[i]||'—'}</td>`:'');
    tbody.appendChild(tr);
  }

  // Derivation
  const d=Math.log2(p);
  if (mode==='allreduce') {
    document.getElementById('dAlg').textContent='All-Reduce';
    document.getElementById('dPhases').textContent='1 fáze (reduce + broadcast)';
    document.getElementById('dTs').textContent=`tₛ·log p = tₛ·${d}`;
    document.getElementById('dTw').textContent=`tᵥ·m·log p = tᵥ·m·${d}`;
    document.getElementById('dTotal').textContent=`(tₛ + tᵥ·m)·log p`;
    document.getElementById('dNote').textContent='Každý krok: výměna zprávy konstantní velikosti m přes 1 dimenzi.';
  } else {
    document.getElementById('dAlg').textContent='Prefix Sum';
    document.getElementById('dPhases').textContent='2 fáze × log p kroků';
    document.getElementById('dTs').textContent=`2·tₛ·log p = tₛ·${2*d}`;
    document.getElementById('dTw').textContent=`2·tᵥ·m·log p`;
    document.getElementById('dTotal').textContent=`2·(tₛ + tᵥ·m)·log p`;
    document.getElementById('dNote').textContent='Fáze 1: reduce k uzlu 0. Fáze 2: broadcast prefixů zpět.';
  }
}

function stepFwd(){if(curStep+1<steps.length)applyStep(curStep+1);}
function stepBack(){
  if(curStep>0){rebuildState(curStep-1);curStep--;arrows=[];updateUI(curStep);cancelAnimationFrame(animFrame);requestAnimationFrame(ts=>drawFrame(ts));}
  else{initState();curStep=-1;arrows=[];updateUI(-1);cancelAnimationFrame(animFrame);requestAnimationFrame(ts=>drawFrame(ts));}
}

let playTimer2=null;
function togglePlay(){
  playing=!playing;
  document.getElementById('playBtn').textContent=playing?'⏸ Pauza':'▶ Přehrát';
  if(playing){const go=()=>{if(curStep+1<steps.length){applyStep(curStep+1);playTimer2=setTimeout(go,parseInt(document.getElementById('speed').value));}else{playing=false;document.getElementById('playBtn').textContent='▶ Přehrát';}};go();}
  else clearTimeout(playTimer2);
}

function reset(){
  clearTimeout(playTimer2);playing=false;document.getElementById('playBtn').textContent='▶ Přehrát';
  initValsFrom();initState();buildSteps();curStep=-1;arrows=[];
  updateUI(-1);cancelAnimationFrame(animFrame);lastTime=null;requestAnimationFrame(ts=>drawFrame(ts));
}

function updateP(){
  const k=parseInt(document.getElementById('pSlider').value);
  p=Math.pow(2,k);document.getElementById('pVal').textContent=p;reset();
}

function switchMode(m){
  mode=m;
  document.getElementById('tabAllReduce').className='tab-btn'+(m==='allreduce'?' active':'');
  document.getElementById('tabPrefix').className='tab-btn'+(m==='prefix'?' active':'');
  document.getElementById('accHead').textContent=m==='allreduce'?'Akumulátor':'Akumulátor';
  document.getElementById('prefixHead').style.display=m==='prefix'?'':'none';
  reset();
}

updateP();
</script>
</body>
</html>
