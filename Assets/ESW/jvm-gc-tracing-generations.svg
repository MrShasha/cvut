<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">JVM tracing GC and generational heap</title>
  <desc id="desc">Diagram showing GC roots, reachable live objects, unreachable garbage, and a young to old generational heap flow.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#53627a"/>
    </marker>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #c9d1df; stroke-width: 2; }
      .title { font: 700 28px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 700 19px Arial, sans-serif; fill: #24324a; }
      .label { font: 600 15px Arial, sans-serif; fill: #24324a; }
      .small { font: 400 13px Arial, sans-serif; fill: #53627a; }
      .root { fill: #e8f1ff; stroke: #6a93d8; stroke-width: 1.5; }
      .live { fill: #eaf8ef; stroke: #62ad76; stroke-width: 1.8; }
      .dead { fill: #f3f4f7; stroke: #aab4c3; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .eden { fill: #fff2df; stroke: #d69a45; stroke-width: 1.5; }
      .surv { fill: #e8f1ff; stroke: #6a93d8; stroke-width: 1.5; }
      .old { fill: #eaf8ef; stroke: #62ad76; stroke-width: 1.5; }
      .arrow { stroke: #53627a; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8c98ab; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="50">Tracing GC: reachability first, generations for speed</text>
  <text class="small" x="48" y="78">GC keeps objects reachable from roots. Young generation is collected often because most objects die young.</text>

  <rect class="panel" x="45" y="110" width="535" height="560" rx="16"/>
  <text class="subtitle" x="70" y="145">1. Reachability graph</text>

  <rect class="root" x="80" y="178" width="120" height="44" rx="10"/>
  <text class="label" x="112" y="205">GC roots</text>

  <circle class="live" cx="155" cy="300" r="34"/>
  <text class="label" x="145" y="306">A</text>
  <circle class="live" cx="280" cy="300" r="34"/>
  <text class="label" x="270" y="306">B</text>
  <circle class="live" cx="405" cy="300" r="34"/>
  <text class="label" x="395" y="306">C</text>

  <path class="arrow" d="M 140 223 C 140 245, 145 260, 153 266"/>
  <path class="arrow" d="M 189 300 H 246"/>
  <path class="arrow" d="M 314 300 H 371"/>

  <circle class="dead" cx="180" cy="470" r="34"/>
  <text class="label" x="170" y="476">D</text>
  <circle class="dead" cx="315" cy="470" r="34"/>
  <text class="label" x="305" y="476">E</text>
  <path class="dash" d="M 214 470 H 281"/>
  <path class="dash" d="M 315 436 C 360 400, 240 400, 180 436"/>

  <text class="small" x="70" y="560">Reachable from roots: live</text>
  <rect class="live" x="70" y="578" width="24" height="18" rx="4"/>
  <text class="small" x="105" y="592">A, B, C stay alive</text>

  <text class="small" x="70" y="625">Not reachable from roots: garbage</text>
  <rect class="dead" x="70" y="643" width="24" height="18" rx="4"/>
  <text class="small" x="105" y="657">D and E can be reclaimed even if they reference each other</text>

  <rect class="panel" x="620" y="110" width="535" height="560" rx="16"/>
  <text class="subtitle" x="645" y="145">2. Generational heap flow</text>
  <text class="small" x="645" y="170">New objects start in Eden. Survivors are copied, then promoted to Old.</text>

  <rect class="eden" x="660" y="220" width="180" height="95" rx="12"/>
  <text class="label" x="725" y="255">Eden</text>
  <text class="small" x="692" y="282">new objects</text>

  <rect class="surv" x="900" y="220" width="180" height="95" rx="12"/>
  <text class="label" x="935" y="255">Survivor</text>
  <text class="small" x="927" y="282">after young GC</text>

  <rect class="old" x="780" y="410" width="180" height="95" rx="12"/>
  <text class="label" x="837" y="445">Old</text>
  <text class="small" x="815" y="472">long-lived</text>

  <path class="arrow" d="M 840 268 H 890"/>
  <text class="small" x="842" y="250">copy live</text>
  <path class="arrow" d="M 990 315 C 995 365, 950 395, 915 410"/>
  <text class="small" x="965" y="370">promote</text>
  <path class="arrow" d="M 715 315 C 700 380, 735 435, 780 450"/>
  <text class="small" x="655" y="377">large / aged</text>

  <rect class="panel" x="675" y="555" width="410" height="78" rx="12"/>
  <text class="label" x="705" y="584">Young GC</text>
  <text class="small" x="705" y="608">collects Eden + Survivor, copies only live objects, clears Eden</text>
</svg>
