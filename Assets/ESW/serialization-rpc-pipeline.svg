<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-label="Serialization and RPC pipeline">
  <rect width="1080" height="520" fill="#f7f9fb"/>
  <text x="540" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">Serialization and RPC pipeline</text>
  <text x="540" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#667085">Every remote call pays CPU, allocation, payload, transport and compatibility costs.</text>

  <g font-family="Arial, sans-serif">
    <rect x="54" y="145" width="150" height="90" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="129" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Object</text>
    <text x="129" y="204" text-anchor="middle" font-size="13" fill="#1e3a8a">fields, pointers</text>

    <rect x="252" y="145" width="150" height="90" rx="8" fill="#e0f2fe" stroke="#38bdf8"/>
    <text x="327" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#0e7490">Serializer</text>
    <text x="327" y="204" text-anchor="middle" font-size="13" fill="#0e7490">schema / parser</text>

    <rect x="450" y="145" width="150" height="90" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <text x="525" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#166534">Bytes</text>
    <text x="525" y="204" text-anchor="middle" font-size="13" fill="#166534">payload</text>

    <rect x="648" y="145" width="150" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="723" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#92400e">Transport</text>
    <text x="723" y="204" text-anchor="middle" font-size="13" fill="#92400e">HTTP/TCP/broker</text>

    <rect x="846" y="145" width="180" height="90" rx="8" fill="#fae8ff" stroke="#d946ef"/>
    <text x="936" y="178" text-anchor="middle" font-size="17" font-weight="700" fill="#86198f">Deserializer</text>
    <text x="936" y="204" text-anchor="middle" font-size="13" fill="#86198f">bytes -> object</text>

    <g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M204 190 H252"/>
      <path d="M402 190 H450"/>
      <path d="M600 190 H648"/>
      <path d="M798 190 H846"/>
    </g>

    <rect x="90" y="300" width="190" height="92" rx="8" fill="#ffffff" stroke="#d7dee8"/>
    <text x="185" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">CPU cost</text>
    <text x="185" y="354" text-anchor="middle" font-size="13" fill="#667085">parse text, varints, validation</text>
    <text x="185" y="376" text-anchor="middle" font-size="13" fill="#667085">reflection vs generated code</text>

    <rect x="325" y="300" width="190" height="92" rx="8" fill="#ffffff" stroke="#d7dee8"/>
    <text x="420" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Allocation cost</text>
    <text x="420" y="354" text-anchor="middle" font-size="13" fill="#667085">object materialization</text>
    <text x="420" y="376" text-anchor="middle" font-size="13" fill="#667085">temporary buffers</text>

    <rect x="560" y="300" width="190" height="92" rx="8" fill="#ffffff" stroke="#d7dee8"/>
    <text x="655" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Payload size</text>
    <text x="655" y="354" text-anchor="middle" font-size="13" fill="#667085">network time, compression</text>
    <text x="655" y="376" text-anchor="middle" font-size="13" fill="#667085">over-fetching / base64</text>

    <rect x="795" y="300" width="190" height="92" rx="8" fill="#ffffff" stroke="#d7dee8"/>
    <text x="890" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#172033">Compatibility</text>
    <text x="890" y="354" text-anchor="middle" font-size="13" fill="#667085">schema evolution</text>
    <text x="890" y="376" text-anchor="middle" font-size="13" fill="#667085">unknown fields / enums</text>

    <path d="M185 300 C220 255, 280 242, 327 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M420 300 C445 260, 485 244, 525 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M655 300 C670 260, 690 244, 723 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M890 300 C905 260, 920 244, 936 235" stroke="#94a3b8" stroke-width="2" fill="none"/>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
