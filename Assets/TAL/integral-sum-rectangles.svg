<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">Integralni odhad souctu pomoci obdelniku</title>
  <desc id="desc">Ctyri diagramy ukazuji, kdy obdelniky lezi nad nebo pod grafem rostouci a klesajici funkce.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .axis { stroke: #334155; stroke-width: 2; }
      .curve { fill: none; stroke: #0f172a; stroke-width: 4; stroke-linecap: round; }
      .rect-upper { fill: #f97316; fill-opacity: .34; stroke: #ea580c; stroke-width: 1.8; }
      .rect-lower { fill: #22c55e; fill-opacity: .34; stroke: #16a34a; stroke-width: 1.8; }
      .title { fill: #0f172a; font: 700 22px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #475569; font: 600 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .formula { fill: #1e293b; font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #64748b; font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .legend-upper { fill: #fed7aa; stroke: #ea580c; stroke-width: 1.5; }
      .legend-lower { fill: #bbf7d0; stroke: #16a34a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="760" rx="18"/>

  <text class="title" x="36" y="42">Integrální odhad součtu přes obdélníky</text>
  <text class="subtitle" x="36" y="70">Součet Σ f(i) je plocha obdélníků šířky 1. Podle posunutí obdélníků dostaneme horní nebo dolní odhad integrálu.</text>

  <rect class="legend-upper" x="822" y="26" width="22" height="16" rx="3"/>
  <text class="small" x="852" y="39">obdélníky nad grafem = horní odhad</text>
  <rect class="legend-lower" x="822" y="52" width="22" height="16" rx="3"/>
  <text class="small" x="852" y="65">obdélníky pod grafem = dolní odhad</text>

  <!-- Panel 1: increasing, upper estimate -->
  <g transform="translate(36 105)">
    <rect class="panel" width="520" height="270" rx="10"/>
    <text class="title" x="22" y="34">Rostoucí funkce: pravý kraj</text>
    <text class="subtitle" x="22" y="57">výška f(i) na intervalu [i-1, i]</text>
    <line class="grid" x1="64" y1="81" x2="64" y2="225"/>
    <line class="grid" x1="124" y1="81" x2="124" y2="225"/>
    <line class="grid" x1="184" y1="81" x2="184" y2="225"/>
    <line class="grid" x1="244" y1="81" x2="244" y2="225"/>
    <line class="grid" x1="304" y1="81" x2="304" y2="225"/>
    <line class="grid" x1="364" y1="81" x2="364" y2="225"/>
    <line class="axis" x1="48" y1="225" x2="410" y2="225"/>
    <line class="axis" x1="64" y1="230" x2="64" y2="76"/>
    <rect class="rect-upper" x="64" y="187" width="60" height="38"/>
    <rect class="rect-upper" x="124" y="174" width="60" height="51"/>
    <rect class="rect-upper" x="184" y="157" width="60" height="68"/>
    <rect class="rect-upper" x="244" y="135" width="60" height="90"/>
    <rect class="rect-upper" x="304" y="108" width="60" height="117"/>
    <path class="curve" d="M64 205 L124 187 L184 174 L244 157 L304 135 L364 108"/>
    <text class="formula" x="70" y="253">∫₀ⁿ f(x) dx ≤ Σ f(i)</text>
    <text class="small" x="410" y="225">x</text>
    <text class="small" x="54" y="86">f</text>
  </g>

  <!-- Panel 2: increasing, lower estimate -->
  <g transform="translate(584 105)">
    <rect class="panel" width="520" height="270" rx="10"/>
    <text class="title" x="22" y="34">Rostoucí funkce: levý kraj</text>
    <text class="subtitle" x="22" y="57">stejné výšky f(i), ale intervaly [i, i+1]</text>
    <line class="grid" x1="64" y1="81" x2="64" y2="225"/>
    <line class="grid" x1="124" y1="81" x2="124" y2="225"/>
    <line class="grid" x1="184" y1="81" x2="184" y2="225"/>
    <line class="grid" x1="244" y1="81" x2="244" y2="225"/>
    <line class="grid" x1="304" y1="81" x2="304" y2="225"/>
    <line class="grid" x1="364" y1="81" x2="364" y2="225"/>
    <line class="axis" x1="48" y1="225" x2="410" y2="225"/>
    <line class="axis" x1="64" y1="230" x2="64" y2="76"/>
    <rect class="rect-lower" x="124" y="187" width="60" height="38"/>
    <rect class="rect-lower" x="184" y="174" width="60" height="51"/>
    <rect class="rect-lower" x="244" y="157" width="60" height="68"/>
    <rect class="rect-lower" x="304" y="135" width="60" height="90"/>
    <rect class="rect-lower" x="364" y="108" width="60" height="117"/>
    <path class="curve" d="M64 205 L124 187 L184 174 L244 157 L304 135 L364 108 L424 78"/>
    <text class="formula" x="70" y="253">Σ f(i) ≤ ∫₁ⁿ⁺¹ f(x) dx</text>
    <text class="small" x="410" y="225">x</text>
    <text class="small" x="54" y="86">f</text>
  </g>

  <!-- Panel 3: decreasing, lower estimate -->
  <g transform="translate(36 420)">
    <rect class="panel" width="520" height="270" rx="10"/>
    <text class="title" x="22" y="34">Klesající funkce: pravý kraj</text>
    <text class="subtitle" x="22" y="57">výška f(i) na intervalu [i-1, i]</text>
    <line class="grid" x1="64" y1="81" x2="64" y2="225"/>
    <line class="grid" x1="124" y1="81" x2="124" y2="225"/>
    <line class="grid" x1="184" y1="81" x2="184" y2="225"/>
    <line class="grid" x1="244" y1="81" x2="244" y2="225"/>
    <line class="grid" x1="304" y1="81" x2="304" y2="225"/>
    <line class="grid" x1="364" y1="81" x2="364" y2="225"/>
    <line class="axis" x1="48" y1="225" x2="410" y2="225"/>
    <line class="axis" x1="64" y1="230" x2="64" y2="76"/>
    <rect class="rect-lower" x="64" y="108" width="60" height="117"/>
    <rect class="rect-lower" x="124" y="135" width="60" height="90"/>
    <rect class="rect-lower" x="184" y="157" width="60" height="68"/>
    <rect class="rect-lower" x="244" y="174" width="60" height="51"/>
    <rect class="rect-lower" x="304" y="187" width="60" height="38"/>
    <path class="curve" d="M64 78 L124 108 L184 135 L244 157 L304 174 L364 187"/>
    <text class="formula" x="70" y="253">Σ f(i) ≤ ∫₀ⁿ f(x) dx</text>
    <text class="small" x="410" y="225">x</text>
    <text class="small" x="54" y="86">f</text>
  </g>

  <!-- Panel 4: decreasing, upper estimate -->
  <g transform="translate(584 420)">
    <rect class="panel" width="520" height="270" rx="10"/>
    <text class="title" x="22" y="34">Klesající funkce: posunuté doprava</text>
    <text class="subtitle" x="22" y="57">stejné výšky f(i), ale intervaly [i, i+1]</text>
    <line class="grid" x1="64" y1="81" x2="64" y2="225"/>
    <line class="grid" x1="124" y1="81" x2="124" y2="225"/>
    <line class="grid" x1="184" y1="81" x2="184" y2="225"/>
    <line class="grid" x1="244" y1="81" x2="244" y2="225"/>
    <line class="grid" x1="304" y1="81" x2="304" y2="225"/>
    <line class="grid" x1="364" y1="81" x2="364" y2="225"/>
    <line class="axis" x1="48" y1="225" x2="430" y2="225"/>
    <line class="axis" x1="64" y1="230" x2="64" y2="76"/>
    <rect class="rect-upper" x="124" y="108" width="60" height="117"/>
    <rect class="rect-upper" x="184" y="135" width="60" height="90"/>
    <rect class="rect-upper" x="244" y="157" width="60" height="68"/>
    <rect class="rect-upper" x="304" y="174" width="60" height="51"/>
    <rect class="rect-upper" x="364" y="187" width="60" height="38"/>
    <path class="curve" d="M64 78 L124 108 L184 135 L244 157 L304 174 L364 187 L424 205"/>
    <text class="formula" x="70" y="253">∫₁ⁿ⁺¹ f(x) dx ≤ Σ f(i)</text>
    <text class="small" x="432" y="225">x</text>
    <text class="small" x="54" y="86">f</text>
  </g>
</svg>
